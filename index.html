<style>
:root{
  --bg:#0B0B0C; --panel:#111113; --panel2:#17171A; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
  --fg:#ECEAE7; --dim:#8A8A90; --dim2:#5C5C64; --acc:#C2A170; --accSoft:rgba(194,161,112,.13);
  --ok:#86A98C; --warn:#C98F86; --r:18px; --rs:12px;
  --android:#7FB7A3; --sites:#C2A170; --pdd:#8FA2C8; --content:#C98F86; --study:#9D93B8; --body:#A9B08E; --life:#8A8A90;
}
html[data-theme="light"]{
  --bg:#F3F1EC; --panel:#FFFFFF; --panel2:#FAF8F4; --line:rgba(18,21,28,.11); --line2:rgba(18,21,28,.07);
  --fg:#12151C; --dim:#6E747E; --dim2:#A2A7AE; --acc:#A96410; --accSoft:rgba(169,100,16,.10);
  --ok:#4F7A57; --warn:#A8584C;
  --android:#2F7F67; --sites:#A96410; --pdd:#44618F; --content:#A05A50; --study:#5F5485; --body:#5E6B3C; --life:#6E747E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
html{scrollbar-gutter:stable}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.mono{font-variant-numeric:tabular-nums}
.lab{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2);font-weight:500;overflow-wrap:anywhere}
.dim{color:var(--dim)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* ---------- shell ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.top-in{max-width:860px;margin:0 auto;padding:9px 18px;min-height:56px;display:flex;align-items:center;gap:12px}
.topgap{height:calc(57px + env(safe-area-inset-top))}
#modeChip{min-width:104px;justify-content:center}
.brand{font-size:14.5px;letter-spacing:.01em;font-weight:500;white-space:nowrap}
.brand b{font-weight:600}
.brand span{color:var(--acc)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:11.5px;color:var(--dim);background:var(--panel);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 3px}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.acc{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);background:var(--accSoft)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--fg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  background:var(--bg);border-top:1px solid var(--line2);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim2);font-size:10px;letter-spacing:.04em;padding:4px 0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px 17px;margin:14px 0}
.card.pad0{padding:0;overflow:hidden}
.h1{font-size:clamp(21px,6.2vw,25px);font-weight:300;letter-spacing:-.015em;margin:22px 0 2px;min-width:0;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--dim)}
.h2{font-size:12.5px;font-weight:500;letter-spacing:.02em;margin:0 0 10px}
.sect{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sect .line{flex:1;height:1px;background:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;font-size:13.5px;color:var(--fg);background:var(--panel);transition:.15s}
.btn svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.pri svg{stroke-width:2}
.btn:hover{border-color:var(--dim2)}
.btn.pri{background:var(--acc);color:#0B0B0C;border-color:var(--acc);font-weight:500}
html[data-theme="light"] .btn.pri{color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:0 1 auto;min-width:0;max-width:100%}
.dayhead .datenav{flex:0 0 auto}

/* ---------- day ---------- */
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.dayhead.tight{align-items:center;gap:10px;margin:20px 0 0}
.dayhead.tight .h1{margin:0;line-height:1.16;flex:0 1 auto}
.dayhead.tight .datenav{gap:5px}
.dayhead.tight .iconbtn{width:30px;height:30px;border-radius:9px;background:transparent}
.dayhead.tight .iconbtn svg{width:16px;height:16px}
.datenav{display:flex;gap:6px;align-items:center}
/* тонкая строка под датой: метка дня, щит, предупреждения */
.submeta{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin:6px 0 16px;
  font-size:12px;line-height:1.7;color:var(--dim)}
.submeta .sep{color:var(--dim2);opacity:.6}
.smb{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:var(--dim);
  cursor:pointer;border-bottom:1px dashed var(--line);transition:color .15s,border-color .15s}
.smb b{font-weight:600;color:var(--fg)}
.smb:hover{color:var(--fg);border-bottom-color:var(--dim2)}
.smb.on{color:var(--acc);border-bottom-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.smb.on b{color:var(--acc)}
.smb.warn{color:var(--warn);border-bottom-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.smb.warn b{color:var(--warn)}
.submeta .stat{border-bottom:0;cursor:default}
.load{display:flex;gap:2px;height:6px;border-radius:4px;overflow:hidden;background:var(--line2);margin:14px 0 9px}
.load i{display:block;height:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}

.tl{margin:4px -4px}
.item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);position:relative}
.item:last-child{border-bottom:0}
.item .time{width:52px;flex:0 0 52px;font-size:12.5px;color:var(--dim);padding-top:2px;line-height:1.35}
.item .time s{display:block;text-decoration:none;color:var(--dim2);font-size:11px}
.item .time.at{color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.item .time.at s{color:var(--dim2);font-weight:400}
.item .time .no{display:block;font-size:15px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.item .time .du{display:block;font-size:11px;color:var(--dim2);margin-top:1px}
.item .bar{width:2px;border-radius:2px;background:var(--c,var(--acc));opacity:.75;flex:0 0 2px}
.item .mid{flex:1;min-width:0}
.item .ttl{font-size:14.5px;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.item .ttl>span{min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.item .note{font-size:11.5px;color:var(--dim2);margin-top:3px;font-style:italic}
.item .acts{display:flex;align-items:flex-start;gap:3px;padding-top:1px}
.item.done .ttl{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.item.done .bar{opacity:.3}
.item.drag{opacity:.35}
.grip{width:26px;height:34px;flex:0 0 26px;display:grid;place-items:center;color:var(--line);
  border-radius:8px;border:1px solid transparent;touch-action:none;cursor:grab}
.grip:hover{color:var(--dim2);border-color:var(--line)}
.grip:active{cursor:grabbing}
.grip svg{width:14px;height:14px;fill:currentColor;stroke:none}
.item.dropon{background:color-mix(in srgb,var(--acc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);border-radius:12px}
.ghostrow.ok{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.ghostrow{position:fixed;z-index:80;pointer-events:none;max-width:72vw;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:var(--panel);color:var(--fg);font-size:13.5px;padding:9px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 16px 36px rgba(0,0,0,.5);opacity:.97}
.ghostrow i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:8px;vertical-align:1px}
body.dragging{user-select:none;-webkit-user-select:none}
.chk{width:22px;height:22px;border-radius:7px;border:1.4px solid var(--line);flex:0 0 22px;display:grid;place-items:center;margin-top:1px}
.chk svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--acc);border-color:var(--acc)}
.item.done .chk svg{opacity:1}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim2);border:1px solid transparent}
.mini:hover{color:var(--fg);border-color:var(--line)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mini.run{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accSoft)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim2)}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.brk{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 68px;font-size:11px;color:var(--dim2)}
.brk .l{flex:1;height:1px;background:var(--line2)}
.pbar{height:3px;background:var(--line2);border-radius:3px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--acc));opacity:.8}

/* rings */
.ring{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dasharray .4s}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400}
.statrow{display:flex;gap:16px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border-radius:var(--rs);overflow:hidden}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{background:var(--panel);padding:13px 12px}
.statgrid b{display:block;font-size:19px;font-weight:300;margin-top:3px;overflow-wrap:anywhere}
.statgrid.p2 div{background:var(--panel2)}

/* week */
.wkday{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.wkday:last-child{border-bottom:0}
.wkday .d{width:54px;flex:0 0 54px}
.wkday .d b{display:block;font-size:15px;font-weight:400}
.wkday .d s{display:block;text-decoration:none;font-size:11px;color:var(--dim2)}
.wkday .info{flex:1;min-width:0}
.wkday .info .t{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkday.today{background:var(--accSoft);border-radius:10px;padding-left:9px;padding-right:9px}
.mini-ring{width:34px;height:34px;flex:0 0 34px;position:relative}
.mini-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;color:var(--dim)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:3px;border-radius:2px;background:var(--c);opacity:.85}

/* tasks */
.trow{display:flex;gap:11px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-size:14px;overflow-wrap:anywhere}
.trow .mt{font-size:11.5px;color:var(--dim);margin-top:2px}
.trow.off .nm,.trow.off .mt{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
/* метка времени: переключатель, крупная цифра и ползунок */
.timebox{margin:2px 0 16px;padding:13px 14px 9px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--panel2)}
.tbig{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.tbig b{font-size:30px;font-weight:600;letter-spacing:.01em;color:var(--acc);font-variant-numeric:tabular-nums;min-width:104px;text-align:center}
.tbig .iconbtn{width:38px;height:38px;flex:0 0 38px;font-size:19px;line-height:1}
.tscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);letter-spacing:.06em;margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;display:block}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;
  background:var(--acc);border:4px solid var(--panel);box-shadow:0 2px 9px rgba(0,0,0,.45);cursor:pointer}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line);border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);
  border:4px solid var(--panel);box-shadow:0 2px 9px rgba(0,0,0,.45);cursor:pointer}
.sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);position:relative;flex:0 0 38px;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim2);transition:.18s}
.sw.on{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.sw.on i{left:18px;background:var(--acc)}

/* flow */
.stage{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.stage:last-child{border-bottom:0}
.stage .nm{flex:1;min-width:0;font-size:14px}
.stage .st{font-size:11px;color:var(--dim)}
.sbar{display:flex;gap:4px;margin:10px 0 2px}
.sbar div{flex:1;min-width:0;text-align:center;font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim2);
  padding:7px 1px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar div b{display:block;font-size:15px;color:var(--fg);font-weight:300;margin-top:2px}

/* progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line2);position:relative}
.heat i.l1{background:color-mix(in srgb,var(--acc) 22%,var(--line2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 48%,var(--line2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 78%,var(--line2))}
.heat i.sh{box-shadow:inset 0 0 0 1.4px var(--pdd)}
.heat i.tdy{box-shadow:inset 0 0 0 1.4px var(--fg)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar2{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bar2 .n{width:76px;flex:0 0 76px;color:var(--dim)}
.bar2 .t{flex:1;height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar2 .t i{display:block;height:100%;background:var(--c);opacity:.85}
.bar2 .v{width:104px;flex:0 0 104px;text-align:right;color:var(--dim);font-size:11.5px;white-space:nowrap}
.bar2 .v s{text-decoration:none;color:var(--dim2)}
.bar2 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.badge:last-child{border-bottom:0}
.badge .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--dim2);overflow:hidden;text-align:center}
.badge .ic.l3{font-size:11px}
.badge .ic.l4{font-size:9.5px;letter-spacing:-.03em}
.badge.got .ic{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc);background:var(--accSoft)}
.badge .nm{font-size:13.5px}
.badge.got .nm{color:var(--fg)}
.badge:not(.got) .nm{color:var(--dim)}
.badge .ds{font-size:11.5px;color:var(--dim2)}
.badge .pg{height:3px;border-radius:2px;background:var(--line2);margin-top:6px;max-width:190px;overflow:hidden}
.badge .pg i{display:block;height:100%;background:var(--dim2);border-radius:2px}
.badge .bct{font-size:11px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge .bok{width:18px;height:18px;color:var(--acc);flex:0 0 auto}
.badge .bok svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.picklist{max-height:48vh;overflow:auto;margin:0 -2px 2px;padding:0 2px}
.pickrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--fg)}
.pickrow>i{width:3px;height:24px;border-radius:2px;flex:0 0 3px}
.pickrow .pn{flex:1;min-width:0;font-size:14px;overflow:hidden}
.pickrow .sub{display:block;font-style:normal;font-size:11px;line-height:1.35;color:var(--dim2);margin-top:3px}
.pickrow .sub.warn{color:var(--warn)}
.pickrow.on{border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:var(--accSoft)}
.pickrow.on .pm{color:var(--acc)}
.pickrow .pm{font-size:11.5px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mbar{display:flex;gap:1px;margin:15px 0 0;background:var(--line2);border-radius:var(--rs);overflow:hidden}
.mbar>div{flex:1;background:var(--panel2);padding:10px 11px;min-width:0;overflow:hidden}
.mbar span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);line-height:1.3;min-height:26px}
.mbar b{font-size:13.5px;font-weight:400;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--dim);background:var(--panel2)}
.seg button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.why{display:inline-flex;align-items:center;gap:6px;margin-top:3px;padding:0;border:0;background:none;color:var(--dim);font-size:12.5px;text-align:left;line-height:1.4}
.why i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;flex:0 0 15px;border:1px solid var(--line);border-radius:50%;font-style:normal;font-size:10px;color:var(--dim)}
.seg.wrap button{display:inline-flex;align-items:center;gap:6px}
.cdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.days button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.days{display:flex;gap:5px}
.days button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--dim);background:var(--panel2)}
.days button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet .cardx{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.shbar{position:sticky;top:0;z-index:6;background:var(--panel);margin:-10px -18px 10px;padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:center;border-radius:22px 22px 0 0}
.shclose{position:absolute;right:12px;top:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.shclose:active{background:var(--line2);color:var(--fg)}
#sheet #sheetBody>.row-btns:last-child{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));z-index:5;
  background:var(--panel);margin:16px 0 0;padding:13px 0 calc(14px + env(safe-area-inset-bottom));

.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;transform:translateY(10px);
  bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:0;border-radius:16px;
  font-size:13px;line-height:1.45;text-align:left;overflow:hidden;
  max-width:min(92vw,440px);opacity:0;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -20px rgba(0,0,0,.9);
  transition:opacity .2s ease,transform .26s cubic-bezier(.2,.85,.3,1)}
.toast.on{opacity:1;transform:translateY(0)}
.toast .tin{display:flex;align-items:stretch}
.toast .tmsg{flex:1;min-width:0;align-self:center;padding:11px 15px;overflow-wrap:anywhere}
.toast:not(.act) .tmsg{text-align:center}
.toast .tundo{flex:0 0 auto;display:flex;align-items:center;padding:0 16px;min-height:46px;
  border-left:1px solid var(--line);color:var(--acc);font-size:13px;font-weight:500;white-space:nowrap}
.toast .tundo:active{background:var(--accSoft)}
.toast .tbar{display:block;height:2px;background:var(--acc);opacity:.5;transform-origin:left center}
.toast.act .tbar{animation:drain 3.4s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.act{pointer-events:auto}
#sheet.open ~ .toast{top:calc(9px + env(safe-area-inset-top));bottom:auto;transform:translateY(-10px)}
#sheet.open ~ .toast.on{transform:translateY(0)}

<script>
'use strict';
/* ============================ storage ============================ */
var KEY='devnprt.planner.v1', MEM=null;
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return MEM}}
function prune(){
  if(S.log)for(var d in S.log){var L=S.log[d];if(!L||(!L.shield&&!L.wake&&!L.sleep))delete S.log[d]}
  if(S.items)for(var k in S.items){if(!S.items[k]||!S.items[k].length)delete S.items[k]}
}
function save(){try{prune();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){MEM=S}}
var uid=function(){return Math.random().toString(36).slice(2,9)};

/* ============================ utils ============================ */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var prs=function(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
var todayIso=function(){return iso(new Date())};
var wday=function(s){var n=prs(s).getDay();return n===0?7:n};
var addD=function(s,n){var d=prs(s);d.setDate(d.getDate()+n);return iso(d)};
var monday=function(s){return addD(s,1-wday(s))};
var wserial=function(s){return Math.round((prs(monday(s))-prs('2024-01-01'))/6048e5)};
var t2m=function(t){var a=t.split(':');return (+a[0])*60+(+a[1])};
var m2t=function(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
/* отбой после полуночи относится к этим же суткам: 00:30 это конец дня, а не его начало */
/* окно дня: обычно из настроек, но у отдельного дня может быть своя смена */
function winOf(d){
  var L=(d&&S.log&&S.log[d])||{};
  return {wake:L.wake||S.settings.wake, sleep:L.sleep||S.settings.sleep, own:!!(L.wake||L.sleep)};
}
var dayStart=function(d){return t2m(winOf(d).wake)};
var dayEnd=function(d){var w=winOf(d),a=t2m(w.wake),e=t2m(w.sleep);if(e<=a)e+=1440;return e-30};
var hm=function(m){if(m<=0)return '0 мин';var h=Math.floor(m/60),x=m%60;return (h?h+' ч':'')+(h&&x?' ':'')+(x?x+' мин':'')};
var hmS=function(m){var h=m/60;return (Math.round(h*10)/10).toString().replace('.',',')+' ч'};
var MONTH=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WDL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var WDS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var dateLong=function(s){var d=prs(s);return WDL[wday(s)-1]+', '+d.getDate()+' '+MONTH[d.getMonth()]};
var dateShort=function(s){var d=prs(s);return d.getDate()+' '+MONTH[d.getMonth()].slice(0,3)};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})};
/* ============================ категории ============================ */
var BASECATS=[
  {id:'android',name:'Android',color:'#7FB7A3'},
  {id:'sites',name:'Сайты',color:'#C2A170'},
  {id:'pdd',name:'Права',color:'#8FA2C8'},
  {id:'content',name:'Контент',color:'#C98F86'},
  {id:'study',name:'ТИСБИ',color:'#9D93B8'},
  {id:'body',name:'Тело',color:'#A9B08E'},
  {id:'work',name:'Работа',color:'#6FA8C9'},
  {id:'life',name:'Прочее',color:'#8A8A90'}
];
var PALETTE=['#C2A170','#7FB7A3','#8FA2C8','#C98F86','#9D93B8','#A9B08E','#8A8A90','#D2A3A3','#86B3C9','#BBA77F'];
function cats(){ if(!S.cats||!S.cats.length)S.cats=JSON.parse(JSON.stringify(BASECATS)); return S.cats }
function catOf(k){var c=cats().filter(function(x){return x.id===k})[0];return c||{id:k||'life',name:'Прочее',color:'#8A8A90'}}
function catName(k){return catOf(k).name}
function catColor(k){return catOf(k).color}
function catKeys(){return cats().map(function(c){return c.id})}

/* ============================ дела дня ============================
   Дело живёт в своём дне. Правка меняет только этот день.
   Повтор и копии создают отдельные дела в других днях. */
function I(o){
  var b={id:uid(),title:'',dir:'sites',min:60,ord:500,at:null,with:[],note:'',
         core:false,optional:false,done:0,skip:false,rep:null};
  for(var k in o)b[k]=o[k];
  if(!b.with)b.with=[];
  if(!b.at)b.at=null;
  return b;
}
function dayList(d){ if(!S.items)S.items={}; return S.items[d]||[] }
function dayListW(d){ if(!S.items)S.items={}; if(!S.items[d])S.items[d]=[]; return S.items[d] }
function findItem(d,id){var a=dayList(d),i;for(i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function addItem(d,o){var a=dayListW(d),it=I(o);a.push(it);return it}
function delItem(d,id){
  if(!S.items||!S.items[d])return false;
  S.items[d]=S.items[d].filter(function(x){return x.id!==id});
  S.items[d].forEach(function(x){x.with=(x.with||[]).filter(function(w){return w!==id})});
  if(!S.items[d].length)delete S.items[d];
  return true;
}
function cloneItem(t,keepLinks){
  var c=JSON.parse(JSON.stringify(t));
  c.id=uid(); c.done=0; c.skip=false;
  if(!keepLinks)c.with=[];
  return c;
}
/* дни, в которых вообще что-то есть */
function dayKeys(){ if(!S.items)S.items={}; return Object.keys(S.items).sort() }
function lastDay(){var k=dayKeys();return k.length?k[k.length-1]:null}
function monthEnd(s){var p=prs(s);return iso(new Date(p.getFullYear(),p.getMonth()+1,0))}
function monthStart(s){var p=prs(s);return iso(new Date(p.getFullYear(),p.getMonth(),1))}

/* ============================ стартовое наполнение ============================
   Используется один раз: при первом запуске и при переносе старых данных. */
var STARTER=[
  {k:'morning',title:'Подъём, душ, завтрак',dir:'life',min:35,ord:10,at:'06:00',days:[1,2,3,4,5,6,7]},
  {k:'tisbi-mon',title:'ТИСБИ, пары',dir:'study',min:170,ord:120,at:'08:00',days:[1],optional:true,
   note:'Дистант: ходить необязательно, практику всё равно сдавать'},
  {k:'tisbi-odd',title:'ТИСБИ, пары',dir:'study',min:260,ord:120,at:'08:00',days:[6],weeks:'odd',optional:true,
   note:'Нечётная неделя: 8:00 до 12:20'},
  {k:'tisbi-even',title:'ТИСБИ, пары',dir:'study',min:170,ord:120,at:'09:30',days:[6],weeks:'even',optional:true,
   note:'Чётная неделя: 9:30 до 12:20'},
  {k:'lunch',title:'Обед',dir:'life',min:30,ord:400,at:'12:40',days:[1,2,3,4,5,6,7]},
  {k:'dinner',title:'Ужин',dir:'life',min:30,ord:650,at:'19:00',days:[1,2,3,4,5,6,7]},
  {k:'gym',title:'Зал',dir:'body',min:90,ord:800,at:'20:50',days:[2,4,6],
   note:'Минимум полтора часа вместе с дорогой и душем'},
  {k:'sites1',title:'Ответы и поиск клиентов',dir:'sites',min:60,ord:200,days:[1,2,3,4,5,6],core:true,
   note:'Сначала ответы по переписке, потом новые адресаты'},
  {k:'android1',title:'Android, основной блок',dir:'android',min:90,ord:250,days:[1,2,3,4,5,6,7],core:true,
   note:'Свежая голова: первый заход не меньше полутора часов'},
  {k:'sites2',title:'Разработка сайта',dir:'sites',min:150,ord:450,days:[1,2,3,4]},
  {k:'shoot',title:'Съёмка',dir:'content',min:90,ord:470,days:[5]},
  {k:'pract',title:'Практика по дистанту',dir:'study',min:90,ord:480,days:[7],
   note:'Задачи ТИСБИ, без привязки к парам'},
  {k:'android2',title:'Android, практика',dir:'android',min:120,ord:520,days:[3,4,5,6],
   note:'Второй заход: практика, разбор ошибок, свой проект'},
  {k:'edit',title:'Монтаж ролика',dir:'content',min:120,ord:560,days:[7]},
  {k:'loc',title:'Поиск локации и референсов',dir:'content',min:60,ord:600,days:[2]},
  {k:'pdd1',title:'ПДД, билеты',dir:'pdd',min:60,ord:700,days:[1,2,3,4,5,6,7],core:true},
  {k:'pdd2',title:'ПДД, разбор на ходу',dir:'pdd',min:40,ord:810,days:[2,4,6],with:['gym'],
   note:'Вместе с залом: билеты между подходами, теория на кардио'},
  {k:'insta',title:'Инстаграм: сторис, ответы, публикация',dir:'content',min:20,ord:900,days:[1,2,3,4,5,6,7]}
];
var ONCE=[
  {date:'2026-11-07',title:'Вождение',dir:'pdd',min:120,ord:300,at:'15:00'},
  {date:'2026-11-14',title:'Вождение',dir:'pdd',min:120,ord:300,at:'08:00'},
  {date:'2026-11-15',title:'Вождение',dir:'pdd',min:120,ord:300,at:'19:00'}
];
/* ======== смена на объекте: фундаментные работы, 06:00 до 16:00 ========
   Дни заданы списком, поэтому смену легко продлить или отменить:
   добавьте или уберите дату в SHIFT.days. */
var SHIFT={
  days:['2026-11-12','2026-11-13',
        '2026-11-17','2026-11-18','2026-11-19','2026-11-20',
        '2026-11-24','2026-11-25','2026-11-26','2026-11-27'],
  wake:'05:00',
  add:[
    {k:'road1',title:'Дорога на объект',dir:'work',min:30,ord:60,at:'05:30'},
    {k:'shift',title:'Фундаментные работы',dir:'work',min:600,ord:70,at:'06:00',
     note:'Смена с 6:00 до 16:00. Еда и перерывы внутри смены, отдельным делом не считаются'},
    {k:'road2',title:'Дорога домой',dir:'work',min:30,ord:80,at:'16:00'},
    {k:'reset',title:'Душ и перекус',dir:'life',min:25,ord:100,
     note:'Переключение со смены на вечер, без него вечер съедается усталостью'}
  ],
  /* что в день смены не ставится: либо внутри смены, либо не влезает */
  drop:['lunch','sites2','android2','loc','shoot','pract'],
  /* правки обычных дел под смену */
  tune:{
    morning:{at:'05:00',min:30},
    dinner:{at:'18:40'},
    sites1:{min:90,note:'Вечерний блок после смены: сперва ответы, потом новые адресаты'},
    android1:{min:90,core:false,optional:true,
      note:'После смены это поддержание, а не погружение. Выжаты - снимайте без вины, длинный заход по Android стоит в выходной'},
    pdd1:{min:30}
  }
};
function isShift(d){return SHIFT.days.indexOf(d)>=0}
/* разложить смену в день: идемпотентно, можно звать сколько угодно раз */
function applyShift(d){
  if(!isShift(d))return;
  var L=logOf(d); if(!L.wake)L.wake=SHIFT.wake;
  var list=dayListW(d);
  /* снять лишнее, но не трогать то, где уже записано время */
  var gone={},kept=[];
  S.items[d]=list.filter(function(x){
    var k=String(x.rep||'').slice(2);
    if(SHIFT.drop.indexOf(k)>=0){
      if(+x.done>0){kept.push(x);return true}  /* уже отмечено: не теряем, привяжем к смене */
      gone[x.id]=1;return false;
    }
    return true;
  });
  list=S.items[d];
  /* в дни с залом билеты уже идут вместе с ним, отдельный блок лишний */
  if(list.some(function(x){return x.rep==='r-gym'})){
    S.items[d]=list.filter(function(x){
      if(x.rep==='r-pdd1'&&!(+x.done>0)){gone[x.id]=1;return false}
      return true;
    });
    list=S.items[d];
  }
  list.forEach(function(x){x.with=(x.with||[]).filter(function(w){return !gone[w]})});
  list.forEach(function(x){
    var t=SHIFT.tune[String(x.rep||'').slice(2)];
    if(!t)return;
    for(var f in t)x[f]=t[f];
  });
  SHIFT.add.forEach(function(r){
    if(list.some(function(x){return x.rep==='r-'+r.k}))return;
    list.push(I({title:r.title,dir:r.dir,min:r.min,ord:r.ord,at:r.at||null,note:r.note||'',rep:'r-'+r.k}));
  });
  /* то, что уже отмечено, идёт внутри смены, а не спорит с ней за час */
  var sh=list.filter(function(x){return x.rep==='r-shift'})[0];
  if(sh)kept.forEach(function(x){
    if(x.with.indexOf(sh.id)<0)x.with.push(sh.id);
    if(sh.with.indexOf(x.id)<0)sh.with.push(x.id);
  });
}

/* дни, где стартовое расписание само подвинуто или снято */
var SEEDSKIP={'2026-11-14':['tisbi-odd']};
var SEEDAT={'2026-11-09':{lunch:'14:10'},'2026-11-15':{dinner:'17:30'}};
var ODDBASE={serial:wserial('2026-11-02'),odd:false};
function oddWeek(d){return (Math.abs(wserial(d)-ODDBASE.serial)%2===0)?ODDBASE.odd:!ODDBASE.odd}
/* разложить стартовый набор в один день */
function seedDay(d){
  var wd=wday(d),odd=oddWeek(d),made={},list=dayListW(d);

/* ======== расчёт дня ========
   Порядок задаёт человек, время считается само.
   Дела с меткой времени стоят на своём часе; остальные идут подряд и обходят метки. */
function ordKey(o){return (typeof o.ord==='number')?o.ord:500}

function dayGroups(d){
  var L=logOf(d),items=instances(d);
  items.forEach(function(o){
    o.skipped=!!o.ref.skip;
    o.doneMin=(+o.ref.done||0);
    o.done=!o.skipped&&o.min>0&&o.doneMin>=o.min-1;
    o.key=ordKey(o);
    o.s=dayStart(d);o.e=dayStart(d);
  });
  var act=items.filter(function(x){return !x.skipped}),byId={},adj={},k;
  act.forEach(function(o){byId[o.id]=o;adj[o.id]={}});
  act.forEach(function(o){(o.with||[]).forEach(function(w){
    if(byId[w]&&w!==o.id){adj[o.id][w]=1;adj[w][o.id]=1}})});
  var seen={},groups=[];
  act.forEach(function(o){
    if(seen[o.id])return;
    seen[o.id]=1;
    var st=[o.id],mem=[];
    while(st.length){var c=st.pop();mem.push(byId[c]);for(k in adj[c])if(!seen[k]){seen[k]=1;st.push(k)}}
    mem.sort(function(x,y){return (y.min-x.min)||(x.key-y.key)||((x.title<y.title)?-1:1)});
    var fx=mem.filter(function(x){return x.fix&&x.at}).sort(function(x,y){return t2m(x.at)-t2m(y.at)})[0];
    var len=0,key=1e9;

    groups.push({ids:mem.map(function(x){return x.id}),mem:mem,lead:fx||mem[0],

  var flo=groups.filter(function(g){return !g.fix}).sort(function(a,b){return (a.key-b.key)||((a.lead.title<b.lead.title)?-1:1)});
  anc.forEach(function(g){g.s=t2m(g.at);g.e=g.s+g.len});

    while(ai<anc.length&&cur+g.len>anc[ai].s&&guard++<80){
      if(anc[ai].e>cur)cur=anc[ai].e;
      ai++;
      while(ai<anc.length&&anc[ai].e<=cur)ai++;

      x.parallel=(g.mem.length>1&&x!==g.lead);

    if(anc[j].s>=anc[i].e)break;
    anc[i].mem.forEach(function(x){x.clash=true});
    anc[j].mem.forEach(function(x){x.clash=true});
    clash.push([anc[i].lead,anc[j].lead]);

}

/* ---------------- ПРОГРЕСС ---------------- */
/* сводка по всей истории, одним проходом */
function achStats(){
  var r={days:0,big:0,huge:0,full:0,gym:0,drive:0,early:0,best:0,streakBest:(S.streak&&S.streak.best)||0,dir:{}};
  for(var d in S.items){
    var sum=0,byd={},k;
    dayList(d).forEach(function(t){
      var v=+t.done||0; if(!v)return;
      sum+=v; byd[t.dir]=(byd[t.dir]||0)+v;
      if((t.title||'').indexOf('Вождение')===0&&v>=60)r.drive++;
    });
    if(!sum)continue;
    r.days++;
    if(sum>=480)r.big++;
    if(sum>=600)r.huge++;
    if((byd.body||0)>=60)r.gym++;
    r.best=Math.max(r.best,sum);
    for(k in byd)r.dir[k]=(r.dir[k]||0)+byd[k];
    var p=planDay(d);
    if(p.planned&&p.done>=p.planned-1)r.full++;
  }
  return r;
}
function badges(){
  var H=achStats(),st=streak(),th=totalMin()/60;
  var paid=S.clients.filter(function(c){return c.stage===4}).length;
  var reels=S.reels.filter(function(r){return r.stage>=4}).length;
  var h=function(k){return (H.dir[k]||0)/60};

function hintMin(p){
  var el=document.getElementById(p+'_min'),out=document.getElementById(p+'_dur');

  var v=parseInt(el.value,10);
  if(isNaN(v)||v<0)v=0;

  var e2=document.getElementById(p+'_endn');
  if(e2){var sl=document.getElementById(p+'_slide');e2.textContent=sl?(' до '+m2t((+sl.value+v)%1440)):''}
}

function hintTime(p){
  var sl=document.getElementById(p+'_slide'),out=document.getElementById(p+'_time');
  if(!sl||!out)return;
  out.textContent=m2t(+sl.value);

}

/* ======== перетаскивание блоков: палец, мышь, трекпад ========
   Правила взяты из планировщиков, где это сделано хорошо:
   1) блок встаёт туда, куда его отпустили; 2) блоки с точным временем не двигаются;
   3) соседи расходятся только настолько, насколько нужно; 4) вернул на место значит ничего не изменилось;
   5) то, что перестало помещаться, не пропадает, а уходит в «не помещается в день». */
var DRG=null;
function dragRows(){
  var V2=document.getElementById('view');
  return [].slice.call(V2.querySelectorAll('.item[data-row][data-mv="1"]'));
}
function dragEnd(){
  if(DRG&&DRG.row)DRG.row.classList.remove('drag');
  if(DRG&&DRG.sc)clearInterval(DRG.sc);
  document.body.classList.remove('dragging');
  var g=document.getElementById('dragghost'); if(g)g.parentNode.removeChild(g);
  var hl=document.querySelector('.item.dropon'); if(hl)hl.classList.remove('dropon');
  DRG=null;
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest?e.target.closest('[data-act="grab"]'):null;
  if(!g||DRG)return;
  var row=document.querySelector('.item[data-row="'+g.dataset.id+'"]');
  if(!row)return;
  e.preventDefault();
  DRG={id:g.dataset.id,row:row,scope:(row.dataset.scope||'day'),
       y0:(typeof e.clientY==='number'?e.clientY:0),on:false,before:undefined};
},{passive:false});
document.addEventListener('pointermove',function(e){
  if(!DRG||typeof e.clientY!=='number')return;
  if(!DRG.on){
    if(Math.abs(e.clientY-DRG.y0)<5)return;
    DRG.on=true;
    DRG.row.classList.add('drag');
    document.body.classList.add('dragging');
    var gh=document.createElement('div');
    gh.id='dragghost';gh.className='ghostrow';
    var ttl=DRG.row.querySelector('.ttl span');
    gh.innerHTML='<i style="background:'+(DRG.row.style.getPropertyValue('--c')||'#C2A170')+'"></i>'+(ttl?ttl.textContent:'Блок');
    document.body.appendChild(gh);
    DRG.sc=setInterval(function(){
      if(!DRG||DRG.cy==null)return;
      var H=window.innerHeight||700;
      if(DRG.cy<110)window.scrollBy(0,-14);
      else if(DRG.cy>H-110)window.scrollBy(0,14);
    },40);
  }
  e.preventDefault();
  DRG.cy=e.clientY;
  var gh2=document.getElementById('dragghost');
  if(gh2){gh2.style.left=Math.max(8,(e.clientX||40)-30)+'px';gh2.style.top=(e.clientY-22)+'px'}
  var rows=dragRows(),i,tgt=null;
  for(i=0;i<rows.length;i++){
    var b=rows[i].getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom&&rows[i].getAttribute('data-row')!==DRG.id){tgt=rows[i];break}
  }
  DRG.onto=tgt?tgt.getAttribute('data-row'):null;
  var prev=document.querySelector('.item.dropon');
  if(prev&&prev!==tgt)prev.classList.remove('dropon');
  if(tgt)tgt.classList.add('dropon');
  var gh3=document.getElementById('dragghost');
  if(gh3)gh3.classList.toggle('ok',!!tgt);
},{passive:false});
['pointerup','pointercancel'].forEach(function(ev){
  document.addEventListener(ev,function(e){
    if(!DRG)return;
    var id=DRG.id,onto=DRG.onto,moved=DRG.on,scope=DRG.scope;
    dragEnd();
    if(!moved||!onto||onto===id)return;      /* отпустили мимо или там же, где взяли */
    var d=S.ui.date,snp=snapDay(d);
    var gsD=ordBlocks(d),fiD=findBlock(gsD,id),tiD=findBlock(gsD,onto);
    if(fiD<0||tiD<0)return;
    if(!moveInDay(d,id,onto,fiD<tiD))return;
    save(); render();
    toast(placeMsg(d,id),function(){restoreDay(d,snp)});
  });
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-pick]');if(!el)return;

    if(p==='dir'){TMP.dir=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}

        (wn2.own?' Для этого дня окно задано отдельно.':'')+' '+
        'Дела этого дня занимают '+hm(pf2.planned)+'. Разница и есть свободное время: '+hm(win2)+' минус '+hm(pf2.planned)+' это '+hm(pf2.freeMin)+'. '+

        (wq.own?'<button class="btn ghost" data-act="dayWinReset">Как обычно</button>':'')+

    case 'clashWhy': openSheet('<h3>Две метки времени спорят</h3>'+

/* ===== порядок дел внутри дня ===== */
/* строки дня сверху вниз: всё, что можно двигать */
function dayRows(d){
  return planDay(d).floats.slice().sort(function(a,b){return a.s-b.s}).map(function(g){return g.lead.id});
}
/* блоки без метки времени, в том порядке, в каком они идут сейчас */
function ordBlocks(d){
  return planDay(d).floats.slice().sort(function(a,b){return a.s-b.s});
}
function writeOrd(d,gs){
  gs.forEach(function(g,i){g.ids.forEach(function(id){var t=findItem(d,id);if(t)t.ord=(i+1)*10})});
}
function findBlock(gs,id){
  for(var i=0;i<gs.length;i++)if(gs[i].ids.indexOf(id)>=0)return i;
  return -1;
}
/* перетащили одно дело на другое: встаёт перед ним или после него */
function moveInDay(d,id,ontoId,after){
  var gs=ordBlocks(d),fi=findBlock(gs,id),ti=findBlock(gs,ontoId);
  if(fi<0||ti<0||fi===ti)return false;
  var g=gs.splice(fi,1)[0];
  if(fi<ti)ti--;
  gs.splice(after?ti+1:ti,0,g);
  writeOrd(d,gs);
  return true;
}
/* на шаг выше или ниже */
function stepInDay(d,id,dir){
  var gs=ordBlocks(d),fi=findBlock(gs,id);
  if(fi<0)return 0;
  var ni=fi+dir;
  if(ni<0||ni>=gs.length)return 0;
  var g=gs.splice(fi,1)[0];
  gs.splice(ni,0,g);
  writeOrd(d,gs);
  return 1;
}
/* в начало или в конец дня */
function edgeInDay(d,id,top){
  var gs=ordBlocks(d),fi=findBlock(gs,id);
  if(fi<0)return false;
  if(top&&fi===0)return false;
  if(!top&&fi===gs.length-1)return false;
  var g=gs.splice(fi,1)[0];
  if(top)gs.unshift(g); else gs.push(g);
  writeOrd(d,gs);
  return true;
}
/* поставить дело сразу после другого, не трогая остальных */
/* место в списке дня: номер и сосед сверху */
function placeMsg(d,id){
  var gs=ordBlocks(d),i=findBlock(gs,id);
  if(i<0)return 'Готово';
  var nm=shortName((gs[i].lead||{}).title||'Дело');
  if(i===0)return nm+' теперь первым в дне';
  var prev=shortName((gs[i-1].lead||{}).title||'',14);
  return nm+' теперь '+(i+1)+'-м, после «'+prev+'»';
}
/* «Поставил в день, 1 ч» */
function spanMsg(d,id,pre){
  var o=planDay(d).items.filter(function(x){return x.id===id})[0];
  if(!o)return pre;
  return pre+(o.fix?(' в '+o.at):'')+', '+hm(o.min);
}
function startOf(d,id){var o=planDay(d).items.filter(function(x){return x.id===id})[0];return o?o.s:null}

/* ===== связи «идут одновременно»: только внутри своего дня ===== */
function linkItems(d,a,b,on){
  if(typeof a==='string')a=findItem(d,a);
  if(typeof b==='string')b=findItem(d,b);
  if(!a||!b||a===b||a.id===b.id)return;
  a.with=a.with||[]; b.with=b.with||[];
  if(on){ if(a.with.indexOf(b.id)<0)a.with.push(b.id); if(b.with.indexOf(a.id)<0)b.with.push(a.id) }
  else{ a.with=a.with.filter(function(x){return x!==b.id}); b.with=b.with.filter(function(x){return x!==a.id}) }
}
function setWith(d,t,ids){
  if(typeof t==='string')t=findItem(d,t);
  if(!t)return;
  (t.with||[]).slice().forEach(function(w){if(ids.indexOf(w)<0)linkItems(d,t,findItem(d,w),false)});
  ids.forEach(function(w){linkItems(d,t,findItem(d,w),true)});
}
/* ===== снимки для кнопки «Вернуть» ===== */
function snapDay(d){return JSON.stringify({a:S.items[d]||null,l:(S.log[d]&&S.log[d].shield)?{shield:true}:null})}
function restoreDay(d,snap){
  var o=JSON.parse(snap);
  if(o.a)S.items[d]=o.a; else delete S.items[d];
  if(o.l)S.log[d]=o.l; else delete S.log[d];
  save(); render();
}
function snapAll(){return JSON.stringify({i:S.items,l:S.log})}
function restoreAll(snap){
  var o=JSON.parse(snap);
  S.items=o.i; S.log=o.l; save(); render();
}

/* ===== копии дела в другие дни ===== */
function dateList(from,until,wds){
  var out=[],d=from,guard=0;
  while(d<=until&&guard++<400){ if(!wds||!wds.length||wds.indexOf(wday(d))>=0)out.push(d); d=addD(d,1) }
  return out;
}
function copyItemTo(d,id,dates,asSeries){
  var t=findItem(d,id); if(!t)return 0;
  if(asSeries&&!t.rep)t.rep='s-'+uid();
  var n=0;
  dates.forEach(function(dd){
    if(dd===d)return;
    var c=cloneItem(t,false);
    if(!asSeries)c.rep=null;
    dayListW(dd).push(c); n++;
  });
  return n;
}
/* убрать дело из всех будущих дней */
function stopRepeat(d,id){
  var t=findItem(d,id); if(!t||!t.rep)return 0;
  var n=0,grp=t.rep;
  t.rep=null;
  for(var k in S.items){
    if(k<=d)continue;
    var had=S.items[k].length;
    S.items[k]=S.items[k].filter(function(x){return x.rep!==grp});
    n+=had-S.items[k].length;
    if(!S.items[k].length)delete S.items[k];
  }
  return n;
}
/* сколько дней вперёд это дело ещё стоит */
function repAhead(d,id){
  var t=findItem(d,id); if(!t||!t.rep)return 0;
  var n=0;
  for(var k in S.items)if(k>d&&S.items[k].some(function(x){return x.rep===t.rep}))n++;
  return n;
}
/* ближайший прошлый день той же недели, где что-то было */
function lastSameWeekday(d){
  var dd=addD(d,-7),guard=0;
  while(guard++<12){ if(dayList(dd).length)return dd; dd=addD(dd,-7) }
  return null;
}
/* перенести расклад прошлого такого же дня недели в пустой день */
function fillFrom(src,dst){
  var items=dayList(src).filter(function(x){return x.rep});
  if(!items.length)return 0;
  var map={},copies=[];
  items.forEach(function(t){var c=cloneItem(t,true);map[t.id]=c.id;copies.push(c)});
  copies.forEach(function(c){c.with=(c.with||[]).map(function(w){return map[w]}).filter(function(x){return x})});
  var a=dayListW(dst),n=0;
  copies.forEach(function(c){ if(!a.some(function(x){return x.rep===c.rep})){a.push(c);n++} });
  if(!a.length)delete S.items[dst];
  return n;
}
/* разложить повторы до указанной даты */
function extendTo(upto){
  var d=todayIso(),days=0,guard=0;
  while(d<=upto&&guard++<400){
    if(!dayList(d).length){
      var src=lastSameWeekday(d);
      if(src&&fillFrom(src,d))days++;
    }
    d=addD(d,1);
  }
  return days;
}
/* сколько дней впереди уже разложено */
function plannedAhead(){
  var d=todayIso(),n=0,guard=0;
  while(guard++<400){ if(!dayList(d).length)break; n++; d=addD(d,1) }
  return n;
}
/* что идёт одновременно с этим делом, в пределах дня */
function sheetWith(id){
  var d=S.ui.date,p=planDay(d),host=p.items.filter(function(x){return x.id===id})[0];
  var ht=findItem(d,id);
  if(!host||!ht)return;
  var sel=(ht.with||[]);
  var cand=dayList(d).filter(function(t){return t.id!==id});
  cand.sort(function(a,b){return (sel.indexOf(b.id)>=0?1:0)-(sel.indexOf(a.id)>=0?1:0)||((a.ord||500)-(b.ord||500))});
  var h='<h3>Вместе с «'+esc(shortName(host.title,24))+'»</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-9px 0 13px">Отмеченные дела этого дня идут в то же время и накладкой не считаются. '+
    'Например, в зале можно слушать ПДД и разбирать Инстаграм сразу. Отмечать можно сколько угодно дел.</div>';
  if(!cand.length)h+='<div class="dim" style="padding:2px 2px 12px;font-size:13px">В этом дне больше ничего нет.</div>';
  else h+='<div class="picklist">'+cand.map(function(t){
      var on=sel.indexOf(t.id)>=0;
      var sub=on?('идёт вместе, '+hm(t.min)):((t.at?('метка '+t.at):'по порядку')+' · '+hm(t.min));
      return '<button class="pickrow'+(on?' on':'')+'" data-act="withTog" data-id="'+id+'" data-v="'+t.id+'">'+
        '<i style="background:'+catColor(t.dir)+'"></i>'+
        '<span class="pn">'+esc(t.title)+'<i class="sub">'+sub+'</i></span>'+
        '<span class="pm">'+(on?'вместе':'добавить')+'</span></button>';
    }).join('')+'</div>';
  h+='<div class="row-btns" style="margin-top:14px">'+
     (sel.length?'<button class="btn" data-act="unpair" data-id="'+id+'">Отцепить все</button>':'')+
     '<button class="btn ghost" data-act="closeSheet">Готово</button></div>';
  openSheet(h);
}
/* записать часть времени */
function sheetPart(id){
  var d=S.ui.date,p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return;
  var left=Math.max(5,o.min-(o.doneMin||0)),base=[15,30,45,60,90];
  if(base.indexOf(left)<0)base.push(left);base.sort(function(a,b){return a-b});
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Записано '+hm(o.doneMin||0)+' из '+hm(o.min)+'. Дело закроется само, когда время наберётся полностью.</div>'+
    '<div class="mins">'+base.map(function(x){return '<button data-pick="pmin" data-v="'+x+'">'+hm(x)+'</button>'}).join('')+'</div>'+
    '<div class="f"><label>Минут</label><input type="number" inputmode="numeric" id="p_min" value="'+left+'"></div>'+
    '<div class="row-btns"><button class="btn pri" data-act="savePart" data-id="'+id+'">Записать</button>'+
    '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>');
}
function tickClock(){
  var el=document.getElementById('runclock');
  if(el&&S.ui.timer)el.textContent=' · идёт '+hm(Math.max(1,Math.round((Date.now()-S.ui.timer.t0)/60000)));
}
setInterval(tickClock,20000);
/* смена даты на новый день */
setInterval(function(){
  if(S.ui.view==='day'&&S.ui._d&&S.ui._d!==todayIso()){S.ui._d=todayIso();S.ui.date=todayIso();render(true);S.ui._d=todayIso();return}
  S.ui._d=todayIso();
  if(S.ui.view==='day'&&S.ui.date===todayIso()&&!SH.classList.contains('open'))render();
},60000);
render();
</script>
</body>
