<style>
:root{
  --bg:#0B0B0C; --panel:#111113; --panel2:#17171A; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
  --fg:#ECEAE7; --dim:#8A8A90; --dim2:#5C5C64; --acc:#C2A170; --accSoft:rgba(194,161,112,.13);
  --ok:#86A98C; --warn:#C98F86; --r:18px; --rs:12px;
  --android:#7FB7A3; --sites:#C2A170; --pdd:#8FA2C8; --content:#C98F86; --study:#9D93B8; --body:#A9B08E; --life:#8A8A90;
}
html[data-theme="light"]{
  --bg:#F3F1EC; --panel:#FFFFFF; --panel2:#FAF8F4; --line:rgba(18,21,28,.11); --line2:rgba(18,21,28,.07);
  --fg:#12151C; --dim:#6E747E; --dim2:#A2A7AE; --acc:#A96410; --accSoft:rgba(169,100,16,.10);
  --ok:#4F7A57; --warn:#A8584C;
  --android:#2F7F67; --sites:#A96410; --pdd:#44618F; --content:#A05A50; --study:#5F5485; --body:#5E6B3C; --life:#6E747E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.mono{font-variant-numeric:tabular-nums}
.lab{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2);font-weight:500;overflow-wrap:anywhere}
.dim{color:var(--dim)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.top-in{max-width:860px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:12px}
.brand{font-size:14.5px;letter-spacing:.01em;font-weight:500;white-space:nowrap}
.brand b{font-weight:600}
.brand span{color:var(--acc)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:11.5px;color:var(--dim);background:var(--panel);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 3px}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.acc{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);background:var(--accSoft)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--fg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line2);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim2);font-size:10px;letter-spacing:.04em;padding:4px 0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px 17px;margin:14px 0}
.card.pad0{padding:0;overflow:hidden}
.h1{font-size:clamp(21px,6.2vw,25px);font-weight:300;letter-spacing:-.015em;margin:22px 0 2px;min-width:0;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--dim)}
.h2{font-size:12.5px;font-weight:500;letter-spacing:.02em;margin:0 0 10px}
.sect{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sect .line{flex:1;height:1px;background:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;font-size:13.5px;color:var(--fg);background:var(--panel);transition:.15s}
.btn svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.pri svg{stroke-width:2}
.btn:hover{border-color:var(--dim2)}
.btn.pri{background:var(--acc);color:#0B0B0C;border-color:var(--acc);font-weight:500}
html[data-theme="light"] .btn.pri{color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:0 1 auto;min-width:0;max-width:100%}
.dayhead .datenav{flex:0 0 auto}

/* ---------- day ---------- */
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.datenav{display:flex;gap:6px;align-items:center}
.load{display:flex;gap:2px;height:6px;border-radius:4px;overflow:hidden;background:var(--line2);margin:14px 0 9px}
.load i{display:block;height:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}

.tl{margin:4px -4px}
.item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);position:relative}
.item:last-child{border-bottom:0}
.item .time{width:52px;flex:0 0 52px;font-size:12.5px;color:var(--dim);padding-top:2px;line-height:1.35}
.item .time s{display:block;text-decoration:none;color:var(--dim2);font-size:11px}
.item .bar{width:2px;border-radius:2px;background:var(--c,var(--acc));opacity:.75;flex:0 0 2px}
.item .mid{flex:1;min-width:0}
.item .ttl{font-size:14.5px;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.item .ttl>span{min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.item .note{font-size:11.5px;color:var(--dim2);margin-top:3px;font-style:italic}
.item .acts{display:flex;align-items:flex-start;gap:3px;padding-top:1px}
.item.done .ttl{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.item.done .bar{opacity:.3}
.item.drag{opacity:.35}
.grip{width:26px;height:34px;flex:0 0 26px;display:grid;place-items:center;color:var(--line);
  border-radius:8px;border:1px solid transparent;touch-action:none;cursor:grab}
.grip:hover{color:var(--dim2);border-color:var(--line)}
.grip:active{cursor:grabbing}
.grip svg{width:14px;height:14px;fill:currentColor;stroke:none}
.item.dropon{background:color-mix(in srgb,var(--acc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);border-radius:12px}
.ghostrow.ok{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.ghostrow{position:fixed;z-index:80;pointer-events:none;max-width:72vw;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:var(--panel);color:var(--fg);font-size:13.5px;padding:9px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 16px 36px rgba(0,0,0,.5);opacity:.97}
.ghostrow i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:8px;vertical-align:1px}
body.dragging{user-select:none;-webkit-user-select:none}
.chk{width:22px;height:22px;border-radius:7px;border:1.4px solid var(--line);flex:0 0 22px;display:grid;place-items:center;margin-top:1px}
.chk svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--acc);border-color:var(--acc)}
.item.done .chk svg{opacity:1}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim2);border:1px solid transparent}
.mini:hover{color:var(--fg);border-color:var(--line)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mini.run{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accSoft)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim2)}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.brk{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 68px;font-size:11px;color:var(--dim2)}
.brk .l{flex:1;height:1px;background:var(--line2)}
.pbar{height:3px;background:var(--line2);border-radius:3px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--acc));opacity:.8}

/* rings */
.ring{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dasharray .4s}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400}
.statrow{display:flex;gap:16px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border-radius:var(--rs);overflow:hidden}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{background:var(--panel);padding:13px 12px}
.statgrid b{display:block;font-size:19px;font-weight:300;margin-top:3px;overflow-wrap:anywhere}
.statgrid.p2 div{background:var(--panel2)}

/* week */
.wkday{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.wkday:last-child{border-bottom:0}
.wkday .d{width:54px;flex:0 0 54px}
.wkday .d b{display:block;font-size:15px;font-weight:400}
.wkday .d s{display:block;text-decoration:none;font-size:11px;color:var(--dim2)}
.wkday .info{flex:1;min-width:0}
.wkday .info .t{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkday.today{background:var(--accSoft);border-radius:10px;padding-left:9px;padding-right:9px}
.mini-ring{width:34px;height:34px;flex:0 0 34px;position:relative}
.mini-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;color:var(--dim)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:3px;border-radius:2px;background:var(--c);opacity:.85}

/* tasks */
.trow{display:flex;gap:11px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-size:14px;overflow-wrap:anywhere}
.trow .mt{font-size:11.5px;color:var(--dim);margin-top:2px}
.trow.off .nm,.trow.off .mt{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);position:relative;flex:0 0 38px;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim2);transition:.18s}
.sw.on{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.sw.on i{left:18px;background:var(--acc)}

/* flow */
.stage{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.stage:last-child{border-bottom:0}
.stage .nm{flex:1;min-width:0;font-size:14px}
.stage .st{font-size:11px;color:var(--dim)}
.sbar{display:flex;gap:4px;margin:10px 0 2px}
.sbar div{flex:1;min-width:0;text-align:center;font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim2);
  padding:7px 1px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar div b{display:block;font-size:15px;color:var(--fg);font-weight:300;margin-top:2px}

/* progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line2);position:relative}
.heat i.l1{background:color-mix(in srgb,var(--acc) 22%,var(--line2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 48%,var(--line2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 78%,var(--line2))}
.heat i.sh{box-shadow:inset 0 0 0 1.4px var(--pdd)}
.heat i.tdy{box-shadow:inset 0 0 0 1.4px var(--fg)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar2{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bar2 .n{width:76px;flex:0 0 76px;color:var(--dim)}
.bar2 .t{flex:1;height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar2 .t i{display:block;height:100%;background:var(--c);opacity:.85}
.bar2 .v{width:104px;flex:0 0 104px;text-align:right;color:var(--dim);font-size:11.5px;white-space:nowrap}
.bar2 .v s{text-decoration:none;color:var(--dim2)}
.bar2 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.badge:last-child{border-bottom:0}
.badge .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--dim2);overflow:hidden;text-align:center}
.badge .ic.l3{font-size:11px}
.badge .ic.l4{font-size:9.5px;letter-spacing:-.03em}
.badge.got .ic{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc);background:var(--accSoft)}
.badge .nm{font-size:13.5px}
.badge.got .nm{color:var(--fg)}
.badge:not(.got) .nm{color:var(--dim)}
.badge .ds{font-size:11.5px;color:var(--dim2)}
.badge .pg{height:3px;border-radius:2px;background:var(--line2);margin-top:6px;max-width:190px;overflow:hidden}
.badge .pg i{display:block;height:100%;background:var(--dim2);border-radius:2px}
.badge .bct{font-size:11px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge .bok{width:18px;height:18px;color:var(--acc);flex:0 0 auto}
.badge .bok svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.picklist{max-height:48vh;overflow:auto;margin:0 -2px 2px;padding:0 2px}
.pickrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--fg)}
.pickrow i{width:3px;height:24px;border-radius:2px;flex:0 0 3px}
.pickrow .pn{flex:1;min-width:0;font-size:14px;overflow:hidden}
.pickrow .sub{display:block;font-style:normal;font-size:11px;line-height:1.35;color:var(--dim2);margin-top:3px}
.pickrow .sub.warn{color:var(--warn)}
.pickrow .pm{font-size:11.5px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mbar{display:flex;gap:1px;margin:15px 0 0;background:var(--line2);border-radius:var(--rs);overflow:hidden}
.mbar>div{flex:1;background:var(--panel2);padding:10px 11px;min-width:0;overflow:hidden}
.mbar span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);line-height:1.3;min-height:26px}
.mbar b{font-size:13.5px;font-weight:400;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--dim);background:var(--panel2)}
.seg button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.days{display:flex;gap:5px}
.days button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--dim);background:var(--panel2)}
.days button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet .cardx{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.shbar{position:sticky;top:0;z-index:6;background:var(--panel);margin:-10px -18px 10px;padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:center;border-radius:22px 22px 0 0}
.shclose{position:absolute;right:12px;top:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.shclose:active{background:var(--line2);color:var(--fg)}
#sheet .row-btns{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));z-index:5;background:var(--panel);
  margin:16px 0 0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));box-shadow:0 -14px 18px -14px rgba(0,0,0,.45)}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.mins{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mins button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13.5px;color:var(--fg);background:var(--panel2)}
.mins button.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.nowline{display:flex;align-items:center;gap:9px;margin:7px 0 7px 52px}
.nowline b{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.nowline i{height:1px;flex:1;background:var(--acc);opacity:.4}
.sheet h3{font-size:17px;font-weight:400;margin:0 0 14px}
.menu button{display:flex;width:100%;gap:11px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line2);font-size:15px;text-align:left;line-height:1.35}
.menu button:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;line-height:1.4;text-align:center;
  max-width:min(92vw,460px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.toast u{display:inline-block;margin-left:13px;color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer}
.toast.act{pointer-events:auto}
#sheet.open ~ .toast{bottom:calc(50vh - 20px)}

@media (max-width:359px){
  .wrap,.top-in{padding-left:13px;padding-right:13px}
  .item{gap:9px}
  .item .time{width:46px;flex:0 0 46px;font-size:12px}
  .brk{padding-left:58px}
  .nowline{margin-left:46px}
  .item .acts{gap:1px}
}
@media (min-width:900px){
  body{padding-bottom:40px;padding-left:216px}
  .top-in,.wrap{max-width:820px}
  .top{padding-left:216px}
  .tabbar{top:0;bottom:auto;left:0;right:auto;width:216px;height:100vh;flex-direction:column;justify-content:flex-start;
    gap:3px;border-top:0;border-right:1px solid var(--line2);padding:78px 14px 20px;background:var(--panel)}
  .tab{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:13.5px;letter-spacing:0;
    padding:11px 12px;border-radius:11px;width:100%}
  .tab.on{background:var(--panel2)}
  .deskbrand{position:fixed;top:0;left:0;width:216px;padding:22px 26px;z-index:50;font-size:14.5px}
}
@media (min-width:900px){
  .sheet .cardx{left:50%;right:auto;transform:translateX(-50%);width:560px;max-width:92vw;bottom:30px;
    max-height:84vh;border-radius:20px;border:1px solid var(--line);animation:upc .22s ease}
  .shbar{border-radius:20px 20px 0 0}
}
@keyframes upc{from{transform:translateX(-50%) translateY(16px);opacity:.6}to{transform:translateX(-50%);opacity:1}}
@media (max-width:899px){.deskbrand{display:none}}
@media (min-width:900px){.top .brand{display:none}}
</style>
</head>
<body>
<div class="deskbrand brand"><b>devnprt</b><span>.planner</span></div>

<header class="top"><div class="top-in">
  <div class="brand mobonly"><b>devnprt</b><span>.planner</span></div>
  <div class="top-sp"></div>

(function migrate(){

           'Поиск локации и референсов':'t-loc','Съёмка':'t-shoot','Монтаж ролика':'t-edit',
           'ПДД, билеты':'t-pdd1','Зал':'t-gym','ПДД, разбор на ходу':'t-pdd2',
           'Инстаграм: сторис, ответы, публикация':'t-insta','Работа в банке':'t-bank'};
  S.tasks.forEach(function(t){if(t.active===undefined)t.active=true});
  /* вождение 13 ноября отменено */
  S.tasks=S.tasks.filter(function(t){return !(t.date==='2026-11-13'&&t.title==='Вождение')});

    if(ft.date)return;

    for(i=0;i<S.tasks.length;i++){
      var t=S.tasks[i];
      if(t.date)continue;
      if(t.id===ft.id){ex=t;break}
      if(OLD[t.title]===ft.id&&!t._m){ex=t;break}
      if(t.title===ft.title&&t.at===ft.at&&!t._m){ex=t;break}
    }
    if(ex){ex._m=1;FIELDS.forEach(function(k){ex[k]=ft[k]})}
    else S.tasks.push(ft);
  });

    if(S.settings.sleep==='23:30')S.settings.sleep='23:00';

})();

  S.tasks.forEach(function(t){if(t.at)busy[t.at]=1});
  S.tasks.forEach(function(t){
    if(t.at)return;
    while(busy[m2t(step)]&&step<22*60)step+=30;

  for(var dk in S.log){var Lg=S.log[dk];
    delete Lg.shape;delete Lg.ord;delete Lg.focus;
    if(Lg.ovr)for(var ok in Lg.ovr){delete Lg.ovr[ok].after;delete Lg.ovr[ok].floor;delete Lg.ovr[ok].gap;
      if(Lg.ovr[ok].at==='')delete Lg.ovr[ok].at;}

if(!S.ui)S.ui={view:'day',date:todayIso(),week:monday(todayIso()),timer:null};

/* ============================ логика дня ============================ */
function isOdd(d){var p=S.settings.parity;return (Math.abs(wserial(d)-p.serial)%2===0)?p.odd:!p.odd}
function logOf(d){if(!S.log[d])S.log[d]={};var L=S.log[d];L.done=L.done||{};L.skip=L.skip||[];L.ovr=L.ovr||{};L.add=L.add||[];return L}
function instances(d){
  var L=logOf(d),wd=wday(d),odd=isOdd(d),mode=S.settings.mode,out=[],i,t,ADD=L.add||[];
  for(i=0;i<S.tasks.length;i++){
    t=S.tasks[i];
    if(!t.active)continue;
    /* задача, поставленную в этот день вручную, берём независимо от дней недели и режима */
    if(ADD.indexOf(t.id)<0){
      if(t.only&&t.only!==mode)continue;
      if(t.date){ if(t.date!==d)continue; }
      else{
        var dd=(mode==='A'&&t.daysA)?t.daysA:t.days;
        if(!dd||dd.indexOf(wd)<0)continue;
        if(t.weeks==='odd'&&!odd)continue;
        if(t.weeks==='even'&&odd)continue;
      }
    }
    var min=(mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
    if(min<=0)continue;
    var at=(mode==='A'&&t.atA)?t.atA:t.at;
    var o={id:t.id,title:t.title,dir:t.dir,min:min,at:at||'12:00',core:t.core,note:t.note,
           optional:t.optional,par:t.par||null,ref:t};
    var ov=L.ovr[t.id]; if(ov){ if(ov.min)o.min=ov.min; if(ov.at)o.at=ov.at; }
    out.push(o);
  }
  /* если пары пропущены — вместо них практика */
  var skippedPair=out.some(function(o){return o.dir==='study'&&o.at&&L.skip.indexOf(o.id)>=0});
  var hasPract=out.some(function(o){return o.title.indexOf('Практика')===0});
  if(skippedPair&&!hasPract&&L.skip.indexOf('v-pract')<0)
  {
    var pr=out.filter(function(o){return o.dir==='study'&&L.skip.indexOf(o.id)>=0})[0];
    var pv={id:'v-pract',title:'Практика по дистанту вместо пар',dir:'study',min:90,
            at:(pr?pr.at:'10:00'),note:'Пары пропущены, задачи всё равно нужны',virt:true};
    var ovp=L.ovr['v-pract']; if(ovp){ if(ovp.min)pv.min=ovp.min; if(ovp.at)pv.at=ovp.at; }
    out.push(pv);
  }
  return out;
}

/* ======== расчёт дня ========
   Никакой автоматической укладки: у каждого дела стоит своё время.
   Приложение только считает перерывы между делами, ловит накладки и собирает итоги. */
function planDay(d){
  var L=logOf(d),items=instances(d),i,j,o;
  var linked=function(a,b){return !!((a.par&&(a.par===b.id||a.par===b.dir))||(b.par&&(b.par===a.id||b.par===a.dir)))};
  for(i=0;i<items.length;i++){
    o=items[i];
    o.s=t2m(o.at); o.e=o.s+o.min;
    o.skipped=L.skip.indexOf(o.id)>=0;
    o.doneMin=L.done[o.id]||0;
    o.done=!o.skipped&&o.doneMin>=o.min-1;
  }
  items.sort(function(a,b){return (a.s-b.s)||(b.min-a.min)||(a.title<b.title?-1:1)});
  var act=items.filter(function(x){return !x.skipped}),clash=[];
  /* дело, помеченное «идёт вместе», ложится поверх хозяина и накладкой не считается */
  act.forEach(function(x){
    if(!x.par)return;
    var h=act.filter(function(y){return y!==x&&(y.id===x.par||y.dir===x.par)&&y.s<x.e&&x.s<y.e})[0];
    if(h){x.parallel=true;x.hostTitle=h.title}
  });
  for(i=0;i<act.length;i++){
    for(j=i+1;j<act.length;j++){
      if(act[j].s>=act[i].e)break;
      if(linked(act[i],act[j]))continue;
      act[i].clash=true;act[j].clash=true;clash.push([act[i],act[j]]);
    }
  }
  var start=dayStart(),end=dayEnd(),sleepM=t2m(S.settings.sleep); if(sleepM<=start)sleepM+=1440;
  /* сплошные куски занятого времени, между ними перерывы */
  var line=act.filter(function(x){return !x.parallel}),merged=[],breaks=[],occupied=0,gapMax=0;
  line.forEach(function(x){
    var last=merged[merged.length-1];
    if(last&&x.s<=last.e)last.e=Math.max(last.e,x.e); else merged.push({s:x.s,e:x.e});
  });
  merged.forEach(function(m){occupied+=m.e-m.s});
  for(i=1;i<merged.length;i++){
    var g=merged[i].s-merged[i-1].e;
    if(g>0){breaks.push({s:merged[i-1].e,e:merged[i].s,len:g});if(g>gapMax)gapMax=g}
  }
  var planned=0,done=0,byDir={},endAt=start,late=0;
  act.forEach(function(x){
    planned+=x.min; done+=Math.min(x.doneMin,x.min);
    byDir[x.dir]=(byDir[x.dir]||0)+x.min;
    if(x.e>endAt)endAt=x.e;
    if(x.e>sleepM){x.late=true;late++}
  });
  var winMin=Math.max(0,end-start);
  return {items:items,over:[],breaks:breaks,planned:planned,done:done,byDir:byDir,clash:clash,
          occupied:occupied,cut:[],ratio:planned?Math.min(1,done/planned):0,endAt:endAt,
          winMin:winMin,freeMin:Math.max(0,winMin-occupied),gapMax:gapMax,overMin:0,late:late};
}

/* ---- оценка дня, серия, уровни ---- */
function dayCounted(d){
  var L=S.log[d]; if(!L)return false;
  if(L.shield)return null;
  var p=planDay(d);
  if(!p.planned)return null;
  return p.ratio>=.7;
}
function streak(){
  var n=0,d=todayIso(),c=dayCounted(d),guard=0;
  if(c===true)n++;
  d=addD(d,-1);
  while(guard++<400){
    var r=dayCounted(d);
    if(r===true)n++;
    else if(r===null){} else break;
    d=addD(d,-1);
  }
  return n;
}
function totalMin(from,to){
  var s=0;
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var o=S.log[d].done||{};
    for(var k in o)s+=o[k];
  }
  return s;
}
function minByDir(from,to){
  var r={};
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var mp={}; instances(d).forEach(function(o){mp[o.id]=o.dir});
    var o=S.log[d].done||{};
    for(var k in o){var dir=mp[k]||findDir(k);if(!dir)continue;r[dir]=(r[dir]||0)+o[k]}
  }
  return r;
}
function findDir(id){var t=S.tasks.filter(function(x){return x.id===id})[0];return t?t.dir:(id==='v-pract'?'study':null)}
var RANKS=[[0,'Старт'],[25,'Разгон'],[75,'Поток'],[150,'Темп'],[300,'Ход'],[600,'Мастерская'],[1000,'Своя лига']];
function rank(){
  var h=totalMin()/60,cur=RANKS[0],next=null;
  for(var i=0;i<RANKS.length;i++){if(h>=RANKS[i][0])cur=RANKS[i];else{next=RANKS[i];break}}
  return {name:cur[1],h:h,next:next,from:cur[0]};
}
function shieldsLeft(){
  var m=todayIso().slice(0,7),used=0;
  for(var d in S.log)if(d.slice(0,7)===m&&S.log[d].shield)used++;
  return Math.max(0,2-used);
}

var V=document.getElementById('view');
function ring(pct,size,txt){
  size=size||74;var r=(size-7)/2,c=2*Math.PI*r,o=c*(1-Math.min(1,pct));
  return '<div class="ring" style="width:'+size+'px;height:'+size+'px;flex:0 0 '+size+'px">'+
    '<svg width="'+size+'" height="'+size+'"><circle class="bgc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'"/>'+
    (pct>0.004?'<circle class="fgc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke-dasharray="'+(c-o)+' '+c+'"/>':'')+'</svg>'+
    '<div class="val">'+(txt!==undefined?txt:Math.round(pct*100)+'%')+'</div></div>';
}

var UNDO=null;
function toast(t,undo){
  var e=document.getElementById('toast');
  e.innerHTML=esc(t)+(undo?' <u data-act="undo">Вернуть</u>':'');
  e.classList.toggle('act',!!undo);UNDO=undo||null;
  e.classList.add('on');clearTimeout(e._t);
  e._t=setTimeout(function(){e.classList.remove('on');e.classList.remove('act');UNDO=null},undo?5200:1700);
}

     '<h1 class="h1" style="margin-top:2px">'+dateLong(d)+'</h1></div><div class="top-sp"></div>'+

     '<button class="btn sm ghost" data-act="dtoday">Сегодня</button>'+
     '<button class="iconbtn" data-act="dday" data-v="1">'+IC.right+'</button></div></div>';
  h+='<div class="chips">'+
     '<button class="chip'+(wday(d)===6||wday(d)===1?' acc':'')+'" data-act="parity">Неделя <b>'+(isOdd(d)?'нечётная':'чётная')+'</b></button>'+
     '<button class="chip'+(L.shield?' acc':'')+'" data-act="shield">Щит <b>'+(L.shield?'стоит':shieldsLeft()+' из 2')+'</b></button>'+
     (p.clash.length?'<button class="chip warn" data-act="packDay">Накладки: <b>'+p.clash.length+'</b>, разложить</button>':'')+

  h+='<div class="card"><div class="statrow">'+ring(p.ratio)+
     '<div style="flex:1;min-width:0"><div style="font-size:15px">Сделано '+hm(p.done)+' из '+hm(p.planned)+'</div>'+
     '<div class="dim" style="font-size:12.5px;margin-top:3px">Свободно '+hm(p.freeMin)+' · день закрывается в '+m2t(p.endAt)+'</div>'+

        var v=p.byDir[k]||0;if(!v)return '';

     }).join('')+'</div>'+
     '<div class="legend">'+DKEYS.filter(function(k){return p.byDir[k]}).map(function(k){
        return '<span><i style="background:'+DIRS[k].c+'"></i>'+DIRS[k].t+' '+hmS(p.byDir[k])+'</span>';
     }).join('')+'</div></div></div></div>';

  h+='<div class="sect"><div class="lab">План дня</div><div class="line"></div>'+
     '<button class="btn sm" data-act="pickDay">'+IC.plus+' Задача</button></div>';
  h+='<div class="dim" style="font-size:11.5px;margin:-4px 0 9px;line-height:1.5">'+
     'У каждого дела своё время. Потяните блок за точки справа и отпустите на другом деле, чтобы поменять их местами.</div>';
  h+='<div class="card pad0" style="padding:6px 13px"><div class="tl">';
  var shown=p.items.filter(function(o){return !o.skipped});
  if(!shown.length)h+='<div class="dim" style="padding:22px 4px;text-align:center">На этот день ничего не запланировано</div>';
  var nowM=(new Date()).getHours()*60+(new Date()).getMinutes(),nowShown=false,runEnd=null;
  shown.forEach(function(o,idx){
    if(isT&&!nowShown&&o.s>nowM){h+='<div class="nowline"><b>сейчас '+m2t(nowM)+'</b><i></i></div>';nowShown=true}
    h+=itemHTML(o,d);
    runEnd=(runEnd==null)?o.e:Math.max(runEnd,o.e);
    var nx=shown[idx+1];
    if(nx&&!nx.parallel&&runEnd!=null&&nx.s-runEnd>=5){
      var g=nx.s-runEnd;
      h+='<div class="brk"><span>'+(g<=60?'перерыв '+hm(g):'свободно '+hm(g))+'</span><div class="l"></div></div>';
    }
  });
  h+='</div></div>';
  /* хвосты вчера */
  var y=addD(d,-1),yl=S.log[y],yused=!!(yl&&((yl.done&&Object.keys(yl.done).length)||(yl.skip&&yl.skip.length)));
  var yp=yused?planDay(y):null;
  var tails=yused?yp.items.filter(function(o){return !o.done&&!o.skipped&&!o.optional}).slice(0,4):[];

      '<button class="btn sm" data-act="pull" data-id="'+o.id+'" data-v="'+y+'">Взять сегодня</button></div>'}).join('')+'</div>';
  }
  /* минимум и мотивация */
  var core=p.items.filter(function(o){return o.core&&!o.skipped});
  var st=streak(),rk=rank();

  h+='<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap">'+core.map(function(o){

     }).join('')+'</div>'+
     '<div class="dim" style="font-size:12px;margin-top:11px">День засчитан, когда закрыто 70% плана. Сейчас '+Math.round(p.ratio*100)+'%.</div></div>';
  h+='<div class="statgrid" style="margin-bottom:26px">'+
     '<div><div class="lab">Серия</div><b>'+st+(st%10===1&&st%100!==11?' день':(st%10>=2&&st%10<=4&&(st%100<10||st%100>=20)?' дня':' дней'))+'</b></div>'+
     '<div><div class="lab">Щиты</div><b>'+shieldsLeft()+' из 2</b></div>'+
     '<div><div class="lab">Уровень</div><b style="font-size:16px;padding-top:2px">'+rk.name+'</b></div>'+
     '<div><div class="lab">Часов всего</div><b>'+hmS(totalMin())+'</b></div></div>';
  V.innerHTML=h;
}

function itemHTML(o,d){
  var run=S.ui.timer&&S.ui.timer.id===o.id&&S.ui.timer.date===d;
  var part=o.doneMin>0&&!o.done;
  var mv=!o.parallel&&!o.skipped&&!o.done;
  return '<div class="item'+(o.done?' done':'')+(o.skipped?' done':'')+'"'+
    ' data-row="'+o.id+'" data-mv="'+(mv?1:0)+'" style="--c:'+DIRS[o.dir].c+'">'+
    '<div class="time">'+m2t(o.s)+'<s>'+m2t(o.e)+'</s></div><div class="bar"></div>'+
    '<div class="mid"><div class="ttl">'+
      '<button class="chk" data-act="toggle" data-id="'+o.id+'">'+IC.check+'</button>'+
      '<span>'+esc(o.title)+'</span>'+
      (o.parallel?'<span class="tag acc">'+(o.hostTitle?'вместе с: '+esc(o.hostTitle.split(',')[0].toLowerCase()):'параллельно')+'</span>':'')+
      (o.optional?'<span class="tag">можно не идти</span>':'')+
      (o.skipped?'<span class="tag warn">пропущено</span>':'')+
      (o.clash?'<span class="tag warn">накладка по времени</span>':'')+
      (o.late?'<span class="tag warn">после отбоя</span>':'')+
    '</div>'+
    '<div class="meta">'+DIRS[o.dir].t+' · '+hm(o.min)+
      (part?' · сделано '+hm(o.doneMin):'')+(run?'<span id="runclock"> · идёт</span>':'')+'</div>'+
    (o.note?'<div class="note">'+esc(o.note)+'</div>':'')+
    (part?'<div class="pbar"><i style="width:'+Math.min(100,o.doneMin/o.min*100)+'%"></i></div>':'')+
    '</div>'+
    '<div class="acts">'+
      (mv?'<button class="grip" data-act="grab" data-id="'+o.id+'" title="Потяните на другое дело, чтобы поменять местами">'+IC.grip+'</button>':'')+
      '<button class="mini'+(run?' run':'')+'" data-act="timer" data-id="'+o.id+'">'+(run?IC.stop:IC.play)+'</button>'+
      '<button class="mini" data-act="menu" data-id="'+o.id+'">'+IC.dots+'</button>'+
    '</div></div>';
}

  for(i=0;i<7;i++){var d=addD(w,i),p=planDay(d);days.push({d:d,p:p});tot+=p.planned;doneT+=p.done;
    for(var k in p.byDir)byDir[k]=(byDir[k]||0)+p.byDir[k];}

     '<h1 class="h1" style="margin-top:2px">'+dateShort(w)+' <em>—</em> '+dateShort(addD(w,6))+'</h1></div><div class="top-sp"></div>'+
     '<div class="datenav"><button class="iconbtn" data-act="dweek" data-v="-1">'+IC.left+'</button>'+

     '<button class="iconbtn" data-act="dweek" data-v="1">'+IC.right+'</button></div></div>';
  h+='<div class="card"><div class="statrow">'+ring(tot?doneT/tot:0)+

     '<div class="load" style="margin-bottom:0">'+DKEYS.map(function(k){var v=byDir[k]||0;return v?'<i style="flex:'+v+';background:'+DIRS[k].c+'"></i>':''}).join('')+'</div>'+
     '</div></div></div>';
  h+='<div class="card pad0" style="padding:4px 13px">';
  days.forEach(function(x){
    var anchors=x.p.items.filter(function(o){return o.at&&!o.skipped}).map(function(o){return o.title.split(',')[0]+' '+m2t(o.s)}).join(' · ');
    var L=S.log[x.d]||{};

      '</div>'+
      '<div style="text-align:right"><div style="font-size:12.5px">'+hmS(x.p.planned)+'</div>'+
      '<div class="lab" style="letter-spacing:.1em">'+(L.shield?'щит':'')+'</div></div>'+
      ring(x.p.ratio,34,'')+'</button>';
  });
  h+='</div>';
  /* недельные цели */
  var norms=S.settings.norms[S.settings.mode],got=minByDir(w,addD(w,6));
  h+='<div class="sect"><div class="lab">Цели недели</div><div class="line"></div>'+
     '<button class="btn sm ghost" data-act="go" data-v="set">Изменить</button></div><div class="card"><div class="bars">';
  Object.keys(norms).forEach(function(k){
    var need=norms[k]*60,have=got[k]||0;
    h+='<div class="bar2"><div class="n">'+DIRS[k].t+'</div><div class="t"><i style="--c:'+DIRS[k].c+';width:'+Math.min(100,have/need*100)+'%"></i></div>'+
       '<div class="v">'+hmS(have)+' / '+norms[k]+' ч</div></div>';

  h+='</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+

/* ---------------- ЗАДАЧИ ---------------- */
function repText(t){
  if(t.date)return 'разовая, '+dateShort(t.date);
  var dd=(S.settings.mode==='A'&&t.daysA)?t.daysA:t.days;
  if(!dd||!dd.length)return 'без дней';
  if(dd.length===7)return 'каждый день';
  var s=dd.map(function(n){return WDS[n-1]}).join(' ');
  if(t.weeks==='odd')s+=' · нечётные недели';
  if(t.weeks==='even')s+=' · чётные недели';
  return s;
}

  h+='<div style="display:flex;gap:7px;flex-wrap:wrap;margin:14px 0">'+
     '<button class="btn sm" data-act="quick" data-v="drive">+ Вождение</button>'+
     '<button class="btn sm" data-act="quick" data-v="once">+ Разовая задача</button>'+
     '<button class="btn sm" data-act="quick" data-v="pair">+ Пара в ТИСБИ</button></div>';
  DKEYS.forEach(function(k){
    var list=S.tasks.filter(function(t){return t.dir===k});

    var wk=list.filter(function(t){return t.active&&!t.date&&(!t.only||t.only===S.settings.mode)}).reduce(function(a,t){
      var mn=(mA&&typeof t.minA==='number')?t.minA:t.min, dy=(mA&&t.daysA)?t.daysA:(t.days||[]);
      return a+mn*dy.length;},0);
    h+='<div class="sect"><span class="lab" style="color:'+DIRS[k].c+'">'+DIRS[k].t+'</span><div class="line"></div>'+
       '<span class="lab">'+hmS(wk)+' / нед</span></div>';

    list.forEach(function(t){
      h+='<div class="trow'+(t.active?'':' off')+'">'+
        '<div class="mid"><div class="nm">'+esc(t.title)+(t.core?' <span class="tag acc" style="font-size:9px">минимум</span>':'')+(t.only?' <span class="tag">режим '+t.only+'</span>':'')+'</div>'+
        '<div class="mt">'+repText(t)+' · '+hm((S.settings.mode==='A'&&typeof t.minA==='number')?t.minA:t.min)+
        ' · '+((S.settings.mode==='A'&&t.atA)?t.atA:(t.at||''))+(t.par?' · вместе с другим делом':'')+'</div></div>'+
        '<button class="sw'+(t.active?' on':'')+'" data-act="toggleTask" data-id="'+t.id+'"><i></i></button>'+
        '<button class="mini" data-act="edit" data-id="'+t.id+'">'+IC.dots+'</button></div>';
    });

  h+='<div style="height:26px"></div>';

function rub(v){return (+v||0).toLocaleString('ru-RU')+' ₽'}
/* весь доход одной таблицей: журнал заработка плюс оплаченные клиенты */
function moneyRows(){
  var r=S.income.map(function(x){return {id:x.id,title:x.title,kind:x.kind||'job',sum:+x.sum||0,date:x.date||'',hours:+x.hours||0,src:'m'}});
  S.clients.forEach(function(c){
    if(c.stage===4&&+c.sum)r.push({id:c.id,title:c.name,kind:'site',sum:+c.sum,date:c.paidAt||'',hours:0,src:'c'});
  });
  return r.sort(function(a,b){return a.date<b.date?1:-1});
}
function moneySum(kind,from){
  return moneyRows().reduce(function(a,x){
    if(kind&&x.kind!==kind)return a;
    if(from&&(x.date||'').slice(0,from.length)!==from)return a;
    return a+x.sum;
  },0);
}

/* сводка по всей истории, одним проходом */
function achStats(){
  var r={days:0,big:0,huge:0,full:0,gym:0,drive:0,early:0,best:0,streakBest:(S.streak&&S.streak.best)||0,dir:{}};
  var ttl={};S.tasks.forEach(function(t){ttl[t.id]=t.title||''});
  for(var d in S.log){
    var done=S.log[d].done||{},sum=0,byd={},k,dir;
    for(k in done){
      sum+=done[k];dir=findDir(k);
      if(dir)byd[dir]=(byd[dir]||0)+done[k];
      if((ttl[k]||'').indexOf('Вождение')===0&&done[k]>=60)r.drive++;
    }
    if(!sum)continue;
    r.days++;
    if(sum>=480)r.big++;
    if(sum>=600)r.huge++;
    if((byd.body||0)>=60)r.gym++;
    r.best=Math.max(r.best,sum);
    for(k in byd)r.dir[k]=(r.dir[k]||0)+byd[k];
    var p=planDay(d);
    if(p.planned&&p.done>=p.planned-1)r.full++;
  }
  return r;
}

  B.sort(function(a,b){

var SH=document.getElementById('sheet'),SB=document.getElementById('sheetBody');
var LOCKY=0;
function openSheet(html){
  if(!SH.classList.contains('open')){
    LOCKY=window.scrollY;document.body.style.top=(-LOCKY)+'px';document.body.classList.add('lock');
  }
  SB.innerHTML=html;SH.classList.add('open');
  var cx=SH.querySelector('.cardx');cx.scrollTop=0;cx.style.transform='';
}
function closeSheet(){
  if(!SH.classList.contains('open'))return;
  SH.classList.remove('open');document.body.classList.remove('lock');document.body.style.top='';
  window.scrollTo(0,LOCKY);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SH.classList.contains('open')){closeSheet();return}
  if(e.key==='Enter'&&SH.classList.contains('open')&&e.target.tagName==='INPUT'&&e.target.type!=='date'&&e.target.type!=='time'){
    var pri=SB.querySelector('.btn.pri');if(pri){e.preventDefault();pri.click()}
  }
});
(function(){
  var sy=null,cx=null;
  SH.addEventListener('touchstart',function(e){
    if(!e.target.closest('.shbar'))return;
    cx=SH.querySelector('.cardx');sy=e.touches[0].clientY;cx.style.transition='none';
  },{passive:true});
  SH.addEventListener('touchmove',function(e){
    if(sy===null)return;var dy=e.touches[0].clientY-sy;
    if(dy>0)cx.style.transform='translateY('+dy+'px)';
  },{passive:true});
  SH.addEventListener('touchend',function(){
    if(sy===null)return;
    var m=/translateY\(([\d.]+)px\)/.exec(cx.style.transform||'');
    cx.style.transition='';cx.style.transform='';
    if(m&&parseFloat(m[1])>90)closeSheet();
    sy=null;
  });
})();

/* двухшаговое подтверждение прямо в кнопке, без системных окон */
function armed(el,ask){
  if(el.dataset.arm==='1')return true;
  var old=el.textContent;el.dataset.arm='1';el.textContent=ask;el.classList.add('danger');
  clearTimeout(el._a);el._a=setTimeout(function(){el.dataset.arm='';el.textContent=old;},4000);
  return false;
}
var SCROLLS={};
function render(to){
  var y=document.body.classList.contains('lock')?LOCKY:window.scrollY,v=S.ui.view;
  if(v==='day')viewDay();else if(v==='week')viewWeek();else if(v==='tasks')viewTasks();
  else if(v==='flow')viewFlow();else if(v==='stat')viewStat();else viewSet();
  renderTabs();tickClock();
  var t=(to===true)?0:(typeof to==='number'?to:y);
  if(document.body.classList.contains('lock'))LOCKY=t; else window.scrollTo(0,t);
}
function go(v){if(S.ui.view!==v)SCROLLS[S.ui.view]=window.scrollY;S.ui.view=v;save();render(SCROLLS[v]||0)}

/* ======== перетаскивание блоков: палец, мышь, трекпад ========
   Правила взяты из планировщиков, где это сделано хорошо:
   1) блок встаёт туда, куда его отпустили; 2) блоки с точным временем не двигаются;
   3) соседи расходятся только настолько, насколько нужно; 4) вернул на место значит ничего не изменилось;
   5) то, что перестало помещаться, не пропадает, а уходит в «не помещается в день». */
var DRG=null;
function dragRows(){
  var V2=document.getElementById('view');
  return [].slice.call(V2.querySelectorAll('.item[data-row][data-mv="1"]'));
}
function dragEnd(){
  if(DRG&&DRG.row)DRG.row.classList.remove('drag');
  if(DRG&&DRG.sc)clearInterval(DRG.sc);
  document.body.classList.remove('dragging');
  var g=document.getElementById('dragghost'); if(g)g.parentNode.removeChild(g);
  var hl=document.querySelector('.item.dropon'); if(hl)hl.classList.remove('dropon');
  DRG=null;
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest?e.target.closest('[data-act="grab"]'):null;
  if(!g||DRG)return;
  var row=document.querySelector('.item[data-row="'+g.dataset.id+'"]');
  if(!row)return;
  e.preventDefault();
  DRG={id:g.dataset.id,row:row,y0:(typeof e.clientY==='number'?e.clientY:0),on:false,before:undefined};
},{passive:false});
document.addEventListener('pointermove',function(e){
  if(!DRG||typeof e.clientY!=='number')return;
  if(!DRG.on){
    if(Math.abs(e.clientY-DRG.y0)<5)return;
    DRG.on=true;
    DRG.row.classList.add('drag');
    document.body.classList.add('dragging');
    var gh=document.createElement('div');
    gh.id='dragghost';gh.className='ghostrow';
    var ttl=DRG.row.querySelector('.ttl span');
    gh.innerHTML='<i style="background:'+(DRG.row.style.getPropertyValue('--c')||'#C2A170')+'"></i>'+(ttl?ttl.textContent:'Блок');
    document.body.appendChild(gh);
    DRG.sc=setInterval(function(){
      if(!DRG||DRG.cy==null)return;
      var H=window.innerHeight||700;
      if(DRG.cy<110)window.scrollBy(0,-14);
      else if(DRG.cy>H-110)window.scrollBy(0,14);
    },40);
  }
  e.preventDefault();
  DRG.cy=e.clientY;
  var gh2=document.getElementById('dragghost');
  if(gh2){gh2.style.left=Math.max(8,(e.clientX||40)-30)+'px';gh2.style.top=(e.clientY-22)+'px'}
  var rows=dragRows(),i,tgt=null;
  for(i=0;i<rows.length;i++){
    var b=rows[i].getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom&&rows[i].getAttribute('data-row')!==DRG.id){tgt=rows[i];break}
  }
  DRG.onto=tgt?tgt.getAttribute('data-row'):null;
  var prev=document.querySelector('.item.dropon');
  if(prev&&prev!==tgt)prev.classList.remove('dropon');
  if(tgt)tgt.classList.add('dropon');
  var gh3=document.getElementById('dragghost');
  if(gh3)gh3.classList.toggle('ok',!!tgt);
},{passive:false});
['pointerup','pointercancel'].forEach(function(ev){
  document.addEventListener(ev,function(e){
    if(!DRG)return;
    var id=DRG.id,onto=DRG.onto,moved=DRG.on;
    dragEnd();
    if(!moved||!onto||onto===id)return;      /* отпустили мимо или там же, где взяли */
    var d=S.ui.date,snp=snapDay(d);
    if(!swapTimes(d,id,onto))return;
    save(); render();
    var A=startOf(d,id),B=startOf(d,onto),p2=planDay(d);
    var nmA=(p2.items.filter(function(x){return x.id===id})[0]||{title:''}).title.split(',')[0];
    var nmB=(p2.items.filter(function(x){return x.id===onto})[0]||{title:''}).title.split(',')[0];
    toast('Поменял местами: '+nmA+' в '+m2t(A)+', '+nmB+' в '+m2t(B),function(){restoreDay(d,snp)});
  });
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-pick]');if(!el)return;
  var id=el.dataset.id,v=el.dataset.v,d=S.ui.date,L;
  if(el.dataset.pick){
    var p=el.dataset.pick;
    if(p==='dir'){TMP.dir=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='weeks'){TMP.weeks=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='stage'){TMP.stage=+v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===+v)})}
    if(p==='day'){var n=+v,i=TMP.days.indexOf(n);if(i<0)TMP.days.push(n);else TMP.days.splice(i,1);el.classList.toggle('on')}
    if(p==='core'){TMP.core=!TMP.core;el.classList.toggle('on')}
    if(p==='shiftAfter'){TMP.shift=!TMP.shift;el.classList.toggle('on')}
    if(p==='par'){TMP.par=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='kind'){TMP.kind=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='qdone'){TMP.qdone=!TMP.qdone;el.classList.toggle('on')}
    if(p==='pmin'){var pi=document.getElementById('p_min')||document.getElementById('q_min');if(pi)pi.value=v;
      el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    return;
  }
  var a=el.dataset.act;
  switch(a){
    case 'go': go(v); break;
    case 'closeSheet': closeSheet(); break;
    case 'dday': S.ui.date=addD(d,+v); save(); render(true); break;
    case 'dtoday': S.ui.date=todayIso(); save(); render(true); break;
    case 'openday': S.ui.date=v; go('day'); break;
    case 'dweek': S.ui.week=addD(S.ui.week,+v*7); save(); render(true); break;
    case 'wtoday': S.ui.week=monday(todayIso()); save(); render(true); break;
    case 'mode': S.settings.mode=S.settings.mode==='B'?'A':'B'; save(); render();
      toast(S.settings.mode==='B'?'Режим: полный день на себя':'Режим: с работой в банке'); break;
    case 'setmode': S.settings.mode=v; save(); render(); break;
    case 'parity': S.settings.parity={serial:wserial(todayIso()),odd:!isOdd(todayIso())}; save(); render();
      toast('Текущая неделя теперь '+(isOdd(todayIso())?'нечётная':'чётная')); break;
    case 'theme': S.settings.theme=S.settings.theme==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',S.settings.theme); save(); render(); break;
    case 'brkAdv': { S.ui.brkAdv=!S.ui.brkAdv; save(); render(); break; }
    case 'shield': L=logOf(d); L.shield=!L.shield; save(); closeSheet(); render(); toast(L.shield?'Щит поставлен, серия цела':'Щит снят'); break;
    case 'toggle': {
      L=logOf(d);
      var pl=planDay(d),o=pl.items.filter(function(x){return x.id===id})[0];
      if(!o)break;
      if(o.done)delete L.done[id]; else L.done[id]=o.min;
      save(); closeSheet(); render();
      if(!o.done){var r=planDay(d).ratio; if(r>=0.999)toast('День закрыт полностью');}
      break; }
    case 'menu': sheetMenu(id); break;
    case 'timer': {
      var t=S.ui.timer;
      if(t&&t.id===id&&t.date===d){
        var mins=Math.min(480,Math.max(1,Math.round((Date.now()-t.t0)/60000)));
        L=logOf(d); L.done[id]=(L.done[id]||0)+mins; S.ui.timer=null; save(); render(); toast('Записано '+hm(mins));
      }else{ S.ui.timer={id:id,date:d,t0:Date.now()}; save(); render(); toast('Таймер пошёл'); }
      break; }
    case 'part': sheetPart(id); break;
    case 'savePart': {
      var pm=parseInt(document.getElementById('p_min').value,10)||0;
      if(pm<=0){toast('Укажите минуты');break}
      L=logOf(d); L.done[id]=Math.min(1440,(L.done[id]||0)+pm);
      save(); closeSheet(); render(); toast('Записано '+hm(pm)); break; }
    case 'tune': sheetTune(id); break;
    case 'saveTune': {
      L=logOf(d);
      var at=document.getElementById('t_at').value,mn=parseInt(document.getElementById('t_min').value,10);
      if(!at){toast('Поставьте время начала');break}
      var curT=startOf(d,id),snpT=snapDay(d),dlt=(curT!=null)?(t2m(at)-curT):0;
      L.ovr[id]=L.ovr[id]||{};
      L.ovr[id].at=at; if(mn>0)L.ovr[id].min=mn;
      if(TMP.shift&&dlt&&curT!=null)shiftAfter(d,curT+1,dlt,id);
      save(); closeSheet(); render();
      toast((TMP.shift&&dlt)?'Сдвинул дело и всё, что после':'Сохранено',function(){restoreDay(d,snpT)});
      break; }

/* снимок дня для кнопки «Вернуть» в подсказке */
/* ===== работа со временем блоков ===== */
/* строки дня сверху вниз: всё, что можно двигать */
function dayRows(d){
  return planDay(d).items.filter(function(o){return !o.skipped&&!o.parallel})
    .sort(function(a,b){return a.s-b.s}).map(function(o){return o.id});
}
/* перенести блок на новое время; то, что идёт «вместе с ним», едет следом */
function moveBlock(d,id,newS){
  var p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return false;
  var L=logOf(d),delta=newS-o.s;
  if(newS<0)newS=0; if(newS>23*60+55)newS=23*60+55;
  var set=function(x,ns){L.ovr[x.id]=L.ovr[x.id]||{};L.ovr[x.id].at=m2t(Math.max(0,Math.min(23*60+55,ns)))};
  set(o,newS);
  p.items.forEach(function(x){
    if(x.id===id||x.skipped)return;
    if(x.par&&(x.par===o.id||x.par===o.dir)&&x.s===o.s)set(x,x.s+delta);
  });
  return true;
}
/* обмен временем: два дела меняются началом, длительность у каждого своя */
function swapTimes(d,a,b){
  if(a===b)return false;
  var p=planDay(d),oa=p.items.filter(function(x){return x.id===a})[0],ob=p.items.filter(function(x){return x.id===b})[0];
  if(!oa||!ob||oa.s===ob.s)return false;
  var sa=oa.s,sb=ob.s;
  moveBlock(d,a,sb); moveBlock(d,b,sa);
  return true;
}
/* сдвинуть всё, что начинается не раньше указанного времени */
function shiftAfter(d,fromS,delta,exceptId){
  var p=planDay(d),n=0;
  p.items.filter(function(x){return !x.skipped&&x.id!==exceptId&&x.s>=fromS})
    .forEach(function(x){ moveBlock(d,x.id,x.s+delta); n++ });
  return n;
}
/* свободное место под блок: сначала пробуем желаемое время, потом первую дырку */
function freeSlot(d,min,prefer){
  var p=planDay(d),busy=p.items.filter(function(x){return !x.skipped&&!x.parallel})
    .map(function(x){return {s:x.s,e:x.e}}).sort(function(a,b){return a.s-b.s});
  var mb=[],i;
  busy.forEach(function(b){var l=mb[mb.length-1];if(l&&b.s<=l.e)l.e=Math.max(l.e,b.e);else mb.push({s:b.s,e:b.e})});
  var fits=function(st){ if(st+min>dayEnd())return false;
    for(var k=0;k<mb.length;k++){if(st<mb[k].e&&mb[k].s<st+min)return false} return true };
  if(prefer!=null&&fits(prefer))return prefer;
  var c=dayStart();
  for(i=0;i<mb.length;i++){ if(c+min<=mb[i].s)return c; if(mb[i].e+10>c)c=mb[i].e+10 }
  if(c+min<=dayEnd())return c;
  return prefer!=null?prefer:Math.max(dayStart(),dayEnd()-min);
}
/* разложить день без накладок: каждое следующее дело после предыдущего */
function packDay(d){
  var list=planDay(d).items.filter(function(x){return !x.skipped&&!x.parallel})
    .sort(function(a,b){return a.s-b.s});
  var prev=null,moved=0,i;
  for(i=0;i<list.length;i++){
    var x=list[i],ns=x.s;
    if(prev!=null&&ns<prev)ns=prev+10;
    if(ns!==x.s){moveBlock(d,x.id,ns);moved++}
    prev=ns+x.min;
  }
  return moved;
}
/* что сказать человеку после перестановки */
function moveMsg(d,id,was){
  var o=planDay(d).items.filter(function(x){return x.id===id})[0];
  if(!o)return 'Готово';
  var nm=o.title.split(',')[0];
  if(was!=null&&o.s===was)return nm+' остался в '+m2t(o.s);
  return nm+' теперь в '+m2t(o.s);
}
function startOf(d,id){var o=planDay(d).items.filter(function(x){return x.id===id})[0];return o?o.s:null}
function snapDay(d){return JSON.stringify({l:S.log[d]||null,t:S.tasks})}
function restoreDay(d,snap){
  var o=JSON.parse(snap);
  S.tasks=o.t; if(o.l)S.log[d]=o.l; else delete S.log[d];
  save(); render();
}
/* убрать блок из дня: разовую задачу удаляем совсем, шаблонную прячем на этот день */
function dropFromDay(id,d){
  var L=logOf(d),t=S.tasks.filter(function(x){return x.id===id})[0];
  var ai=L.add.indexOf(id); if(ai>=0)L.add.splice(ai,1);
  delete L.ovr[id]; delete L.done[id];
  if(t&&t.date===d){S.tasks=S.tasks.filter(function(x){return x.id!==id});return 'del'}
  if(L.skip.indexOf(id)<0)L.skip.push(id);
  return 'skip';
}
/* поставить готовую задачу в день, в том числе второй раз за день */
var LASTPUT=null;
function putInDay(tid,d){
  var L=logOf(d),t=S.tasks.filter(function(x){return x.id===tid})[0];
  LASTPUT=tid;
  if(!t)return null;
  var si=L.skip.indexOf(tid);
  if(si>=0){L.skip.splice(si,1);return 'back'}
  var mode=S.settings.mode,mn=(mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
  var here=instances(d).some(function(x){return x.id===tid});
  if(!here&&mn>0&&!t.date){ if(L.add.indexOf(tid)<0)L.add.push(tid); return 'add' }
  /* повтор того же дела или задача, у которой в этом режиме ноль минут: ставим копию на день */
  if(!mn)mn=t.min||t.minA||30;
  var want=(S.settings.mode==='A'&&t.atA)?t.atA:(t.at||'12:00');
  var c=T({title:t.title,dir:t.dir,min:mn,at:m2t(freeSlot(d,mn,t2m(want))),days:[],date:d,core:false,
           par:t.par||null,note:t.note||''});
  S.tasks.push(c);
  LASTPUT=c.id;
  return 'copy';
}

function sheetPick(rep){
  var d=S.ui.date,L=logOf(d),p=planDay(d);
  var inDay={};
  p.items.forEach(function(x){if(!x.skipped)inDay[x.id]={s:x.s}});
  var rt=rep?p.items.filter(function(x){return x.id===rep})[0]:null;
  var cand=S.tasks.filter(function(t){return t.active&&!t.date&&t.id!==rep});
  cand.sort(function(a,b){return (DKEYS.indexOf(a.dir)-DKEYS.indexOf(b.dir))||((a.title<b.title)?-1:1)});
  var h='<h3>'+(rt?'Чем заменить':'Что поставить в день')+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-9px 0 13px">'+
      (rt?'Встанет на '+m2t(rt.s)+' вместо дела «'+esc(rt.title.split(',')[0])+'», только на '+dateShort(d)+'. Шаблон недели не меняется.'
         :'Задача встанет только в '+dateShort(d)+', на своё время или в ближайшее свободное. Шаблон недели не меняется.')+'</div>';
  if(!cand.length)h+='<div class="dim" style="padding:2px 2px 12px;font-size:13px">Готовых задач нет. Создайте разовую.</div>';
  else h+='<div class="picklist">'+cand.map(function(t){
      var mn=(S.settings.mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
      if(!mn)mn=t.min||t.minA||30;
      var st=inDay[t.id];
      return '<button class="pickrow" data-act="pickTask" data-id="'+t.id+'" data-v="'+(rep||'')+'">'+
        '<i style="background:'+DIRS[t.dir].c+'"></i>'+
        '<span class="pn">'+esc(t.title)+
          '<i class="sub">'+(st?'уже в плане на '+m2t(st.s)+', встанет ещё раз':'в шаблоне на '+((S.settings.mode==='A'&&t.atA)?t.atA:(t.at||'')))+'</i>'+
        '</span>'+
        '<span class="pm">'+hm(mn)+'</span></button>';
    }).join('')+'</div>';
  h+='<div class="row-btns" style="margin-top:14px">'+
     (rt?'<button class="btn" data-act="skip" data-id="'+rep+'">Просто убрать блок</button>':'')+
     '<button class="btn" data-act="addToday">Создать разовую</button>'+
     '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>';
  openSheet(h);
}
function sheetPart(id){
  var d=S.ui.date,p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return;
  var left=Math.max(5,o.min-(o.doneMin||0)),base=[15,30,45,60,90];
  if(base.indexOf(left)<0)base.push(left);base.sort(function(a,b){return a-b});
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Записано '+hm(o.doneMin||0)+' из '+hm(o.min)+'. Блок закроется сам, когда наберётся полностью.</div>'+
    '<div class="mins">'+base.map(function(x){return '<button data-pick="pmin" data-v="'+x+'">'+hm(x)+'</button>'}).join('')+'</div>'+
    '<div class="f"><label>Минут</label><input type="number" inputmode="numeric" id="p_min" value="'+left+'"></div>'+
    '<div class="row-btns"><button class="btn pri" data-act="savePart" data-id="'+id+'">Записать</button>'+
    '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>');
}
function sheetTune(id){
  var d=S.ui.date,p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return;
  TMP={shift:false};
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Меняется только '+dateShort(d)+', шаблон недели остаётся прежним.</div>'+
    '<div style="display:flex;gap:12px"><div class="f" style="flex:1"><label>Начало</label><input type="time" id="t_at" value="'+o.at+'"></div>'+
    '<div class="f" style="flex:1"><label>Минут</label><input type="number" inputmode="numeric" id="t_min" value="'+o.min+'"></div></div>'+
    '<div class="trow" style="border-bottom:0"><div class="mid"><div class="nm">Сдвинуть и всё, что после</div>'+
    '<div class="mt">Остальные дела дня переедут на столько же</div></div>'+
    '<button class="sw" data-pick="shiftAfter"><i></i></button></div>'+
    '<div class="row-btns" style="margin-top:16px"><button class="btn pri" data-act="saveTune" data-id="'+id+'">Сохранить</button>'+
    '<button class="btn" data-act="resetTune" data-id="'+id+'">Вернуть как в шаблоне</button></div>');
}
/* тикер таймера */
function tickClock(){
  var el=document.getElementById('runclock');
  if(el&&S.ui.timer)el.textContent=' · идёт '+hm(Math.max(1,Math.round((Date.now()-S.ui.timer.t0)/60000)));
}
setInterval(tickClock,20000);
/* смена даты на новый день */
setInterval(function(){
  if(S.ui.view==='day'&&S.ui._d&&S.ui._d!==todayIso()){S.ui._d=todayIso();S.ui.date=todayIso();render(true);S.ui._d=todayIso();return}
  S.ui._d=todayIso();
  if(S.ui.view==='day'&&S.ui.date===todayIso()&&!SH.classList.contains('open'))render();
},60000);
render();
</script>
</body>
</html>
