<style>
:root{
  --bg:#0B0B0C; --panel:#111113; --panel2:#17171A; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
  --fg:#ECEAE7; --dim:#8A8A90; --dim2:#5C5C64; --acc:#C2A170; --accSoft:rgba(194,161,112,.13);
  --ok:#86A98C; --warn:#C98F86; --r:18px; --rs:12px;
  --android:#7FB7A3; --sites:#C2A170; --pdd:#8FA2C8; --content:#C98F86; --study:#9D93B8; --body:#A9B08E; --life:#8A8A90;
}
html[data-theme="light"]{
  --bg:#F3F1EC; --panel:#FFFFFF; --panel2:#FAF8F4; --line:rgba(18,21,28,.11); --line2:rgba(18,21,28,.07);
  --fg:#12151C; --dim:#6E747E; --dim2:#A2A7AE; --acc:#A96410; --accSoft:rgba(169,100,16,.10);
  --ok:#4F7A57; --warn:#A8584C;
  --android:#2F7F67; --sites:#A96410; --pdd:#44618F; --content:#A05A50; --study:#5F5485; --body:#5E6B3C; --life:#6E747E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
html{scrollbar-gutter:stable}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.mono{font-variant-numeric:tabular-nums}
.lab{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2);font-weight:500;overflow-wrap:anywhere}
.dim{color:var(--dim)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* ---------- shell ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.top-in{max-width:860px;margin:0 auto;padding:9px 18px;min-height:56px;display:flex;align-items:center;gap:12px}
.topgap{height:calc(57px + env(safe-area-inset-top))}
#modeChip{min-width:104px;justify-content:center}
.brand{font-size:14.5px;letter-spacing:.01em;font-weight:500;white-space:nowrap}
.brand b{font-weight:600}
.brand span{color:var(--acc)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:11.5px;color:var(--dim);background:var(--panel);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0 3px}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 42%,transparent);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.acc{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);background:var(--accSoft)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:hover{color:var(--fg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  background:var(--bg);border-top:1px solid var(--line2);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim2);font-size:10px;letter-spacing:.04em;padding:4px 0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px 17px;margin:14px 0}
.card.pad0{padding:0;overflow:hidden}
.h1{font-size:clamp(21px,6.2vw,25px);font-weight:300;letter-spacing:-.015em;margin:22px 0 2px;min-width:0;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:var(--dim)}
.h2{font-size:12.5px;font-weight:500;letter-spacing:.02em;margin:0 0 10px}
.sect{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sect .line{flex:1;height:1px;background:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;font-size:13.5px;color:var(--fg);background:var(--panel);transition:.15s}
.btn svg{width:14px;height:14px;flex:0 0 14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.pri svg{stroke-width:2}
.btn:hover{border-color:var(--dim2)}
.btn.pri{background:var(--acc);color:#0B0B0C;border-color:var(--acc);font-weight:500}
html[data-theme="light"] .btn.pri{color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btns .btn{flex:0 1 auto;min-width:0;max-width:100%}
.dayhead .datenav{flex:0 0 auto}

/* ---------- day ---------- */
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.datenav{display:flex;gap:6px;align-items:center}
.load{display:flex;gap:2px;height:6px;border-radius:4px;overflow:hidden;background:var(--line2);margin:14px 0 9px}
.load i{display:block;height:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}

.tl{margin:4px -4px}
.item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);position:relative}
.item:last-child{border-bottom:0}
.item .time{width:52px;flex:0 0 52px;font-size:12.5px;color:var(--dim);padding-top:2px;line-height:1.35}
.item .time s{display:block;text-decoration:none;color:var(--dim2);font-size:11px}
.item .time.at{color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.item .time.at s{color:var(--dim2);font-weight:400}
.item .time .no{display:block;font-size:15px;color:var(--dim2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.item .time .du{display:block;font-size:11px;color:var(--dim2);margin-top:1px}
.item .bar{width:2px;border-radius:2px;background:var(--c,var(--acc));opacity:.75;flex:0 0 2px}
.item .mid{flex:1;min-width:0}
.item .ttl{font-size:14.5px;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.item .ttl>span{min-width:0;overflow-wrap:anywhere}
.item .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.item .note{font-size:11.5px;color:var(--dim2);margin-top:3px;font-style:italic}
.item .acts{display:flex;align-items:flex-start;gap:3px;padding-top:1px}
.item.done .ttl{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.item.done .bar{opacity:.3}
.item.drag{opacity:.35}
.grip{width:26px;height:34px;flex:0 0 26px;display:grid;place-items:center;color:var(--line);
  border-radius:8px;border:1px solid transparent;touch-action:none;cursor:grab}
.grip:hover{color:var(--dim2);border-color:var(--line)}
.grip:active{cursor:grabbing}
.grip svg{width:14px;height:14px;fill:currentColor;stroke:none}
.item.dropon{background:color-mix(in srgb,var(--acc) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);border-radius:12px}
.ghostrow.ok{border-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.ghostrow{position:fixed;z-index:80;pointer-events:none;max-width:72vw;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:var(--panel);color:var(--fg);font-size:13.5px;padding:9px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);box-shadow:0 16px 36px rgba(0,0,0,.5);opacity:.97}
.ghostrow i{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:8px;vertical-align:1px}
body.dragging{user-select:none;-webkit-user-select:none}
.chk{width:22px;height:22px;border-radius:7px;border:1.4px solid var(--line);flex:0 0 22px;display:grid;place-items:center;margin-top:1px}
.chk svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--acc);border-color:var(--acc)}
.item.done .chk svg{opacity:1}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim2);border:1px solid transparent}
.mini:hover{color:var(--fg);border-color:var(--line)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mini.run{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accSoft)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim2)}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.brk{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 68px;font-size:11px;color:var(--dim2)}
.brk .l{flex:1;height:1px;background:var(--line2)}
.pbar{height:3px;background:var(--line2);border-radius:3px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--acc));opacity:.8}

/* rings */
.ring{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dasharray .4s}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400}
.statrow{display:flex;gap:16px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border-radius:var(--rs);overflow:hidden}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{background:var(--panel);padding:13px 12px}
.statgrid b{display:block;font-size:19px;font-weight:300;margin-top:3px;overflow-wrap:anywhere}
.statgrid.p2 div{background:var(--panel2)}

/* week */
.wkday{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.wkday:last-child{border-bottom:0}
.wkday .d{width:54px;flex:0 0 54px}
.wkday .d b{display:block;font-size:15px;font-weight:400}
.wkday .d s{display:block;text-decoration:none;font-size:11px;color:var(--dim2)}
.wkday .info{flex:1;min-width:0}
.wkday .info .t{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkday.today{background:var(--accSoft);border-radius:10px;padding-left:9px;padding-right:9px}
.mini-ring{width:34px;height:34px;flex:0 0 34px;position:relative}
.mini-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;color:var(--dim)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:3px;border-radius:2px;background:var(--c);opacity:.85}

/* tasks */
.trow{display:flex;gap:11px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-size:14px;overflow-wrap:anywhere}
.trow .mt{font-size:11.5px;color:var(--dim);margin-top:2px}
.trow.off .nm,.trow.off .mt{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
/* метка времени: переключатель, крупная цифра и ползунок */
.timebox{margin:2px 0 16px;padding:13px 14px 9px;border:1px solid var(--line2);border-radius:var(--rs);background:var(--panel2)}
.tbig{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:4px}
.tbig b{font-size:30px;font-weight:600;letter-spacing:.01em;color:var(--acc);font-variant-numeric:tabular-nums;min-width:104px;text-align:center}
.tbig .iconbtn{width:38px;height:38px;flex:0 0 38px;font-size:19px;line-height:1}
.tscale{display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);letter-spacing:.06em;margin-top:-2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0;display:block}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--line);border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;
  background:var(--acc);border:4px solid var(--panel);box-shadow:0 2px 9px rgba(0,0,0,.45);cursor:pointer}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--line);border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--acc);
  border:4px solid var(--panel);box-shadow:0 2px 9px rgba(0,0,0,.45);cursor:pointer}
.sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);position:relative;flex:0 0 38px;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim2);transition:.18s}
.sw.on{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.sw.on i{left:18px;background:var(--acc)}

/* flow */
.stage{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.stage:last-child{border-bottom:0}
.stage .nm{flex:1;min-width:0;font-size:14px}
.stage .st{font-size:11px;color:var(--dim)}
.sbar{display:flex;gap:4px;margin:10px 0 2px}
.sbar div{flex:1;min-width:0;text-align:center;font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim2);
  padding:7px 1px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar div b{display:block;font-size:15px;color:var(--fg);font-weight:300;margin-top:2px}

/* progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line2);position:relative}
.heat i.l1{background:color-mix(in srgb,var(--acc) 22%,var(--line2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 48%,var(--line2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 78%,var(--line2))}
.heat i.sh{box-shadow:inset 0 0 0 1.4px var(--pdd)}
.heat i.tdy{box-shadow:inset 0 0 0 1.4px var(--fg)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar2{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bar2 .n{width:76px;flex:0 0 76px;color:var(--dim)}
.bar2 .t{flex:1;height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar2 .t i{display:block;height:100%;background:var(--c);opacity:.85}
.bar2 .v{width:104px;flex:0 0 104px;text-align:right;color:var(--dim);font-size:11.5px;white-space:nowrap}
.bar2 .v s{text-decoration:none;color:var(--dim2)}
.bar2 .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.badge:last-child{border-bottom:0}
.badge .ic{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;
  font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--dim2);overflow:hidden;text-align:center}
.badge .ic.l3{font-size:11px}
.badge .ic.l4{font-size:9.5px;letter-spacing:-.03em}
.badge.got .ic{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc);background:var(--accSoft)}
.badge .nm{font-size:13.5px}
.badge.got .nm{color:var(--fg)}
.badge:not(.got) .nm{color:var(--dim)}
.badge .ds{font-size:11.5px;color:var(--dim2)}
.badge .pg{height:3px;border-radius:2px;background:var(--line2);margin-top:6px;max-width:190px;overflow:hidden}
.badge .pg i{display:block;height:100%;background:var(--dim2);border-radius:2px}
.badge .bct{font-size:11px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge .bok{width:18px;height:18px;color:var(--acc);flex:0 0 auto}
.badge .bok svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.picklist{max-height:48vh;overflow:auto;margin:0 -2px 2px;padding:0 2px}
.pickrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;margin-bottom:7px;
  border:1px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--fg)}
.pickrow>i{width:3px;height:24px;border-radius:2px;flex:0 0 3px}
.pickrow .pn{flex:1;min-width:0;font-size:14px;overflow:hidden}
.pickrow .sub{display:block;font-style:normal;font-size:11px;line-height:1.35;color:var(--dim2);margin-top:3px}
.pickrow .sub.warn{color:var(--warn)}
.pickrow.on{border-color:color-mix(in srgb,var(--acc) 45%,transparent);background:var(--accSoft)}
.pickrow.on .pm{color:var(--acc)}
.pickrow .pm{font-size:11.5px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.mbar{display:flex;gap:1px;margin:15px 0 0;background:var(--line2);border-radius:var(--rs);overflow:hidden}
.mbar>div{flex:1;background:var(--panel2);padding:10px 11px;min-width:0;overflow:hidden}
.mbar span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);line-height:1.3;min-height:26px}
.mbar b{font-size:13.5px;font-weight:400;display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--dim);background:var(--panel2)}
.seg button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.days{display:flex;gap:5px}
.days button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--dim);background:var(--panel2)}
.days button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet .cardx{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.shbar{position:sticky;top:0;z-index:6;background:var(--panel);margin:-10px -18px 10px;padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:center;border-radius:22px 22px 0 0}
.shclose{position:absolute;right:12px;top:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.shclose:active{background:var(--line2);color:var(--fg)}
#sheet #sheetBody>.row-btns:last-child{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));z-index:5;
  background:var(--panel);margin:16px 0 0;padding:13px 0 calc(14px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2)}
.movebar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0 0 15px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.movebar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:66px;padding:11px 5px;background:var(--panel2);color:var(--fg);
  font-size:11.5px;line-height:1.25;letter-spacing:.01em;text-align:center}
.movebar svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.movebar button:active{background:var(--accSoft)}
.movebar button:active svg{stroke:var(--acc)}
@media (hover:hover){.movebar button:hover svg{stroke:var(--acc)}}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.mins{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mins button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13.5px;color:var(--fg);background:var(--panel2)}
.mins button.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.nowline{display:flex;align-items:center;gap:9px;margin:7px 0 7px 52px}
.nowline b{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.nowline i{height:1px;flex:1;background:var(--acc);opacity:.4}
.sheet h3{font-size:17px;font-weight:400;margin:0 0 14px}
.menu button{display:flex;width:100%;gap:11px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line2);font-size:15px;text-align:left;line-height:1.35}
.menu button:last-child{border-bottom:0}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;transform:translateY(10px);
  bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  background:var(--panel2);color:var(--fg);border:1px solid var(--line);padding:0;border-radius:16px;
  font-size:13px;line-height:1.45;text-align:left;overflow:hidden;
  max-width:min(92vw,440px);opacity:0;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -20px rgba(0,0,0,.9);
  transition:opacity .2s ease,transform .26s cubic-bezier(.2,.85,.3,1)}
.toast.on{opacity:1;transform:translateY(0)}
.toast .tin{display:flex;align-items:stretch}
.toast .tmsg{flex:1;min-width:0;align-self:center;padding:11px 15px;overflow-wrap:anywhere}
.toast:not(.act) .tmsg{text-align:center}
.toast .tundo{flex:0 0 auto;display:flex;align-items:center;padding:0 16px;min-height:46px;
  border-left:1px solid var(--line);color:var(--acc);font-size:13px;font-weight:500;white-space:nowrap}
.toast .tundo:active{background:var(--accSoft)}
.toast .tbar{display:block;height:2px;background:var(--acc);opacity:.5;transform-origin:left center}
.toast.act .tbar{animation:drain 3.4s linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast.act{pointer-events:auto}
#sheet.open ~ .toast{top:calc(9px + env(safe-area-inset-top));bottom:auto;transform:translateY(-10px)}
#sheet.open ~ .toast.on{transform:translateY(0)}

@media (max-width:359px){
  .wrap,.top-in{padding-left:13px;padding-right:13px}
  .item{gap:9px}
  .item .time{width:46px;flex:0 0 46px;font-size:12px}
  .brk{padding-left:58px}
  .nowline{margin-left:46px}

}

  .top{padding-left:216px}
  .tabbar{top:0;bottom:auto;left:0;right:auto;width:216px;height:100vh;flex-direction:column;justify-content:flex-start;
    gap:3px;border-top:0;border-right:1px solid var(--line2);padding:78px 14px 20px;background:var(--panel)}
  .tab{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:13.5px;letter-spacing:0;
    padding:11px 12px;border-radius:11px;width:100%}
  .tab.on{background:var(--panel2)}
  .deskbrand{position:fixed;top:0;left:0;width:216px;padding:22px 26px;z-index:50;font-size:14.5px}
}

    max-height:84vh;border-radius:20px;border:1px solid var(--line);animation:upc .22s ease}

}

<script>
'use strict';
/* ============================ storage ============================ */
var KEY='devnprt.planner.v1', MEM=null;
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return MEM}}
function prune(){
  for(var d in S.log){var L=S.log[d];
    var e=(!L.done||!Object.keys(L.done).length)&&(!L.skip||!L.skip.length)&&(!L.ovr||!Object.keys(L.ovr).length)&&
          (!L.add||!L.add.length)&&(!L.ord||!Object.keys(L.ord).length)&&!L.shield;
    if(e)delete S.log[d];}
}
function save(){try{prune();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){MEM=S}}
var uid=function(){return Math.random().toString(36).slice(2,9)};

/* ============================ utils ============================ */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var prs=function(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
var todayIso=function(){return iso(new Date())};
var wday=function(s){var n=prs(s).getDay();return n===0?7:n};
var addD=function(s,n){var d=prs(s);d.setDate(d.getDate()+n);return iso(d)};
var monday=function(s){return addD(s,1-wday(s))};
var wserial=function(s){return Math.round((prs(monday(s))-prs('2024-01-01'))/6048e5)};
var t2m=function(t){var a=t.split(':');return (+a[0])*60+(+a[1])};
var m2t=function(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
/* отбой после полуночи относится к этим же суткам: 00:30 это конец дня, а не его начало */
var dayStart=function(){return t2m(S.settings.wake)};
var dayEnd=function(){var w=t2m(S.settings.wake),e=t2m(S.settings.sleep);if(e<=w)e+=1440;return e-30};
var hm=function(m){if(m<=0)return '0 мин';var h=Math.floor(m/60),x=m%60;return (h?h+' ч':'')+(h&&x?' ':'')+(x?x+' мин':'')};
var hmS=function(m){var h=m/60;return (Math.round(h*10)/10).toString().replace('.',',')+' ч'};
var MONTH=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONTHN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WDL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var WDS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var dateLong=function(s){var d=prs(s);return WDL[wday(s)-1]+', '+d.getDate()+' '+MONTH[d.getMonth()]};
var dateShort=function(s){var d=prs(s);return d.getDate()+' '+MONTH[d.getMonth()].slice(0,3)};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})};
var DIRS={
  android:{t:'Android',c:'var(--android)'}, sites:{t:'Сайты',c:'var(--sites)'},
  pdd:{t:'Права',c:'var(--pdd)'}, content:{t:'Контент',c:'var(--content)'},
  study:{t:'ТИСБИ',c:'var(--study)'}, body:{t:'Тело',c:'var(--body)'}, life:{t:'Прочее',c:'var(--life)'}
};
var DKEYS=['android','sites','pdd','content','study','body','life'];

/* ============================ defaults ============================ */
function T(o){
  var b={id:uid(),title:'',dir:'sites',min:60,fix:false,at:null,atA:null,ord:500,
         days:[1,2,3,4,5],weeks:'all',date:null,with:[],
         core:false,note:'',active:true,only:null,minA:null,daysA:null,optional:false};
  for(var k in o)b[k]=o[k];
  if(!b.with)b.with=[];
  if(b.fix&&!b.at)b.at='12:00';
  return b;
}
/* дни, где две метки времени спорят друг с другом: двигаем только их.
   Всё остальное день раскладывает сам, по порядку задач. */
var DAYFIX={
  '2026-11-09':{'t-lunch':{at:'14:10'}},
  '2026-11-15':{'t-dinner':{at:'17:30'}}
};
var DAYFIX_NOTE={'2026-11-07':'вождение 15:00',
  '2026-11-09':'собеседование 12:00, обед сдвинут',
  '2026-11-14':'вождение 8:00, пары закрыты практикой',
  '2026-11-15':'вождение 19:00, ужин раньше'};
function defaults(){
  var t=todayIso();
  return {
    v:6,
    settings:{mode:'B',wake:'06:00',sleep:'23:00',theme:'dark',goal:60000,
      parity:{serial:wserial('2026-11-02'),odd:false},
      norms:{B:{android:19,sites:16,pdd:12,content:7,body:4.5},A:{android:12,sites:6,pdd:8,content:3,body:3}}},
    tasks:[
      /* --- метки времени: внешние события, еда и зал --- */
      T({id:'t-morning',title:'Подъём, душ, завтрак',dir:'life',min:35,ord:10,fix:true,at:'06:00',days:[1,2,3,4,5,6,7]}),
      T({id:'tisbi-mon',title:'ТИСБИ, пары',dir:'study',min:170,ord:120,fix:true,at:'08:00',days:[1],weeks:'all',optional:true,note:'Дистант: ходить необязательно, практику всё равно сдавать'}),
      T({id:'tisbi-sat-odd',title:'ТИСБИ, пары',dir:'study',min:260,ord:120,fix:true,at:'08:00',days:[6],weeks:'odd',optional:true,note:'Нечётная неделя: 8:00 до 12:20'}),
      T({id:'tisbi-sat-even',title:'ТИСБИ, пары',dir:'study',min:170,ord:120,fix:true,at:'09:30',days:[6],weeks:'even',optional:true,note:'Чётная неделя: 9:30 до 12:20'}),
      T({id:'t-road1',title:'Дорога на работу',dir:'life',min:30,ord:150,fix:true,at:'08:30',days:[2,3,4,5],only:'A'}),
      T({id:'t-bank',title:'Работа в банке',dir:'life',min:720,ord:160,fix:true,at:'09:00',days:[2,3,4,5],only:'A',note:'Вторник до пятницы, 9:00 до 21:00'}),
      T({id:'t-lunch',title:'Обед',dir:'life',min:30,minA:30,ord:400,fix:true,at:'12:40',atA:'12:40',days:[1,2,3,4,5,6,7],daysA:[1,6,7]}),
      T({id:'t-dinner',title:'Ужин',dir:'life',min:30,minA:30,ord:650,fix:true,at:'19:00',atA:'21:40',days:[1,2,3,4,5,6,7],daysA:[1,2,3,4,5,6,7]}),
      T({id:'t-road2',title:'Дорога домой',dir:'life',min:30,ord:850,fix:true,at:'21:00',days:[2,3,4,5],only:'A',with:['t-pdd3']}),
      T({id:'t-gym',title:'Зал',dir:'body',min:90,minA:90,ord:800,fix:true,at:'20:50',atA:'17:40',days:[2,4,6],daysA:[1,6],with:['t-pdd2'],note:'Минимум полтора часа вместе с дорогой и душем'}),
      T({title:'Собеседование, Альфа-банк',dir:'life',min:120,ord:300,fix:true,at:'12:00',date:'2026-11-09',days:[],note:'С запасом на дорогу, после собеседования день продолжается'}),
      T({title:'Вождение',dir:'pdd',min:120,ord:300,fix:true,at:'15:00',date:'2026-11-07',days:[]}),
      T({title:'Вождение',dir:'pdd',min:120,ord:300,fix:true,at:'08:00',date:'2026-11-14',days:[]}),
      T({title:'Вождение',dir:'pdd',min:120,ord:300,fix:true,at:'19:00',date:'2026-11-15',days:[]}),
      /* --- свободный порядок: идут подряд и обходят метки --- */
      T({id:'t-sites1',title:'Ответы и поиск клиентов',dir:'sites',min:60,minA:30,ord:200,days:[1,2,3,4,5,6],daysA:[1,2,3,4,5,6,7],core:true,note:'Сначала ответы по переписке, потом новые адресаты'}),
      T({id:'t-android1',title:'Android, основной блок',dir:'android',min:90,minA:60,ord:250,days:[2,3,4,5,7],daysA:[2,3,4,5,7],core:true,note:'Свежая голова: в полный день полтора часа, в день со сменой час'}),
      T({id:'t-android1s',title:'Android, основной блок',dir:'android',min:90,minA:60,ord:250,days:[1,6],daysA:[1,6],core:true,note:'В дни пар этот блок идёт после учёбы'}),
      T({id:'t-sites2',title:'Разработка сайта',dir:'sites',min:150,minA:150,ord:450,days:[1,2],daysA:[1]}),
      T({id:'t-sites2b',title:'Разработка сайта',dir:'sites',min:150,minA:150,ord:450,days:[3,4],daysA:[],note:'В среду и четверг сайт идёт сразу после обеда'}),
      T({id:'t-shoot',title:'Съёмка',dir:'content',min:90,minA:0,ord:470,days:[5]}),
      T({id:'t-pract',title:'Практика по дистанту',dir:'study',min:90,minA:60,ord:480,days:[7],daysA:[7],note:'Задачи ТИСБИ, без привязки к парам'}),
      T({id:'t-android2',title:'Android, практика',dir:'android',min:120,minA:90,ord:520,days:[3,4,5,6],daysA:[6],note:'Второй заход: практика, разбор ошибок, свой проект'}),
      T({id:'t-edit',title:'Монтаж ролика',dir:'content',min:120,minA:120,ord:560,days:[7],daysA:[7]}),
      T({id:'t-loc',title:'Поиск локации и референсов',dir:'content',min:60,minA:0,ord:600,days:[2]}),
      T({id:'t-pdd1',title:'ПДД, билеты',dir:'pdd',min:60,minA:30,ord:700,days:[1,2,3,4,5,6,7],daysA:[1,6,7],core:true}),
      T({id:'t-pdd2',title:'ПДД, разбор на ходу',dir:'pdd',min:40,minA:40,ord:800,days:[2,4,6],daysA:[1,6],with:['t-gym'],note:'Вместе с залом: билеты между подходами, теория на кардио'}),
      T({id:'t-pdd3',title:'ПДД, повторение в дороге',dir:'pdd',min:30,minA:30,ord:850,days:[2,3,4,5],only:'A',with:['t-road2'],note:'Вместе с дорогой домой'}),
      T({id:'t-insta',title:'Инстаграм: сторис, ответы, публикация',dir:'content',min:20,minA:20,ord:900,days:[1,2,3,4,5,6,7],daysA:[1,6,7]})
    ],
    log:(function(){var L={},k;for(k in DAYFIX_NOTE)L[k]={done:{},skip:(k==='2026-11-14'?['tisbi-sat-odd']:[]),
          ovr:(DAYFIX[k]?JSON.parse(JSON.stringify(DAYFIX[k])):{}),note:DAYFIX_NOTE[k]||''};return L})(),
    clients:[], reels:[], income:[], shield:{}, ui:{view:'day',date:t,week:monday(t),timer:null}
  };
}
var S=load();
if(!S||!S.tasks){S=defaults();save()}
/* --- перенос на новую модель дня, выполняется один раз --- */
(function migrate(){
  if((S.v||1)>=2)return;
  var D=defaults(),FIELDS=['title','dir','min','minA','days','daysA','at','atA','weeks','only','core','optional','par','note'];
  var OLD={'Android, глубокий блок':'t-android1','Android, второй блок':'t-android2',
           'Ответы и поиск клиентов':'t-sites1','Разработка сайта':'t-sites2','Практика по дистанту':'t-pract',
           'Поиск локации и референсов':'t-loc','Съёмка':'t-shoot','Монтаж ролика':'t-edit',
           'ПДД, билеты':'t-pdd1','Зал':'t-gym','ПДД, разбор на ходу':'t-pdd2',
           'Инстаграм: сторис, ответы, публикация':'t-insta','Работа в банке':'t-bank'};
  S.tasks.forEach(function(t){if(t.active===undefined)t.active=true});
  /* вождение 13 ноября отменено */
  S.tasks=S.tasks.filter(function(t){return !(t.date==='2026-11-13'&&t.title==='Вождение')});
  D.tasks.forEach(function(ft){
    if(ft.date)return;
    var ex=null,i;
    for(i=0;i<S.tasks.length;i++){
      var t=S.tasks[i];
      if(t.date)continue;
      if(t.id===ft.id){ex=t;break}
      if(OLD[t.title]===ft.id&&!t._m){ex=t;break}
      if(t.title===ft.title&&t.at===ft.at&&!t._m){ex=t;break}
    }
    if(ex){ex._m=1;FIELDS.forEach(function(k){ex[k]=ft[k]})}
    else S.tasks.push(ft);
  });
  S.tasks.forEach(function(t){delete t._m});
  if(S.settings){
    if(S.settings.wake==='07:30')S.settings.wake='06:00';
    if(S.settings.sleep==='23:30')S.settings.sleep='23:00';
    S.settings.norms=D.settings.norms;
  }
  S.v=2;save();
})();
if(!Array.isArray(S.income)){S.income=[];S.v=3;save()}
/* --- переход на порядок дня: время остаётся только там, где оно действительно нужно --- */
(function migrate6(){
  if((S.v||1)>=6)return;
  var D=defaults(),TPL={},byId={};
  D.tasks.forEach(function(t){if(t.id&&!t.date)TPL[t.id]=t});
  S.tasks.forEach(function(t){byId[t.id]=t});
  S.tasks.forEach(function(t){
    var ref=TPL[t.id];
    if(ref){ t.ord=ref.ord; t.fix=ref.fix; t.at=ref.at; t.atA=ref.atA; t.with=(ref.with||[]).slice(); }
    else{
      t.ord=(typeof t.ord==='number')?t.ord:(t.at?t2m(t.at):500);
      /* разовое событие держит свой час, обычная задача становится свободной */
      t.fix=!!t.date;
      if(!t.fix)t.at=null;
      var w=[];
      if(t.par&&byId[t.par])w.push(t.par);
      t.with=w;
    }
    delete t.par;
  });
  /* связи «вместе» обоюдные */
  S.tasks.forEach(function(t){(t.with||[]).forEach(function(w){
    var o=byId[w]; if(!o)return; o.with=o.with||[];
    if(o.with.indexOf(t.id)<0)o.with.push(t.id);
  })});
  /* в журнале чистим времена у дел без метки, порядок дня начинаем с чистого листа */
  for(var dk in S.log){
    var L=S.log[dk];
    delete L.ord;
    if(L.ovr)for(var ok in L.ovr){
      var rt=byId[ok];
      if(!rt||!rt.fix)delete L.ovr[ok].at;
      if(!L.ovr[ok].at&&!L.ovr[ok].min)delete L.ovr[ok];
    }
  }
  for(var fk in DAYFIX){
    if(fk<todayIso())continue;
    var Lf=logOf(fk);
    for(var fi in DAYFIX[fk])Lf.ovr[fi]=JSON.parse(JSON.stringify(DAYFIX[fk][fi]));
  }
  S.v=6;save();
})();
/* ===== сборка недели по схеме =====
   Чинит состояние любого возраста: ставит времена схемы, убирает мусор прежних версий,
   раскладывает дни с жёсткими событиями. Вызывается при переезде и кнопкой в настройках. */
function rebuildSchedule(){
  var D=defaults(),TPL={},KEEP=['at','atA','fix','ord','days','daysA','min','minA','with','only','core','optional','note','dir','title'];
  D.tasks.forEach(function(t){if(t.id&&!t.date)TPL[t.id]=t});
  /* 1. дела схемы обновляются целиком: длительность, порядок, метка времени и дни */
  S.tasks.forEach(function(t){
    var ref=TPL[t.id];
    if(ref)KEEP.forEach(function(f){t[f]=(ref[f]&&typeof ref[f]==='object')?JSON.parse(JSON.stringify(ref[f])):ref[f]});
    delete t.after;delete t.floor;delete t.gap;delete t.par;
    if(!t.with)t.with=[];
  });
  var renameId=function(a,b){
    for(var dk in S.log){var L=S.log[dk];
      if(L.done&&L.done[a]!=null){L.done[b]=L.done[a];delete L.done[a]}
      if(L.ovr&&L.ovr[a]){L.ovr[b]=L.ovr[a];delete L.ovr[a]}
      if(L.ord&&L.ord[a]!=null){L.ord[b]=L.ord[a];delete L.ord[a]}
      if(L.skip){var i=L.skip.indexOf(a);if(i>=0)L.skip[i]=b}
      if(L.add){var j=L.add.indexOf(a);if(j>=0)L.add[j]=b}
    }
  };
  Object.keys(TPL).forEach(function(id){
    if(S.tasks.some(function(t){return t.id===id}))return;
    var ref=TPL[id];
    /* прежние версии хранили часть дел со случайным ключом: узнаём по названию и неделям */
    var cand=S.tasks.filter(function(t){return !t.date&&!TPL[t.id]&&t.title===ref.title&&(t.weeks||'all')===(ref.weeks||'all')});
    var same=cand.filter(function(t){return String((t.days||[]).join())===String((ref.days||[]).join())})[0]||cand[0];
    if(same){
      renameId(same.id,id); same.id=id;
      KEEP.forEach(function(f){same[f]=(ref[f]&&typeof ref[f]==='object')?JSON.parse(JSON.stringify(ref[f])):ref[f]});
    } else S.tasks.push(JSON.parse(JSON.stringify(ref)));
  });
  /* 2. журнал: следы прежних версий и закрепления времени на сегодня и дальше */
  var byId={};S.tasks.forEach(function(t){byId[t.id]=t});
  for(var dk in S.log){var Lg=S.log[dk];
    delete Lg.shape;delete Lg.focus;
    if(dk>=todayIso())delete Lg.ord;
    if(Lg.ovr)for(var ok in Lg.ovr){
      delete Lg.ovr[ok].after;delete Lg.ovr[ok].floor;delete Lg.ovr[ok].gap;
      var ref2=byId[ok];
      if(!ref2||!ref2.fix||dk>=todayIso())delete Lg.ovr[ok].at;
      if(!Lg.ovr[ok].at&&!Lg.ovr[ok].min)delete Lg.ovr[ok];
    }
  }
  if(S.settings){delete S.settings.brk;delete S.settings.breaks}
  /* 3. дни, где две метки спорят друг с другом */
  for(var fk in DAYFIX){
    if(fk<todayIso())continue;
    var Lf=logOf(fk);
    for(var fi in DAYFIX[fk])Lf.ovr[fi]=JSON.parse(JSON.stringify(DAYFIX[fk][fi]));
  }
  /* 4. свои задачи: порядок по месту в дне, связи «вместе» делаем обоюдными */
  S.tasks.forEach(function(t){
    if(typeof t.ord!=='number')t.ord=t.at?t2m(t.at):500;
    if(!t.fix)t.at=t.at||null;
    (t.with||[]).forEach(function(w){
      var o=byId[w]; if(!o)return;
      o.with=o.with||[];
      if(o.with.indexOf(t.id)<0)o.with.push(t.id);
    });
    t.with=(t.with||[]).filter(function(w){return byId[w]&&w!==t.id});
  });
}
function isOdd(d){var p=S.settings.parity;return (Math.abs(wserial(d)-p.serial)%2===0)?p.odd:!p.odd}
function logOf(d){if(!S.log[d])S.log[d]={};var L=S.log[d];L.done=L.done||{};L.skip=L.skip||[];L.ovr=L.ovr||{};L.add=L.add||[];return L}
function instances(d){
  var L=logOf(d),wd=wday(d),odd=isOdd(d),mode=S.settings.mode,out=[],i,t,ADD=L.add||[];
  for(i=0;i<S.tasks.length;i++){
    t=S.tasks[i];
    if(!t.active)continue;
    /* задача, поставленную в этот день вручную, берём независимо от дней недели и режима */
    if(ADD.indexOf(t.id)<0){
      if(t.only&&t.only!==mode)continue;
      if(t.date){ if(t.date!==d)continue; }
      else{
        var dd=(mode==='A'&&t.daysA)?t.daysA:t.days;
        if(!dd||dd.indexOf(wd)<0)continue;
        if(t.weeks==='odd'&&!odd)continue;
        if(t.weeks==='even'&&odd)continue;
      }
    }
    var min=(mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
    if(min<=0)continue;
    var at=(mode==='A'&&t.atA)?t.atA:t.at;
    var o={id:t.id,title:t.title,dir:t.dir,min:min,fix:!!t.fix,at:at||null,
           ord:(typeof t.ord==='number')?t.ord:500,with:(t.with||[]).slice(),
           core:t.core,note:t.note,optional:t.optional,ref:t};
    var ov=L.ovr[t.id];
    if(ov){
      if(ov.min)o.min=ov.min;
      if(ov.fixDay&&ov.at){o.fix=true;o.at=ov.at}
      else if(ov.at&&o.fix)o.at=ov.at;
    }
    if(o.fix&&!o.at)o.fix=false;
    out.push(o);
  }
  /* если пары пропущены — вместо них практика */
  var skippedPair=out.some(function(o){return o.dir==='study'&&o.fix&&L.skip.indexOf(o.id)>=0});
  var hasPract=out.some(function(o){return o.title.indexOf('Практика')===0});
  if(skippedPair&&!hasPract&&L.skip.indexOf('v-pract')<0)
  {
    var pr=out.filter(function(o){return o.dir==='study'&&L.skip.indexOf(o.id)>=0})[0];
    var pv={id:'v-pract',title:'Практика по дистанту вместо пар',dir:'study',min:90,fix:false,at:null,
            ord:(pr&&pr.at?t2m(pr.at):480),with:[],note:'Пары пропущены, задачи всё равно нужны',virt:true};
    var ovp=L.ovr['v-pract'];
    if(ovp){ if(ovp.min)pv.min=ovp.min; if(ovp.fixDay&&ovp.at){pv.fix=true;pv.at=ovp.at} }
    out.push(pv);
  }
  return out;
}

/* ======== расчёт дня ========
   Порядок задаёт человек, время считается само.
   Дела с меткой времени стоят на своём часе; остальные идут подряд и обходят метки. */
function spanMin(at,to){
  if(!at||!to)return 0;
  var a=t2m(at),m=t2m(to)-a;
  if(m<=0){ if(a>=20*60&&m+1440<=5*60)m+=1440; else return 0; }
  return Math.min(1435,m);
}
function endT(at,min){return m2t((t2m(at)+(+min||0))%1440)}
/* место задачи в порядке дня: разовая перестановка этого дня важнее общей */
function ordKey(L,o){
  if(L&&L.ord&&typeof L.ord[o.id]==='number')return L.ord[o.id];
  return (typeof o.ord==='number')?o.ord:500;
}
/* дела, идущие одновременно, собираются в один блок */
function dayGroups(d){
  var L=logOf(d),items=instances(d);
  items.forEach(function(o){
    o.skipped=L.skip.indexOf(o.id)>=0;
    o.doneMin=L.done[o.id]||0;
    o.done=!o.skipped&&o.doneMin>=o.min-1;
    o.key=ordKey(L,o);
    o.s=dayStart();o.e=dayStart();
  });
  var act=items.filter(function(x){return !x.skipped}),byId={},adj={},k;
  act.forEach(function(o){byId[o.id]=o;adj[o.id]={}});
  act.forEach(function(o){(o.with||[]).forEach(function(w){
    if(byId[w]&&w!==o.id){adj[o.id][w]=1;adj[w][o.id]=1}})});
  var seen={},groups=[];
  act.forEach(function(o){
    if(seen[o.id])return;
    seen[o.id]=1;
    var st=[o.id],mem=[];
    while(st.length){var c=st.pop();mem.push(byId[c]);for(k in adj[c])if(!seen[k]){seen[k]=1;st.push(k)}}
    mem.sort(function(x,y){return (y.min-x.min)||(x.key-y.key)||((x.title<y.title)?-1:1)});
    var fx=mem.filter(function(x){return x.fix&&x.at}).sort(function(x,y){return t2m(x.at)-t2m(y.at)})[0];
    var len=0,key=1e9;
    mem.forEach(function(x){if(x.min>len)len=x.min;if(x.key<key)key=x.key});
    groups.push({ids:mem.map(function(x){return x.id}),mem:mem,lead:fx||mem[0],
                 len:len,key:key,fix:!!fx,at:fx?fx.at:null,dir:(fx||mem[0]).dir});
  });
  return {L:L,items:items,groups:groups};
}
/* раскладка: метки на своих местах, остальное подряд от подъёма */
function layDay(groups){
  var start=dayStart(),guard;
  var anc=groups.filter(function(g){return g.fix}).sort(function(a,b){return t2m(a.at)-t2m(b.at)});
  var flo=groups.filter(function(g){return !g.fix}).sort(function(a,b){return (a.key-b.key)||((a.lead.title<b.lead.title)?-1:1)});
  anc.forEach(function(g){g.s=t2m(g.at);g.e=g.s+g.len});
  var cur=start,ai=0;
  flo.forEach(function(g,i){
    g.num=i+1;
    while(ai<anc.length&&anc[ai].e<=cur)ai++;
    guard=0;
    while(ai<anc.length&&cur+g.len>anc[ai].s&&guard++<80){
      if(anc[ai].e>cur)cur=anc[ai].e;
      ai++;
      while(ai<anc.length&&anc[ai].e<=cur)ai++;
    }
    g.s=cur;g.e=cur+g.len;cur=g.e;
  });
  return {anchors:anc,floats:flo};
}
function planDay(d){
  var G=dayGroups(d),L=G.L,items=G.items,groups=G.groups,i,j;
  var lay=layDay(groups),anc=lay.anchors,flo=lay.floats;
  groups.forEach(function(g){
    g.mem.forEach(function(x){
      x.s=g.s;x.e=g.s+x.min;x.gEnd=g.e;x.num=g.num||0;x.fixG=g.fix;
      x.parallel=(g.mem.length>1&&x!==g.lead);
      if(g.mem.length>1){
        x.hostId=g.lead.id;x.hostTitle=g.lead.title;
        if(x===g.lead)x.withT=g.mem.filter(function(y){return y!==g.lead}).map(function(y){return y.title});
      }
    });
  });
  /* накладка возможна только между двумя метками времени */
  var clash=[];
  for(i=0;i<anc.length;i++)for(j=i+1;j<anc.length;j++){
    if(anc[j].s>=anc[i].e)break;
    anc[i].mem.forEach(function(x){x.clash=true});
    anc[j].mem.forEach(function(x){x.clash=true});
    clash.push([anc[i].lead,anc[j].lead]);
  }
  items.sort(function(a,b){return (a.s-b.s)||(a.skipped?1:0)-(b.skipped?1:0)||(b.min-a.min)||(a.title<b.title?-1:1)});
  var start=dayStart(),end=dayEnd(),sleepM=t2m(S.settings.sleep); if(sleepM<=start)sleepM+=1440;
  var merged=[],breaks=[],occupied=0,gapMax=0;
  groups.slice().sort(function(a,b){return a.s-b.s}).forEach(function(g){
    var last=merged[merged.length-1];
    if(last&&g.s<=last.e)last.e=Math.max(last.e,g.e); else merged.push({s:g.s,e:g.e});
  });
  merged.forEach(function(m){occupied+=m.e-m.s});
  for(i=1;i<merged.length;i++){
    var gp=merged[i].s-merged[i-1].e;
    if(gp>0){breaks.push({s:merged[i-1].e,e:merged[i].s,len:gp});if(gp>gapMax)gapMax=gp}
  }
  var planned=0,done=0,byDir={},endAt=start,late=0;
  groups.forEach(function(g){
    if(g.e>endAt)endAt=g.e;
    g.mem.forEach(function(x){
      planned+=x.min; done+=Math.min(x.doneMin,x.min);
      byDir[x.dir]=(byDir[x.dir]||0)+x.min;
      if(x.e>sleepM){x.late=true;late++}
    });
  });
  var winMin=Math.max(0,end-start);
  return {items:items,groups:groups,anchors:anc,floats:flo,over:[],breaks:breaks,
          planned:planned,done:done,byDir:byDir,clash:clash,occupied:occupied,cut:[],
          ratio:planned?Math.min(1,done/planned):0,endAt:endAt,
          winMin:winMin,freeMin:Math.max(0,winMin-occupied),gapMax:gapMax,overMin:0,late:late};
}

/* ---- оценка дня, серия, уровни ---- */
function dayCounted(d){
  var L=S.log[d]; if(!L)return false;

}
function streak(){
  var n=0,d=todayIso(),c=dayCounted(d),guard=0;
  if(c===true)n++;
  d=addD(d,-1);
  while(guard++<400){
    var r=dayCounted(d);
    if(r===true)n++;
    else if(r===null){} else break;
    d=addD(d,-1);
  }
  return n;
}
function totalMin(from,to){
  var s=0;
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var o=S.log[d].done||{};
    for(var k in o)s+=o[k];
  }
  return s;
}
function minByDir(from,to){
  var r={};
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var mp={}; instances(d).forEach(function(o){mp[o.id]=o.dir});
    var o=S.log[d].done||{};
    for(var k in o){var dir=mp[k]||findDir(k);if(!dir)continue;r[dir]=(r[dir]||0)+o[k]}
  }

}

  return {name:cur[1],h:h,next:next,from:cur[0]};
}

/* ---------------- ЗАДАЧИ ---------------- */
function repText(t){
  if(t.date)return 'один раз, '+dateShort(t.date);
  var dd=(S.settings.mode==='A'&&t.daysA)?t.daysA:t.days;
  if(!dd||!dd.length)return 'без дней';
  if(dd.length===7)return 'каждый день'+(t.weeks==='odd'?', нечётные недели':(t.weeks==='even'?', чётные недели':''));
  var s=dd.map(function(n){return WDS[n-1]}).join(' ');
  if(t.weeks==='odd')s+=' · нечётные недели';
  if(t.weeks==='even')s+=' · чётные недели';
  return s;
}
/* «1 ч 30 мин» или «в 09:00 до 10:30» для режима, который открыт сейчас */
function tSpan(t){
  var mA=S.settings.mode==='A';
  var at=(mA&&t.atA)?t.atA:(t.at||''), mn=(mA&&typeof t.minA==='number')?t.minA:t.min;
  if(!mn)return 'в этом режиме нет';
  if(!t.fix||!at)return hm(mn);
  return 'в '+at+' до '+endT(at,mn);
}

var MSHORT={job:'Работа',site:'Сайты',other:'Другое'};
var MKEYS=['job','site','other'];
function rub(v){return (+v||0).toLocaleString('ru-RU')+' ₽'}
/* весь доход одной таблицей: журнал заработка плюс оплаченные клиенты */
function moneyRows(){
  var r=S.income.map(function(x){return {id:x.id,title:x.title,kind:x.kind||'job',sum:+x.sum||0,date:x.date||'',hours:+x.hours||0,src:'m'}});
  S.clients.forEach(function(c){
    if(c.stage===4&&+c.sum)r.push({id:c.id,title:c.name,kind:'site',sum:+c.sum,date:c.paidAt||'',hours:0,src:'c'});
  });
  return r.sort(function(a,b){return a.date<b.date?1:-1});
}
function moneySum(kind,from){
  return moneyRows().reduce(function(a,x){
    if(kind&&x.kind!==kind)return a;
    if(from&&(x.date||'').slice(0,from.length)!==from)return a;
    return a+x.sum;
  },0);
}

/* сводка по всей истории, одним проходом */
function achStats(){
  var r={days:0,big:0,huge:0,full:0,gym:0,drive:0,early:0,best:0,streakBest:(S.streak&&S.streak.best)||0,dir:{}};
  var ttl={};S.tasks.forEach(function(t){ttl[t.id]=t.title||''});
  for(var d in S.log){
    var done=S.log[d].done||{},sum=0,byd={},k,dir;
    for(k in done){
      sum+=done[k];dir=findDir(k);
      if(dir)byd[dir]=(byd[dir]||0)+done[k];
      if((ttl[k]||'').indexOf('Вождение')===0&&done[k]>=60)r.drive++;
    }
    if(!sum)continue;
    r.days++;
    if(sum>=480)r.big++;
    if(sum>=600)r.huge++;
    if((byd.body||0)>=60)r.gym++;
    r.best=Math.max(r.best,sum);
    for(k in byd)r.dir[k]=(r.dir[k]||0)+byd[k];
    var p=planDay(d);
    if(p.planned&&p.done>=p.planned-1)r.full++;
  }
  return r;
}

  var k=e.target.id||'';

  if(m[2]==='slide')hintTime(m[1]); else hintMin(m[1]);
});
var LOCKY=0;
/* сколько времени занимает дело */
function hintMin(p){
  var el=document.getElementById(p+'_min'),out=document.getElementById(p+'_dur');
  if(!el||!out)return;
  var v=parseInt(el.value,10);
  if(isNaN(v)||v<0)v=0;
  out.textContent=v?hm(v):(p==='f'?'ноль, дела нет в этом режиме':'не задано');
  var e2=document.getElementById(p+'_endn');
  if(e2){var sl=document.getElementById(p+'_slide');e2.textContent=sl?(' до '+m2t((+sl.value+v)%1440)):''}
}
/* крупная цифра над ползунком времени */
function hintTime(p){
  var sl=document.getElementById(p+'_slide'),out=document.getElementById(p+'_time');
  if(!sl||!out)return;
  out.textContent=m2t(+sl.value);
  hintMin(p);
}

function closeSheet(){
  if(!SH.classList.contains('open'))return;
  SH.classList.remove('open');document.body.classList.remove('lock');document.body.style.top='';
  window.scrollTo(0,LOCKY);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SH.classList.contains('open')){closeSheet();return}
  if(e.key==='Enter'&&SH.classList.contains('open')&&e.target.tagName==='INPUT'&&e.target.type!=='date'&&e.target.type!=='time'){
    var pri=SB.querySelector('.btn.pri');if(pri){e.preventDefault();pri.click()}
  }
});
(function(){
  var sy=null,cx=null;
  SH.addEventListener('touchstart',function(e){
    if(!e.target.closest('.shbar'))return;
    cx=SH.querySelector('.cardx');sy=e.touches[0].clientY;cx.style.transition='none';
  },{passive:true});
  SH.addEventListener('touchmove',function(e){
    if(sy===null)return;var dy=e.touches[0].clientY-sy;
    if(dy>0)cx.style.transform='translateY('+dy+'px)';
  },{passive:true});
  SH.addEventListener('touchend',function(){
    if(sy===null)return;
    var m=/translateY\(([\d.]+)px\)/.exec(cx.style.transform||'');
    cx.style.transition='';cx.style.transform='';
    if(m&&parseFloat(m[1])>90)closeSheet();
    sy=null;
  });
})();

/* двухшаговое подтверждение прямо в кнопке, без системных окон */
function armed(el,ask){
  if(el.dataset.arm==='1')return true;
  var old=el.textContent;el.dataset.arm='1';el.textContent=ask;el.classList.add('danger');
  clearTimeout(el._a);el._a=setTimeout(function(){el.dataset.arm='';el.textContent=old;},4000);
  return false;
}
var SCROLLS={};
function render(to){
  var y=document.body.classList.contains('lock')?LOCKY:window.scrollY,v=S.ui.view;
  if(v==='day')viewDay();else if(v==='week')viewWeek();else if(v==='tasks')viewTasks();
  else if(v==='flow')viewFlow();else if(v==='stat')viewStat();else viewSet();
  renderTabs();tickClock();
  var t=(to===true)?0:(typeof to==='number'?to:y);
  if(document.body.classList.contains('lock'))LOCKY=t; else window.scrollTo(0,t);
}
function go(v){if(S.ui.view!==v)SCROLLS[S.ui.view]=window.scrollY;S.ui.view=v;save();render(SCROLLS[v]||0)}

/* ======== перетаскивание блоков: палец, мышь, трекпад ========
   Правила взяты из планировщиков, где это сделано хорошо:
   1) блок встаёт туда, куда его отпустили; 2) блоки с точным временем не двигаются;
   3) соседи расходятся только настолько, насколько нужно; 4) вернул на место значит ничего не изменилось;
   5) то, что перестало помещаться, не пропадает, а уходит в «не помещается в день». */
var DRG=null;
function dragRows(){
  var V2=document.getElementById('view');
  return [].slice.call(V2.querySelectorAll('.item[data-row][data-mv="1"]'));
}
function dragEnd(){
  if(DRG&&DRG.row)DRG.row.classList.remove('drag');
  if(DRG&&DRG.sc)clearInterval(DRG.sc);
  document.body.classList.remove('dragging');
  var g=document.getElementById('dragghost'); if(g)g.parentNode.removeChild(g);
  var hl=document.querySelector('.item.dropon'); if(hl)hl.classList.remove('dropon');
  DRG=null;
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest?e.target.closest('[data-act="grab"]'):null;
  if(!g||DRG)return;
  var row=document.querySelector('.item[data-row="'+g.dataset.id+'"]');
  if(!row)return;
  e.preventDefault();
  DRG={id:g.dataset.id,row:row,scope:(row.dataset.scope||'day'),
       y0:(typeof e.clientY==='number'?e.clientY:0),on:false,before:undefined};
},{passive:false});
document.addEventListener('pointermove',function(e){
  if(!DRG||typeof e.clientY!=='number')return;
  if(!DRG.on){
    if(Math.abs(e.clientY-DRG.y0)<5)return;
    DRG.on=true;
    DRG.row.classList.add('drag');
    document.body.classList.add('dragging');
    var gh=document.createElement('div');
    gh.id='dragghost';gh.className='ghostrow';
    var ttl=DRG.row.querySelector('.ttl span');
    gh.innerHTML='<i style="background:'+(DRG.row.style.getPropertyValue('--c')||'#C2A170')+'"></i>'+(ttl?ttl.textContent:'Блок');
    document.body.appendChild(gh);
    DRG.sc=setInterval(function(){
      if(!DRG||DRG.cy==null)return;
      var H=window.innerHeight||700;
      if(DRG.cy<110)window.scrollBy(0,-14);
      else if(DRG.cy>H-110)window.scrollBy(0,14);
    },40);
  }
  e.preventDefault();
  DRG.cy=e.clientY;
  var gh2=document.getElementById('dragghost');
  if(gh2){gh2.style.left=Math.max(8,(e.clientX||40)-30)+'px';gh2.style.top=(e.clientY-22)+'px'}
  var rows=dragRows(),i,tgt=null;
  for(i=0;i<rows.length;i++){
    var b=rows[i].getBoundingClientRect();
    if(e.clientY>=b.top&&e.clientY<=b.bottom&&rows[i].getAttribute('data-row')!==DRG.id){tgt=rows[i];break}
  }
  DRG.onto=tgt?tgt.getAttribute('data-row'):null;
  var prev=document.querySelector('.item.dropon');
  if(prev&&prev!==tgt)prev.classList.remove('dropon');
  if(tgt)tgt.classList.add('dropon');
  var gh3=document.getElementById('dragghost');
  if(gh3)gh3.classList.toggle('ok',!!tgt);
},{passive:false});
['pointerup','pointercancel'].forEach(function(ev){
  document.addEventListener(ev,function(e){
    if(!DRG)return;
    var id=DRG.id,onto=DRG.onto,moved=DRG.on,scope=DRG.scope;
    dragEnd();
    if(!moved||!onto||onto===id)return;      /* отпустили мимо или там же, где взяли */
    if(scope==='tasks'){
      var snpT2=JSON.stringify(S.tasks);
      if(!moveInTasks(id,onto))return;
      save(); render();
      toast(shortName((byTask(id)||{}).title||'Дело')+' теперь раньше в общем порядке',
        function(){S.tasks=JSON.parse(snpT2);save();render()});
      return;
    }
    var d=S.ui.date,snp=snapDay(d);
    var gsD=ordBlocks(d),fiD=findBlock(gsD,id),tiD=findBlock(gsD,onto);
    if(fiD<0||tiD<0)return;
    if(!moveInDay(d,id,onto,fiD<tiD))return;
    save(); render();
    toast(placeMsg(d,id),function(){restoreDay(d,snp)});
  });
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-pick]');if(!el)return;
  var id=el.dataset.id,v=el.dataset.v,d=S.ui.date,L;
  if(el.dataset.pick){
    var p=el.dataset.pick;
    if(p==='dir'){TMP.dir=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='weeks'){TMP.weeks=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='stage'){TMP.stage=+v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===+v)})}
    if(p==='day'){var n=+v,i=TMP.days.indexOf(n);if(i<0)TMP.days.push(n);else TMP.days.splice(i,1);el.classList.toggle('on')}
    if(p==='rep'){
      TMP.rep=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
      var wd=document.getElementById('f_wdays'),wo=document.getElementById('f_wonce'),dt=document.getElementById('f_date');
      if(wd)wd.style.display=(v==='days')?'':'none';
      if(wo)wo.style.display=(v==='once')?'':'none';
      if(v==='daily'){TMP.days=[1,2,3,4,5,6,7];if(dt)dt.value='';
        document.querySelectorAll('#f_days button').forEach(function(b){b.classList.add('on')})}
      if(v==='days'&&dt)dt.value='';
      if(v==='once'&&dt&&!dt.value)dt.value=S.ui.date;
    }
    if(p==='core'){TMP.core=!TMP.core;el.classList.toggle('on')}
    if(p==='tactive'){TMP.tactive=!TMP.tactive;el.classList.toggle('on')}
    if(p==='fix'){
      var pf=el.dataset.p||'f',box=document.getElementById(pf+'_fixbox');
      el.classList.toggle('on');
      if(box)box.style.display=el.classList.contains('on')?'':'none';
      hintTime(pf);
    }
    if(p==='dmin'){
      var pd=el.dataset.p||'f',inp=document.getElementById(pd+'_min');
      if(inp)inp.value=v;
      el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
      hintMin(pd);
    }
    if(p==='with'){
      TMP.with=TMP.with||[];
      var wi=TMP.with.indexOf(v);
      if(wi<0)TMP.with.push(v); else TMP.with.splice(wi,1);
      el.classList.toggle('on');
      var pmEl=el.querySelector('.pm');
      if(pmEl)pmEl.textContent=el.classList.contains('on')?'вместе':'добавить';
    }
    if(p==='kind'){TMP.kind=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='qdone'){TMP.qdone=!TMP.qdone;el.classList.toggle('on')}
    if(p==='pmin'){
      var pi=document.getElementById('p_min');

/* снимок дня для кнопки «Вернуть» в подсказке */
/* ===== работа со временем блоков ===== */
/* строки дня сверху вниз: всё, что можно двигать */
function dayRows(d){
  return planDay(d).floats.slice().sort(function(a,b){return a.s-b.s}).map(function(g){return g.lead.id});
}
/* блоки без метки времени, в том порядке, в каком они идут сейчас */
function ordBlocks(d){
  return planDay(d).floats.slice().sort(function(a,b){return a.s-b.s});
}
function writeOrd(d,gs){
  var L=logOf(d); L.ord=L.ord||{};
  gs.forEach(function(g,i){g.ids.forEach(function(id){L.ord[id]=(i+1)*10})});
}
function findBlock(gs,id){
  for(var i=0;i<gs.length;i++)if(gs[i].ids.indexOf(id)>=0)return i;
  return -1;
}
/* перетащили одно дело на другое: встаёт перед ним или после него */
function moveInDay(d,id,ontoId,after){
  var gs=ordBlocks(d),fi=findBlock(gs,id),ti=findBlock(gs,ontoId);
  if(fi<0||ti<0||fi===ti)return false;
  var g=gs.splice(fi,1)[0];
  if(fi<ti)ti--;
  gs.splice(after?ti+1:ti,0,g);
  writeOrd(d,gs);
  return true;
}
/* на шаг выше или ниже */
function stepInDay(d,id,dir){
  var gs=ordBlocks(d),fi=findBlock(gs,id);
  if(fi<0)return 0;
  var ni=fi+dir;
  if(ni<0||ni>=gs.length)return 0;
  var g=gs.splice(fi,1)[0];
  gs.splice(ni,0,g);
  writeOrd(d,gs);
  return 1;
}
/* в начало или в конец дня */
function edgeInDay(d,id,top){
  var gs=ordBlocks(d),fi=findBlock(gs,id);
  if(fi<0)return false;
  if(top&&fi===0)return false;
  if(!top&&fi===gs.length-1)return false;
  var g=gs.splice(fi,1)[0];
  if(top)gs.unshift(g); else gs.push(g);
  writeOrd(d,gs);
  return true;
}
/* поставить дело сразу после другого, не трогая остальных */
function putAfter(d,id,afterId){
  var gs=ordBlocks(d),fi=findBlock(gs,id);
  if(fi<0)return false;
  var g=gs.splice(fi,1)[0];
  var ti=afterId?findBlock(gs,afterId):-1;
  gs.splice(ti<0?gs.length:ti+1,0,g);
  writeOrd(d,gs);
  return true;
}
/* место в списке дня: номер и сосед сверху */
function placeMsg(d,id){
  var gs=ordBlocks(d),i=findBlock(gs,id);
  if(i<0)return 'Готово';
  var nm=shortName((gs[i].lead||{}).title||'Дело');
  if(i===0)return nm+' теперь первым в дне';
  var prev=shortName((gs[i-1].lead||{}).title||'',14);
  return nm+' теперь '+(i+1)+'-м, после «'+prev+'»';
}
/* что сказать человеку после перестановки */
function moveMsg(d,id,was){return placeMsg(d,id)}
/* «Поставил в день, 1 ч» */
function spanMsg(d,id,pre){
  var o=planDay(d).items.filter(function(x){return x.id===id})[0];
  if(!o)return pre;
  return pre+(o.fixG?(' в '+m2t(o.s)):'')+', '+hm(o.min);
}
function startOf(d,id){var o=planDay(d).items.filter(function(x){return x.id===id})[0];return o?o.s:null}
function byTask(id){return S.tasks.filter(function(x){return x.id===id})[0]}
/* общий порядок: так дела идут в любом дне, пока их не переставили внутри дня */
function ordTasks(){
  return S.tasks.filter(function(t){return t.active&&!t.fix&&!t.date})
    .sort(function(a,b){return ((a.ord||500)-(b.ord||500))||((a.title<b.title)?-1:1)});
}
function moveInTasks(id,onto){
  var ls=ordTasks(),fi=-1,ti=-1,i;
  for(i=0;i<ls.length;i++){if(ls[i].id===id)fi=i;if(ls[i].id===onto)ti=i}
  if(fi<0||ti<0||fi===ti)return false;
  var t=ls.splice(fi,1)[0];
  ls.splice(ti,0,t);
  ls.forEach(function(x,i2){x.ord=110+i2*10});
  return true;
}
/* связь «идём одновременно» всегда обоюдная */
function linkTasks(a,b,on){
  if(!a||!b||a===b)return;
  a.with=a.with||[]; b.with=b.with||[];
  if(on){ if(a.with.indexOf(b.id)<0)a.with.push(b.id); if(b.with.indexOf(a.id)<0)b.with.push(a.id) }
  else{ a.with=a.with.filter(function(x){return x!==b.id}); b.with=b.with.filter(function(x){return x!==a.id}) }
}
function setWith(t,ids){
  (t.with||[]).slice().forEach(function(w){if(ids.indexOf(w)<0)linkTasks(t,byTask(w),false)});
  ids.forEach(function(w){linkTasks(t,byTask(w),true)});
}
function withNames(t,n){
  return (t.with||[]).map(function(w){var o=byTask(w);return o?shortName(o.title,n||14).toLowerCase():''})
                     .filter(function(x){return x}).join(', ');
}
function snapDay(d){return JSON.stringify({l:S.log[d]||null,t:S.tasks})}
function restoreDay(d,snap){
  var o=JSON.parse(snap);
  S.tasks=o.t; if(o.l)S.log[d]=o.l; else delete S.log[d];
  save(); render();
}
/* убрать блок из дня: разовую задачу удаляем совсем, шаблонную прячем на этот день */
function dropFromDay(id,d){
  var L=logOf(d),t=S.tasks.filter(function(x){return x.id===id})[0];
  var ai=L.add.indexOf(id); if(ai>=0)L.add.splice(ai,1);
  delete L.ovr[id]; delete L.done[id];
  if(t&&t.date===d){S.tasks=S.tasks.filter(function(x){return x.id!==id});return 'del'}
  if(L.skip.indexOf(id)<0)L.skip.push(id);
  return 'skip';
}
/* поставить готовую задачу в день, в том числе второй раз за день */
var LASTPUT=null;
function putInDay(tid,d){
  var L=logOf(d),t=S.tasks.filter(function(x){return x.id===tid})[0];
  LASTPUT=tid;
  if(!t)return null;
  var si=L.skip.indexOf(tid);
  if(si>=0){L.skip.splice(si,1);return 'back'}
  var mode=S.settings.mode,mn=(mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
  var here=instances(d).some(function(x){return x.id===tid});
  if(!here&&mn>0&&!t.date){ if(L.add.indexOf(tid)<0)L.add.push(tid); return 'add' }
  /* повтор того же дела или задача, у которой в этом режиме ноль минут: ставим копию на день */
  if(!mn)mn=t.min||t.minA||30;
  var c=T({title:t.title,dir:t.dir,min:mn,ord:(t.ord||500)+1,fix:false,days:[],date:d,core:false,
           note:t.note||''});
  S.tasks.push(c);
  LASTPUT=c.id;
  return 'copy';
}
/* что можно делать одновременно с этим блоком */
function sheetWith(id){
  var d=S.ui.date,p=planDay(d),host=p.items.filter(function(x){return x.id===id})[0];
  var ht=byTask(id);
  if(!host||!ht)return;
  var hDays=(S.settings.mode==='A'&&ht.daysA)?ht.daysA:(ht.days||[]);
  var sel=(ht.with||[]);
  var cand=S.tasks.filter(function(t){return t.active&&t.id!==id&&!t.date});
  cand.sort(function(a,b){return (sel.indexOf(b.id)>=0?1:0)-(sel.indexOf(a.id)>=0?1:0)||((a.title<b.title)?-1:1)});
  var h='<h3>Вместе с «'+esc(shortName(host.title,24))+'»</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-9px 0 13px">Отмеченные дела идут в то же время и накладкой не считаются. '+
    'Например, в зале можно слушать ПДД и разбирать Инстаграм сразу. Отмечать можно сколько угодно дел. '+
    'В дни, когда этого блока нет, отмеченное дело идёт своим чередом.</div>';
  if(!cand.length)h+='<div class="dim" style="padding:2px 2px 12px;font-size:13px">Других задач пока нет.</div>';
  else h+='<div class="picklist">'+cand.map(function(t){
      var on=sel.indexOf(t.id)>=0;
      var tDays=(S.settings.mode==='A'&&t.daysA)?t.daysA:(t.days||[]);
      var common=tDays.filter(function(x){return hDays.indexOf(x)>=0});
      var sub=on?('идёт вместе, '+tSpan(t)):(common.length?('общих дней '+common.length+' · '+tSpan(t)):'дни не совпадают · '+tSpan(t));
      return '<button class="pickrow'+(on?' on':'')+'" data-act="withTog" data-id="'+id+'" data-v="'+t.id+'">'+
        '<i style="background:'+DIRS[t.dir].c+'"></i>'+
        '<span class="pn">'+esc(t.title)+'<i class="sub'+(!on&&!common.length?' warn':'')+'">'+sub+'</i></span>'+
        '<span class="pm">'+(on?'вместе':'добавить')+'</span></button>';
    }).join('')+'</div>';
  h+='<div class="row-btns" style="margin-top:14px">'+
     (sel.length?'<button class="btn" data-act="unpair" data-id="'+id+'">Отцепить все</button>':'')+
     '<button class="btn ghost" data-act="closeSheet">Готово</button></div>';
  openSheet(h);
}
function sheetPick(rep){
  var d=S.ui.date,p=planDay(d);
  var inDay={};
  p.items.forEach(function(x){if(!x.skipped)inDay[x.id]=x});
  var rt=rep?p.items.filter(function(x){return x.id===rep})[0]:null;
  var cand=S.tasks.filter(function(t){return t.active&&!t.date&&t.id!==rep});
  cand.sort(function(a,b){return (DKEYS.indexOf(a.dir)-DKEYS.indexOf(b.dir))||((a.title<b.title)?-1:1)});
  var h='<h3>'+(rt?'Чем заменить':'Что поставить в день')+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-9px 0 13px">'+
      (rt?'Встанет на место дела «'+esc(shortName(rt.title,22))+'», только на '+dateShort(d)+'. Расписание задачи не меняется.'
         :'Задача встанет только в '+dateShort(d)+', в конец списка. Поднять её выше можно перетаскиванием.')+'</div>';
  if(!cand.length)h+='<div class="dim" style="padding:2px 2px 12px;font-size:13px">Готовых задач нет. Создайте разовую.</div>';
  else h+='<div class="picklist">'+cand.map(function(t){
      var mn=(S.settings.mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
      if(!mn)mn=t.min||t.minA||30;
      var st=inDay[t.id];
      var sub=t.fix?('метка времени '+((S.settings.mode==='A'&&t.atA)?t.atA:t.at)):(rt?'встанет на место прежнего дела':'встанет в конец дня');
      if(st)sub='уже в плане'+(st.fixG?(' на '+m2t(st.s)):(' под номером '+(st.num||1)))+' · поставлю ещё раз';
      return '<button class="pickrow" data-act="pickTask" data-id="'+t.id+'" data-v="'+(rep||'')+'">'+
        '<i style="background:'+DIRS[t.dir].c+'"></i>'+
        '<span class="pn">'+esc(t.title)+'<i class="sub">'+sub+'</i></span>'+
        '<span class="pm">'+hm(mn)+'</span></button>';
    }).join('')+'</div>';
  h+='<div class="row-btns" style="margin-top:14px">'+
     (rt?'<button class="btn" data-act="skip" data-id="'+rep+'">Просто убрать блок</button>':'')+
     '<button class="btn" data-act="addToday">Создать разовую</button>'+
     '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>';
  openSheet(h);
}
function sheetPart(id){
  var d=S.ui.date,p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return;
  var left=Math.max(5,o.min-(o.doneMin||0)),base=[15,30,45,60,90];
  if(base.indexOf(left)<0)base.push(left);base.sort(function(a,b){return a-b});
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Записано '+hm(o.doneMin||0)+' из '+hm(o.min)+'. Блок закроется сам, когда наберётся полностью.</div>'+
    '<div class="mins">'+base.map(function(x){return '<button data-pick="pmin" data-v="'+x+'">'+hm(x)+'</button>'}).join('')+'</div>'+
    '<div class="f"><label>Минут</label><input type="number" inputmode="numeric" id="p_min" value="'+left+'"></div>'+
    '<div class="row-btns"><button class="btn pri" data-act="savePart" data-id="'+id+'">Записать</button>'+
    '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>');
}
function sheetTune(id){
  var d=S.ui.date,p=planDay(d),o=p.items.filter(function(x){return x.id===id})[0];
  if(!o)return;
  TMP={};
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Меняется только '+dateShort(d)+', сама задача остаётся прежней.</div>'+
    minField('t',o.min,[20,30,45,60,90,120,180])+
    timeField('t',!!o.fixG,o.at||m2t(o.s),'Поставить это дело на конкретный час только сегодня')+
    '<div class="row-btns" style="margin-top:6px"><button class="btn pri" data-act="saveTune" data-id="'+id+'">Сохранить</button>'+
    '<button class="btn" data-act="resetTune" data-id="'+id+'">Вернуть как в задаче</button></div>');
}
/* тикер таймера */
function tickClock(){
  var el=document.getElementById('runclock');
  if(el&&S.ui.timer)el.textContent=' · идёт '+hm(Math.max(1,Math.round((Date.now()-S.ui.timer.t0)/60000)));
}
setInterval(tickClock,20000);
/* смена даты на новый день */
setInterval(function(){
  if(S.ui.view==='day'&&S.ui._d&&S.ui._d!==todayIso()){S.ui._d=todayIso();S.ui.date=todayIso();render(true);S.ui._d=todayIso();return}
  S.ui._d=todayIso();
  if(S.ui.view==='day'&&S.ui.date===todayIso()&&!SH.classList.contains('open'))render();
},60000);
render();
</script>
</body>
</html>
