<style>
:root{
  --bg:#0B0B0C; --panel:#111113; --panel2:#17171A; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.055);
  --fg:#ECEAE7; --dim:#8A8A90; --dim2:#5C5C64; --acc:#C2A170; --accSoft:rgba(194,161,112,.13);
  --ok:#86A98C; --warn:#C98F86; --r:18px; --rs:12px;
  --android:#7FB7A3; --sites:#C2A170; --pdd:#8FA2C8; --content:#C98F86; --study:#9D93B8; --body:#A9B08E; --life:#8A8A90;
}
html[data-theme="light"]{
  --bg:#F3F1EC; --panel:#FFFFFF; --panel2:#FAF8F4; --line:rgba(18,21,28,.11); --line2:rgba(18,21,28,.07);
  --fg:#12151C; --dim:#6E747E; --dim2:#A2A7AE; --acc:#A96410; --accSoft:rgba(169,100,16,.10);
  --ok:#4F7A57; --warn:#A8584C;
  --android:#2F7F67; --sites:#A96410; --pdd:#44618F; --content:#A05A50; --study:#5F5485; --body:#5E6B3C; --life:#6E747E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.mono{font-variant-numeric:tabular-nums}
.lab{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim2);font-weight:500}
.dim{color:var(--dim)}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top)}
.top-in{max-width:860px;margin:0 auto;padding:13px 18px;display:flex;align-items:center;gap:12px}
.brand{font-size:14.5px;letter-spacing:.01em;font-weight:500;white-space:nowrap}
.brand b{font-weight:600}
.brand span{color:var(--acc)}
.top-sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:11.5px;color:var(--dim);background:var(--panel);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.chip.acc{border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--acc);background:var(--accSoft)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);background:var(--panel)}
.iconbtn:hover{color:var(--fg)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line2);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim2);font-size:10px;letter-spacing:.04em;padding:4px 0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on svg{stroke:var(--acc)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px 17px;margin:14px 0}
.card.pad0{padding:0;overflow:hidden}
.h1{font-size:25px;font-weight:300;letter-spacing:-.015em;margin:22px 0 2px}
.h1 em{font-style:normal;color:var(--dim)}
.h2{font-size:12.5px;font-weight:500;letter-spacing:.02em;margin:0 0 10px}
.sect{margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.sect .line{flex:1;height:1px;background:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  border-radius:11px;padding:10px 14px;font-size:13.5px;color:var(--fg);background:var(--panel);transition:.15s}
.btn:hover{border-color:var(--dim2)}
.btn.pri{background:var(--acc);color:#0B0B0C;border-color:var(--acc);font-weight:500}
html[data-theme="light"] .btn.pri{color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- day ---------- */
.dayhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.datenav{display:flex;gap:6px;align-items:center}
.load{display:flex;gap:2px;height:6px;border-radius:4px;overflow:hidden;background:var(--line2);margin:14px 0 9px}
.load i{display:block;height:100%}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}

.tl{margin:4px -4px}
.item{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line2);position:relative}
.item:last-child{border-bottom:0}
.item .time{width:52px;flex:0 0 52px;font-size:12.5px;color:var(--dim);padding-top:2px;line-height:1.35}
.item .time s{display:block;text-decoration:none;color:var(--dim2);font-size:11px}
.item .bar{width:2px;border-radius:2px;background:var(--c,var(--acc));opacity:.75;flex:0 0 2px}
.item .mid{flex:1;min-width:0}
.item .ttl{font-size:14.5px;line-height:1.35;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .meta{font-size:11.5px;color:var(--dim);margin-top:3px}
.item .note{font-size:11.5px;color:var(--dim2);margin-top:3px;font-style:italic}
.item .acts{display:flex;align-items:flex-start;gap:4px;padding-top:1px}
.item.done .ttl{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.item.done .bar{opacity:.3}
.item.over{opacity:.75}
.chk{width:22px;height:22px;border-radius:7px;border:1.4px solid var(--line);flex:0 0 22px;display:grid;place-items:center;margin-top:1px}
.chk svg{width:12px;height:12px;stroke:var(--bg);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.item.done .chk{background:var(--acc);border-color:var(--acc)}
.item.done .chk svg{opacity:1}
.mini{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--dim2);border:1px solid transparent}
.mini:hover{color:var(--fg);border-color:var(--line)}
.mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mini.run{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accSoft)}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--dim2)}
.tag.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.brk{display:flex;align-items:center;gap:10px;padding:3px 4px 3px 68px;font-size:11px;color:var(--dim2)}
.brk .l{flex:1;height:1px;background:var(--line2)}
.pbar{height:3px;background:var(--line2);border-radius:3px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--acc));opacity:.8}

/* rings */
.ring{position:relative;width:74px;height:74px;flex:0 0 74px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--acc);transition:stroke-dasharray .4s}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:400}
.statrow{display:flex;gap:16px;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line2);border-radius:var(--rs);overflow:hidden}
@media (min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statgrid div{background:var(--panel);padding:13px 12px}
.statgrid b{display:block;font-size:19px;font-weight:300;margin-top:3px}
.statgrid.p2 div{background:var(--panel2)}

/* week */
.wkday{display:flex;gap:13px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.wkday:last-child{border-bottom:0}
.wkday .d{width:54px;flex:0 0 54px}
.wkday .d b{display:block;font-size:15px;font-weight:400}
.wkday .d s{display:block;text-decoration:none;font-size:11px;color:var(--dim2)}
.wkday .info{flex:1;min-width:0}
.wkday .info .t{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wkday.today{background:var(--accSoft);border-radius:10px;padding-left:9px;padding-right:9px}
.mini-ring{width:34px;height:34px;flex:0 0 34px;position:relative}
.mini-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;color:var(--dim)}
.dots{display:flex;gap:3px;margin-top:5px}
.dots i{width:16px;height:3px;border-radius:2px;background:var(--c);opacity:.85}

/* tasks */
.trow{display:flex;gap:11px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-size:14px}
.trow .mt{font-size:11.5px;color:var(--dim);margin-top:2px}
.trow.off .nm,.trow.off .mt{color:var(--dim2);text-decoration:line-through;text-decoration-color:var(--line)}
.sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);position:relative;flex:0 0 38px;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim2);transition:.18s}
.sw.on{background:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.sw.on i{left:18px;background:var(--acc)}

/* flow */
.stage{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.stage:last-child{border-bottom:0}
.stage .nm{flex:1;min-width:0;font-size:14px}
.stage .st{font-size:11px;color:var(--dim)}
.sbar{display:flex;gap:4px;margin:10px 0 2px}
.sbar div{flex:1;min-width:0;text-align:center;font-size:9.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--dim2);
  padding:7px 1px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar div b{display:block;font-size:15px;color:var(--fg);font-weight:300;margin-top:2px}

/* progress */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line2);position:relative}
.heat i.l1{background:color-mix(in srgb,var(--acc) 22%,var(--line2))}
.heat i.l2{background:color-mix(in srgb,var(--acc) 48%,var(--line2))}
.heat i.l3{background:color-mix(in srgb,var(--acc) 78%,var(--line2))}
.heat i.sh{box-shadow:inset 0 0 0 1.4px var(--pdd)}
.heat i.tdy{box-shadow:inset 0 0 0 1.4px var(--fg)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar2{display:flex;align-items:center;gap:11px;font-size:12.5px}
.bar2 .n{width:76px;flex:0 0 76px;color:var(--dim)}
.bar2 .t{flex:1;height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.bar2 .t i{display:block;height:100%;background:var(--c);opacity:.85}
.bar2 .v{width:84px;flex:0 0 84px;text-align:right;color:var(--dim);font-size:11.5px}
.badge{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line2)}
.badge:last-child{border-bottom:0}
.badge .ic{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--dim2)}
.badge.got .ic{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc);background:var(--accSoft)}
.badge .nm{font-size:13.5px}
.badge.got .nm{color:var(--fg)}
.badge:not(.got) .nm{color:var(--dim)}
.badge .ds{font-size:11.5px;color:var(--dim2)}
.badge .pg{height:3px;border-radius:2px;background:var(--line2);margin-top:6px;max-width:190px;overflow:hidden}
.badge .pg i{display:block;height:100%;background:var(--dim2);border-radius:2px}
.badge .bct{font-size:11px;color:var(--dim2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge .bok{width:18px;height:18px;color:var(--acc);flex:0 0 auto}
.badge .bok svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2}
.mbar{display:flex;gap:1px;margin:12px -14px -14px;background:var(--line2);border-top:1px solid var(--line2)}
.mbar>div{flex:1;background:var(--card);padding:10px 12px;min-width:0}
.mbar span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);line-height:1.3;min-height:26px}
.mbar b{font-size:13.5px;font-weight:400;display:block;margin-top:3px;white-space:nowrap}

/* forms */
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.f>label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--dim);background:var(--panel2)}
.seg button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.days{display:flex;gap:5px}
.days button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--dim);background:var(--panel2)}
.days button.on{color:var(--fg);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.sheet .cardx{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);
  border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
.shbar{position:sticky;top:0;z-index:6;background:var(--panel);margin:-10px -18px 10px;padding:14px 18px 10px;
  display:flex;align-items:center;justify-content:center;border-radius:22px 22px 0 0}
.shclose{position:absolute;right:12px;top:6px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.shclose:active{background:var(--line2);color:var(--fg)}
#sheet .row-btns{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));z-index:5;background:var(--panel);
  margin:16px 0 0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));box-shadow:0 -14px 18px -14px rgba(0,0,0,.45)}
body.lock{position:fixed;left:0;right:0;width:100%;overflow:hidden}
.mins{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mins button{border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13.5px;color:var(--fg);background:var(--panel2)}
.mins button.on{border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--accSoft)}
.nowline{display:flex;align-items:center;gap:9px;margin:7px 0 7px 52px}
.nowline b{font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.nowline i{height:1px;flex:1;background:var(--acc);opacity:.4}
.sheet h3{font-size:17px;font-weight:400;margin:0 0 14px}
.menu button{display:flex;width:100%;gap:11px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line2);font-size:15px;text-align:left}
.menu button:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.toast u{margin-left:13px;color:var(--acc);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer}
.toast.act{pointer-events:auto}
#sheet.open ~ .toast{bottom:calc(50vh - 20px)}

@media (min-width:900px){
  body{padding-bottom:40px;padding-left:216px}
  .top-in,.wrap{max-width:820px}
  .top{padding-left:216px}
  .tabbar{top:0;bottom:auto;left:0;right:auto;width:216px;height:100vh;flex-direction:column;justify-content:flex-start;
    gap:3px;border-top:0;border-right:1px solid var(--line2);padding:78px 14px 20px;background:var(--panel)}
  .tab{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:13.5px;letter-spacing:0;
    padding:11px 12px;border-radius:11px;width:100%}
  .tab.on{background:var(--panel2)}
  .deskbrand{position:fixed;top:0;left:0;width:216px;padding:22px 26px;z-index:50;font-size:14.5px}
}
@media (min-width:900px){
  .sheet .cardx{left:50%;right:auto;transform:translateX(-50%);width:560px;max-width:92vw;bottom:30px;
    max-height:84vh;border-radius:20px;border:1px solid var(--line);animation:upc .22s ease}
  .shbar{border-radius:20px 20px 0 0}
}
@keyframes upc{from{transform:translateX(-50%) translateY(16px);opacity:.6}to{transform:translateX(-50%);opacity:1}}
@media (max-width:899px){.deskbrand{display:none}}
@media (min-width:900px){.top .brand{display:none}}
</style>
</head>
<body>
<div class="deskbrand brand"><b>devnprt</b><span>.planner</span></div>

<header class="top"><div class="top-in">
  <div class="brand mobonly"><b>devnprt</b><span>.planner</span></div>
  <div class="top-sp"></div>
  <button class="chip" data-act="mode" id="modeChip"></button>
  <button class="iconbtn" data-act="go" data-v="set" title="Настройки">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
  </button>
</div></header>

<main id="view" class="wrap"></main>

<nav class="tabbar" id="tabs"></nav>
<div class="sheet" id="sheet"><div class="bgd" data-act="closeSheet"></div><div class="cardx"><div class="shbar"><div class="grab"></div><button class="shclose" data-act="closeSheet" aria-label="Закрыть">&#10005;</button></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============================ storage ============================ */
var KEY='devnprt.planner.v1', MEM=null;
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return MEM}}
function prune(){
  for(var d in S.log){var L=S.log[d];
    var e=(!L.done||!Object.keys(L.done).length)&&(!L.skip||!L.skip.length)&&(!L.ovr||!Object.keys(L.ovr).length)&&!L.shape&&!L.shield&&!L.focus;
    if(e)delete S.log[d];}
}
function save(){try{prune();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){MEM=S}}
var uid=function(){return Math.random().toString(36).slice(2,9)};

/* ============================ utils ============================ */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var prs=function(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
var todayIso=function(){return iso(new Date())};
var wday=function(s){var n=prs(s).getDay();return n===0?7:n};
var addD=function(s,n){var d=prs(s);d.setDate(d.getDate()+n);return iso(d)};
var monday=function(s){return addD(s,1-wday(s))};
var wserial=function(s){return Math.round((prs(monday(s))-prs('2024-01-01'))/6048e5)};
var t2m=function(t){var a=t.split(':');return (+a[0])*60+(+a[1])};
var m2t=function(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
var hm=function(m){if(m<=0)return '0 мин';var h=Math.floor(m/60),x=m%60;return (h?h+' ч':'')+(h&&x?' ':'')+(x?x+' мин':'')};

/* ============================ логика дня ============================ */
function isOdd(d){var p=S.settings.parity;return (Math.abs(wserial(d)-p.serial)%2===0)?p.odd:!p.odd}
function logOf(d){if(!S.log[d])S.log[d]={};var L=S.log[d];L.done=L.done||{};L.skip=L.skip||[];L.ovr=L.ovr||{};return L}
var SHAPES={norm:'Обычный',focus:'Фокус',half:'Половина',easy:'Лёгкий',off:'Выходной'};
var CUTS=[];

function instances(d){
  var L=logOf(d),wd=wday(d),odd=isOdd(d),mode=S.settings.mode,out=[],i,t;
  for(i=0;i<S.tasks.length;i++){
    t=S.tasks[i];
    if(!t.active)continue;
    if(t.only&&t.only!==mode)continue;
    if(t.date){ if(t.date!==d)continue; }
    else{
      var dd=(mode==='A'&&t.daysA)?t.daysA:t.days;
      if(!dd||dd.indexOf(wd)<0)continue;
      if(t.weeks==='odd'&&!odd)continue;
      if(t.weeks==='even'&&odd)continue;
    }
    var min=(mode==='A'&&typeof t.minA==='number')?t.minA:t.min;
    if(min<=0)continue;
    var o={id:t.id,title:t.title,dir:t.dir,min:min,at:t.at,core:t.core,note:t.note,optional:t.optional,
           ord:(typeof t.ord==='number'?t.ord:50),par:t.par||null,after:t.after||null,floor:t.floor||0,ref:t};
    var ov=L.ovr[t.id]; if(ov){ if(ov.min)o.min=ov.min; if(ov.at!==undefined)o.at=ov.at; }
    out.push(o);
  }
  /* если пары пропущены — вместо них практика */
  var skippedPair=out.some(function(o){return o.dir==='study'&&o.at&&L.skip.indexOf(o.id)>=0});
  var hasPract=out.some(function(o){return o.title.indexOf('Практика')===0});
  if(skippedPair&&!hasPract&&L.skip.indexOf('v-pract')<0)
    out.push({id:'v-pract',title:'Практика по дистанту вместо пар',dir:'study',min:90,at:null,note:'Пары пропущены, задачи всё равно нужны',virt:true});
  /* форма дня */
  var sh=L.shape||'norm',fd=L.focus||'android',kf=1;
  if(sh==='focus'){
    var ft=0;
    out.forEach(function(o){if(!o.at&&o.dir===fd)ft+=o.min});
    kf=ft?Math.min(2,360/ft):1;
  }
  CUTS=[];
  if(sh!=='norm'){
    out=out.map(function(o){
      if(o.at)return o;                                      /* якоря не трогаем */
      var k=1;
      if(sh==='half')k=.55; else if(sh==='easy')k=.4; else if(sh==='off')k=0;
      else if(sh==='focus')k=(o.dir===fd)?kf:.4;
      var fl=o.floor||0,want=Math.round(o.min*k/5)*5;
      if(k>=1){o.min=want;return o}
      if(want>=fl){o.min=Math.max(15,want);return o}
      /* короче минимума блок не бывает: либо оставляем минимум, либо убираем из дня */
      if((o.core||o.dir==='life')&&k>0){o.min=fl||Math.max(15,want);o.cut='min';return o}
      CUTS.push(o.title);o.min=0;return o;
    }).filter(function(o){return o.at||o.min>0});
  }
  return out;
}

function planDay(d){
  var L=logOf(d),items=instances(d),fixed=[],floats=[],pars=[],i;
  /* ---- совмещение дел: ищем хозяина, рвём взаимные ссылки и цепочки ---- */
  var alive=items.filter(function(x){return L.skip.indexOf(x.id)<0}),pick={};
  alive.forEach(function(o){
    if(!o.par)return;
    var cs=alive.filter(function(h){return h!==o&&(h.id===o.par||h.dir===o.par)});
    var back=function(h){return !!(h.par&&(h.par===o.id||h.par===o.dir))};
    cs.sort(function(a,b){return ((back(b)?1:0)-(back(a)?1:0))||((a.par?1:0)-(b.par?1:0))||(b.min-a.min)});
    pick[o.id]=cs[0]||null;
  });
  /* длинный блок не подстраивается под короткий: пара разворачивается */
  alive.forEach(function(o){
    var h=pick[o.id];
    if(!o.par||!h||h.min>=o.min)return;
    o.solo=true;
    if(!h.par||pick[h.id]===o){h.par=h.par||o.id;pick[h.id]=o}
  });
  alive.forEach(function(o){
    if(!o.par||!pick[o.id])return;
    var seen=[],cur=o,g=0;
    while(cur&&cur.par&&pick[cur.id]&&!cur.solo&&g++<8){
      if(seen.indexOf(cur)>=0){
        var cyc=seen.slice(seen.indexOf(cur));
        cyc.sort(function(a,b){return (b.min-a.min)||((a.ord==null?50:a.ord)-(b.ord==null?50:b.ord))||(a.id<b.id?-1:1)});
        cyc[0].solo=true;break;
      }
      seen.push(cur);cur=pick[cur.id];
    }
  });
  for(i=0;i<items.length;i++){
    var o=items[i];
    o.skipped=L.skip.indexOf(o.id)>=0;
    o.doneMin=L.done[o.id]||0;
    o.done=!o.skipped&&o.doneMin>=o.min-1;
    if(o.par&&!o.solo&&pick[o.id]&&!o.skipped)pars.push(o);
    else (o.at?fixed:floats).push(o);
  }
  fixed.sort(function(a,b){return t2m(a.at)-t2m(b.at)});
  fixed.forEach(function(o){o.s=t2m(o.at);o.e=o.s+o.min});
  var act=fixed.filter(function(o){return !o.skipped}),clash=[];
  var linked=function(a,b){return !!((a.par&&(a.par===b.id||a.par===b.dir))||(b.par&&(b.par===a.id||b.par===a.dir)))};
  for(i=1;i<act.length;i++){
    if(act[i].s<act[i-1].e&&!linked(act[i],act[i-1])){act[i].clash=true;act[i-1].clash=true;clash.push([act[i-1],act[i]])}
  }
  var busy=act.map(function(o){return {s:o.s,e:o.e}});
  var prio={sites:0,android:1,study:2,content:3,pdd:4,body:5,life:6};
  floats.sort(function(a,b){return ((a.ord==null?50:a.ord)-(b.ord==null?50:b.ord))||(prio[a.dir]-prio[b.dir])||(b.min-a.min)});
  var start=t2m(S.settings.wake)+20, end=t2m(S.settings.sleep)-30, breaks=[];
  /* свободные окна между якорями */
  var mb=[],bs=busy.slice().sort(function(a,b){return a.s-b.s});
  bs.forEach(function(b){
    var last=mb[mb.length-1];
    if(last&&b.s<=last.e)last.e=Math.max(last.e,b.e); else mb.push({s:b.s,e:b.e});
  });
  var win=[],c=start;
  mb.forEach(function(b){
    if(b.s>c&&b.s<end)win.push({s:c,e:Math.min(b.s,end)});
    c=Math.max(c,b.e+15);
  });
  if(c<end)win.push({s:c,e:end});
  win=win.filter(function(w){return w.e-w.s>=20});
  /* укладка: в каждое окно идёт самый приоритетный блок, который туда влезает */
  var pend=floats.filter(function(f){return !f.skipped}),acc=0,cur;
  for(var wi=0;wi<win.length;wi++){
    cur=win[wi].s;
    var guard=0;
    while(pend.length&&guard++<120){
      var idx=-1,jump=null;
      for(var k2=0;k2<pend.length;k2++){
        var cf=pend[k2],caf=cf.after?t2m(cf.after):0;
        if(caf>cur){ if(caf+cf.min<=win[wi].e&&(jump===null||caf<jump))jump=caf; continue; }
        if(cur+cf.min<=win[wi].e){idx=k2;break}
      }
      if(idx<0){ if(jump!==null&&jump>cur){cur=jump;acc=0;continue} break; }
      var f=pend.splice(idx,1)[0];
      f.s=cur;f.e=cur+f.min;
      var gap=f.min>=90?15:10; acc+=f.min;
      if(acc>=210){gap=45;acc=0}
      breaks.push({s:f.e,len:gap});
      cur=f.e+gap;
    }
  }
  /* второй проход: то, что не влезло из-за «не раньше», ставим куда получится */
  if(pend.length){
    var free2=[],cc;
    win.forEach(function(w){
      var used=floats.filter(function(f){return f.s!=null&&f.s>=w.s&&f.e<=w.e});
      cc=w.s;used.sort(function(a,b){return a.s-b.s}).forEach(function(u){
        if(u.s-cc>=20)free2.push({s:cc,e:u.s});cc=Math.max(cc,u.e+10);});
      if(w.e-cc>=20)free2.push({s:cc,e:w.e});
    });
    for(var w2=0;w2<free2.length&&pend.length;w2++){
      var c2=free2[w2].s,g2=0;
      while(pend.length&&g2++<40){
        var j2=-1;
        for(var k3=0;k3<pend.length;k3++){if(c2+pend[k3].min<=free2[w2].e){j2=k3;break}}
        if(j2<0)break;
        var f3=pend.splice(j2,1)[0];
        f3.s=c2;f3.e=c2+f3.min;f3.late=true;
        c2=f3.e+10;
      }
    }
  }
  pend.forEach(function(f){f.over=true;f.s=null;f.e=null});
  /* параллельные блоки встают поверх своего хозяина и не занимают отдельного времени */
  var pass=0,moved=true;
  while(moved&&pass++<5){
    moved=false;
    pars.forEach(function(o){
      if(o.s!=null)return;
      var h=pick[o.id];
      if(h&&h.s!=null&&!h.over){o.s=h.s;o.e=o.s+o.min;o.hostTitle=h.title;o.parallel=true;moved=true}
    });
  }
  pars.forEach(function(o){o.parallel=true;if(o.s==null)o.over=true});
  pars=pars.filter(function(o){return !o.over});
  var endAt=0;
  floats.concat(fixed).concat(pars).forEach(function(o){if(o.e&&!o.skipped&&!o.over)endAt=Math.max(endAt,o.e)});
  if(!endAt)endAt=start;
  var all=fixed.concat(floats.filter(function(f){return !f.over})).concat(pars);
  all.sort(function(a,b){return ((a.s==null?9999:a.s)-(b.s==null?9999:b.s))||((a.parallel?1:0)-(b.parallel?1:0))});
  var over=floats.filter(function(f){return f.over}).concat(items.filter(function(o){return o.par&&o.over}));
  var planned=0,doneM=0,byDir={},occupied=0;
  items.forEach(function(o){
    if(o.skipped)return;
    planned+=o.min; doneM+=Math.min(o.doneMin,o.min);
    byDir[o.dir]=(byDir[o.dir]||0)+o.min;
    if(!o.parallel)occupied+=o.min;
  });
  return {items:all,over:over,breaks:breaks,planned:planned,done:doneM,byDir:byDir,clash:clash,occupied:occupied,cut:CUTS.slice(),
          ratio:planned?doneM/planned:0,endAt:endAt,shape:L.shape||'norm'};
}

/* ---- оценка дня, серия, уровни ---- */
function dayCounted(d){
  var L=S.log[d]; if(!L)return false;
  if(L.shape==='off')return null;
  if(L.shield)return null;
  var p=planDay(d);
  if(!p.planned)return null;
  var need=(L.shape==='easy')?.5:.7;
  return p.ratio>=need;
}
function streak(){
  var n=0,d=todayIso(),c=dayCounted(d),guard=0;
  if(c===true)n++;
  d=addD(d,-1);
  while(guard++<400){
    var r=dayCounted(d);
    if(r===true)n++;
    else if(r===null){} else break;
    d=addD(d,-1);
  }
  return n;
}
function totalMin(from,to){
  var s=0;
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var o=S.log[d].done||{};
    for(var k in o)s+=o[k];
  }
  return s;
}
function minByDir(from,to){
  var r={};
  for(var d in S.log){
    if(from&&d<from)continue; if(to&&d>to)continue;
    var mp={}; instances(d).forEach(function(o){mp[o.id]=o.dir});
    var o=S.log[d].done||{};
    for(var k in o){var dir=mp[k]||findDir(k);if(!dir)continue;r[dir]=(r[dir]||0)+o[k]}
  }
  return r;
}
function findDir(id){var t=S.tasks.filter(function(x){return x.id===id})[0];return t?t.dir:(id==='v-pract'?'study':null)}
var RANKS=[[0,'Старт'],[25,'Разгон'],[75,'Поток'],[150,'Темп'],[300,'Ход'],[600,'Мастерская'],[1000,'Своя лига']];
function rank(){
  var h=totalMin()/60,cur=RANKS[0],next=null;
  for(var i=0;i<RANKS.length;i++){if(h>=RANKS[i][0])cur=RANKS[i];else{next=RANKS[i];break}}
  return {name:cur[1],h:h,next:next,from:cur[0]};
}
function shieldsLeft(){
  var m=todayIso().slice(0,7),used=0;
  for(var d in S.log)if(d.slice(0,7)===m&&S.log[d].shield)used++;
  return Math.max(0,2-used);
}

}

/* сводка по всей истории, одним проходом */
function history(){
  var r={days:0,big:0,huge:0,full:0,gym:0,drive:0,early:0,best:0,streakBest:(S.streak&&S.streak.best)||0,dir:{}};
  var ttl={};S.tasks.forEach(function(t){ttl[t.id]=t.title||''});
  for(var d in S.log){
    var done=S.log[d].done||{},sum=0,byd={},k,dir;
    for(k in done){
      sum+=done[k];dir=findDir(k);
      if(dir)byd[dir]=(byd[dir]||0)+done[k];
      if((ttl[k]||'').indexOf('Вождение')===0&&done[k]>=60)r.drive++;
    }
    if(!sum)continue;
    r.days++;
    if(sum>=480)r.big++;
    if(sum>=600)r.huge++;
    if((byd.body||0)>=60)r.gym++;
    r.best=Math.max(r.best,sum);
    for(k in byd)r.dir[k]=(r.dir[k]||0)+byd[k];
    var p=planDay(d);
    if(p.planned&&p.done>=p.planned-1)r.full++;
  }
  return r;
}

var SH=document.getElementById('sheet'),SB=document.getElementById('sheetBody');
var LOCKY=0;
function openSheet(html){
  if(!SH.classList.contains('open')){
    LOCKY=window.scrollY;document.body.style.top=(-LOCKY)+'px';document.body.classList.add('lock');
  }
  SB.innerHTML=html;SH.classList.add('open');
  var cx=SH.querySelector('.cardx');cx.scrollTop=0;cx.style.transform='';
}
function closeSheet(){
  if(!SH.classList.contains('open'))return;
  SH.classList.remove('open');document.body.classList.remove('lock');document.body.style.top='';
  window.scrollTo(0,LOCKY);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&SH.classList.contains('open')){closeSheet();return}
  if(e.key==='Enter'&&SH.classList.contains('open')&&e.target.tagName==='INPUT'&&e.target.type!=='date'&&e.target.type!=='time'){
    var pri=SB.querySelector('.btn.pri');if(pri){e.preventDefault();pri.click()}
  }
});
(function(){
  var sy=null,cx=null;
  SH.addEventListener('touchstart',function(e){
    if(!e.target.closest('.shbar'))return;
    cx=SH.querySelector('.cardx');sy=e.touches[0].clientY;cx.style.transition='none';
  },{passive:true});
  SH.addEventListener('touchmove',function(e){
    if(sy===null)return;var dy=e.touches[0].clientY-sy;
    if(dy>0)cx.style.transform='translateY('+dy+'px)';
  },{passive:true});
  SH.addEventListener('touchend',function(){
    if(sy===null)return;
    var m=/translateY\(([\d.]+)px\)/.exec(cx.style.transform||'');
    cx.style.transition='';cx.style.transform='';
    if(m&&parseFloat(m[1])>90)closeSheet();
    sy=null;
  });
})();

function sheetMenu(id){
  var d=S.ui.date,L=logOf(d),p=planDay(d);
  var o=p.items.concat(p.over).filter(function(x){return x.id===id})[0];
  if(!o)return;
  var tk=S.tasks.filter(function(x){return x.id===id})[0],once=!!(tk&&tk.date);
  var h='<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12px;margin:-9px 0 13px">'+
      (o.virt?'Подстановка вместо пар':(once?'Разовая задача, только на '+dateShort(d):'Повторяется по шаблону недели'))+'</div>'+
    '<div class="menu">'+
    '<button data-act="toggle" data-id="'+id+'">'+(o.done?'Снять отметку':'Отметить сделанным')+'</button>'+
    '<button data-act="part" data-id="'+id+'">Записать часть времени</button>'+
    '<button data-act="tune" data-id="'+id+'">Сдвинуть время или длительность, только сегодня</button>'+
    '<button data-act="tomorrow" data-id="'+id+'">Перенести на завтра</button>'+
    (once
      ? '<button data-act="edit" data-id="'+id+'">Изменить эту задачу</button>'+
        '<button data-act="delTask" data-id="'+id+'" style="color:var(--warn)">Удалить задачу</button>'
      : '<button data-act="skip" data-id="'+id+'">'+(o.skipped?'Вернуть в этот день':(o.optional?'Не идти, взять практику':'Убрать из этого дня'))+'</button>'+
        (o.virt?'':'<button data-act="edit" data-id="'+id+'">Изменить шаблон, повлияет на все недели</button>'))+
    '</div>';
  openSheet(h);
}
function sheetTask(id){
  var t=id?S.tasks.filter(function(x){return x.id===id})[0]:null;
  var nw=!t;
  t=t||T({title:'',dir:'sites',min:60,days:[1,2,3,4,5]});
  var mA=S.settings.mode==='A';
  var eMin=(mA&&typeof t.minA==='number')?t.minA:t.min;
  var eDays=((mA&&t.daysA)?t.daysA:(t.days||[]));
  var oMin=(mA?t.min:(typeof t.minA==='number'?t.minA:t.min));
  var oDays=(mA?(t.days||[]):((t.daysA)?t.daysA:(t.days||[])));
  var diff=(oMin!==eMin)||(oDays.join()!==eDays.join());
  var h='<h3>'+(nw?'Новая задача':'Задача')+'</h3>'+
   '<div class="f"><label>Название</label><input type="text" id="f_title" value="'+esc(t.title)+'" placeholder="Например: Android, второй блок"></div>'+
   '<div class="f"><label>Направление</label><div class="seg" id="f_dir">'+DKEYS.map(function(k){
      return '<button data-pick="dir" data-v="'+k+'" class="'+(t.dir===k?'on':'')+'">'+DIRS[k].t+'</button>'}).join('')+'</div></div>'+
   '<div class="dim" style="font-size:11.5px;margin:-6px 0 12px">Правите режим «'+(mA?'С работой':'Полный день')+'». '+
     (diff?'В другом режиме: '+hm(oMin)+', '+(oDays.length?oDays.map(function(x){return WDS[x-1]}).join(' '):'нет дней'):'Во втором режиме сейчас так же')+'</div>'+
   '<div style="display:flex;gap:12px"><div class="f" style="flex:1"><label>Минут</label><input type="number" inputmode="numeric" id="f_min" value="'+eMin+'"></div>'+
   '<div class="f" style="flex:1"><label>Время</label><input type="time" id="f_at" value="'+(t.at||'')+'"></div></div>'+
   '<div class="dim" style="font-size:11.5px;margin:-8px 0 14px">Пустое время = плавающий блок, приложение само поставит его в свободное окно.</div>'+
   '<div class="f"><label>Дни недели</label><div class="days" id="f_days">'+WDS.map(function(w,i){
      return '<button data-pick="day" data-v="'+(i+1)+'" class="'+(eDays.indexOf(i+1)>=0?'on':'')+'">'+w+'</button>'}).join('')+'</div></div>'+
   '<div style="display:flex;gap:12px"><div class="f" style="flex:1"><label>Не раньше</label><input type="time" id="f_after" value="'+(t.after||'')+'"></div>'+
   '<div class="f" style="flex:1"><label>Не короче, мин</label><input type="number" inputmode="numeric" id="f_floor" value="'+(t.floor||0)+'"></div></div>'+
   '<div class="dim" style="font-size:11.5px;margin:-8px 0 14px">«Не короче» держит блок в лёгкие дни: короче этого он не станет, а если совсем не вмещается, уйдёт из дня целиком.</div>'+
   '<div style="display:flex;gap:12px">'+
   '<div class="f" style="flex:1"><label>Совмещается с</label><div class="seg" id="f_par">'+
     [['','нет']].concat(DKEYS.map(function(k){return [k,DIRS[k].t]})).map(function(x){
       return '<button data-pick="par" data-v="'+x[0]+'" class="'+(((t.par||'')===x[0])?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div></div>'+
   '<div class="dim" style="font-size:11.5px;margin:-8px 0 14px">Достаточно отметить у одного дела из пары. Если отмечено у обоих, главным станет тот, что длиннее, второй встанет поверх него. Пары нет в этом дне, блок просто встанет сам по себе.</div>'+
   '<div class="f"><label>Какие недели</label><div class="seg" id="f_weeks">'+
      [['all','Все'],['odd','Нечётные'],['even','Чётные']].map(function(x){
      return '<button data-pick="weeks" data-v="'+x[0]+'" class="'+(t.weeks===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div></div>'+
   '<div class="f"><label>Или разовая дата</label><input type="date" id="f_date" value="'+(t.date||'')+'"></div>'+
   '<div class="f"><label>Заметка</label><input type="text" id="f_note" value="'+esc(t.note||'')+'" placeholder="Коротко, зачем этот блок"></div>'+
   '<div class="trow" style="border-bottom:0"><div class="mid"><div class="nm">Входит в минимум дня</div><div class="mt">Такие блоки держат серию</div></div>'+
   '<button class="sw'+(t.core?' on':'')+'" data-pick="core"><i></i></button></div>'+
   '<div class="row-btns" style="margin-top:16px"><button class="btn pri" data-act="saveTask" data-id="'+(nw?'':t.id)+'">Сохранить</button>'+
   (nw?'':'<button class="btn danger" data-act="delTask" data-id="'+t.id+'">'+(t.date?'Удалить':'Удалить из всех недель')+'</button>')+
   '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>';
  TMP={dir:t.dir,days:eDays.slice(),weeks:t.weeks,core:!!t.core,par:t.par||'',mA:mA};
  openSheet(h);
}

/* ============================ действия ============================ */
/* двухшаговое подтверждение прямо в кнопке, без системных окон */
function armed(el,ask){
  if(el.dataset.arm==='1')return true;
  var old=el.textContent;el.dataset.arm='1';el.textContent=ask;el.classList.add('danger');
  clearTimeout(el._a);el._a=setTimeout(function(){el.dataset.arm='';el.textContent=old;},4000);
  return false;
}
var SCROLLS={};
function render(to){
  var y=document.body.classList.contains('lock')?LOCKY:window.scrollY,v=S.ui.view;
  if(v==='day')viewDay();else if(v==='week')viewWeek();else if(v==='tasks')viewTasks();
  else if(v==='flow')viewFlow();else if(v==='stat')viewStat();else viewSet();
  renderTabs();tickClock();
  var t=(to===true)?0:(typeof to==='number'?to:y);
  if(document.body.classList.contains('lock'))LOCKY=t; else window.scrollTo(0,t);
}
function go(v){if(S.ui.view!==v)SCROLLS[S.ui.view]=window.scrollY;S.ui.view=v;save();render(SCROLLS[v]||0)}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-pick]');if(!el)return;
  var id=el.dataset.id,v=el.dataset.v,d=S.ui.date,L;
  if(el.dataset.pick){
    var p=el.dataset.pick;
    if(p==='dir'){TMP.dir=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='weeks'){TMP.weeks=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='stage'){TMP.stage=+v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',+b.dataset.v===+v)})}
    if(p==='day'){var n=+v,i=TMP.days.indexOf(n);if(i<0)TMP.days.push(n);else TMP.days.splice(i,1);el.classList.toggle('on')}
    if(p==='core'){TMP.core=!TMP.core;el.classList.toggle('on')}
    if(p==='par'){TMP.par=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='kind'){TMP.kind=v;el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    if(p==='qdone'){TMP.qdone=!TMP.qdone;el.classList.toggle('on')}
    if(p==='pmin'){var pi=document.getElementById('p_min')||document.getElementById('q_min');if(pi)pi.value=v;
      el.parentNode.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
    return;
  }
  var a=el.dataset.act;
  switch(a){
    case 'go': go(v); break;
    case 'closeSheet': closeSheet(); break;
    case 'dday': S.ui.date=addD(d,+v); save(); render(true); break;
    case 'dtoday': S.ui.date=todayIso(); save(); render(true); break;
    case 'openday': S.ui.date=v; go('day'); break;
    case 'dweek': S.ui.week=addD(S.ui.week,+v*7); save(); render(true); break;
    case 'wtoday': S.ui.week=monday(todayIso()); save(); render(true); break;
    case 'mode': S.settings.mode=S.settings.mode==='B'?'A':'B'; save(); render();
      toast(S.settings.mode==='B'?'Режим: полный день на себя':'Режим: с работой в банке'); break;
    case 'setmode': S.settings.mode=v; save(); render(); break;
    case 'parity': S.settings.parity={serial:wserial(todayIso()),odd:!isOdd(todayIso())}; save(); render();
      toast('Текущая неделя теперь '+(isOdd(todayIso())?'нечётная':'чётная')); break;
    case 'theme': S.settings.theme=S.settings.theme==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',S.settings.theme); save(); render(); break;
    case 'togBreaks': S.settings.breaks=!S.settings.breaks; save(); render(); break;
    case 'shape': sheetShape(); break;
    case 'pickShape': L=logOf(d); L.shape=v; if(v!=='focus')delete L.focus; save(); closeSheet(); render(); break;
    case 'pickFocus': L=logOf(d); L.shape='focus'; L.focus=v; save(); closeSheet(); render(); break;
    case 'shield': L=logOf(d); L.shield=!L.shield; save(); closeSheet(); render(); toast(L.shield?'Щит поставлен, серия цела':'Щит снят'); break;
    case 'toggle': {
      L=logOf(d);
      var pl=planDay(d),o=pl.items.concat(pl.over).filter(function(x){return x.id===id})[0];
      if(!o)break;
      if(o.done)delete L.done[id]; else L.done[id]=o.min;
      save(); closeSheet(); render();
      if(!o.done){var r=planDay(d).ratio; if(r>=0.999)toast('День закрыт полностью');}
      break; }
    case 'menu': sheetMenu(id); break;
    case 'timer': {
      var t=S.ui.timer;
      if(t&&t.id===id&&t.date===d){
        var mins=Math.min(480,Math.max(1,Math.round((Date.now()-t.t0)/60000)));
        L=logOf(d); L.done[id]=(L.done[id]||0)+mins; S.ui.timer=null; save(); render(); toast('Записано '+hm(mins));
      }else{ S.ui.timer={id:id,date:d,t0:Date.now()}; save(); render(); toast('Таймер пошёл'); }
      break; }
    case 'part': sheetPart(id); break;
    case 'savePart': {
      var pm=parseInt(document.getElementById('p_min').value,10)||0;
      if(pm<=0){toast('Укажите минуты');break}
      L=logOf(d); L.done[id]=Math.min(1440,(L.done[id]||0)+pm);
      save(); closeSheet(); render(); toast('Записано '+hm(pm)); break; }
    case 'tune': sheetTune(id); break;
    case 'saveTune': {
      L=logOf(d);
      var at=document.getElementById('t_at').value,mn=parseInt(document.getElementById('t_min').value,10);
      L.ovr[id]={at:at||null,min:mn||undefined};
      if(!at)L.ovr[id].at=null;
      save(); closeSheet(); render(); break; }
    case 'resetTune': L=logOf(d); delete L.ovr[id]; save(); closeSheet(); render(); break;
    case 'skip': {
      L=logOf(d); var i2=L.skip.indexOf(id);
      if(i2<0)L.skip.push(id); else L.skip.splice(i2,1);
      save(); closeSheet(); render(); break; }
    case 'tomorrow': {
      var pl2=planDay(d),o2=pl2.items.concat(pl2.over).filter(function(x){return x.id===id})[0];
      if(!o2)break;
      S.tasks.push(T({title:o2.title,dir:o2.dir,min:o2.min-(o2.doneMin||0),at:null,days:[],date:addD(d,1),note:'перенесено с '+dateShort(d)}));
      L=logOf(d); if(L.skip.indexOf(id)<0)L.skip.push(id);
      save(); closeSheet(); render(); toast('Перенесено на завтра'); break; }
    case 'pull': {
      var py=planDay(v),oy=py.items.concat(py.over).filter(function(x){return x.id===id})[0];
      if(!oy)break;
      S.tasks.push(T({title:oy.title,dir:oy.dir,min:oy.min-(oy.doneMin||0),at:null,days:[],date:d,note:'хвост с '+dateShort(v)}));
      var Ly=logOf(v); if(Ly.skip.indexOf(id)<0)Ly.skip.push(id);
      save(); render(); break; }
    case 'addToday': sheetDayTask(); break;
    case 'addDay': {
      var qt=document.getElementById('q_title').value.trim();
      if(!qt){toast('Напишите, что за задача');break}
      var qm=parseInt(document.getElementById('q_min').value,10)||30;
      var qn=T({title:qt,dir:TMP.dir||'sites',min:qm,at:document.getElementById('q_at').value||null,days:[],date:d,ord:20});
      S.tasks.push(qn);
      if(TMP.qdone){L=logOf(d);L.done[qn.id]=qm}
      save(); closeSheet(); render();
      toast(TMP.qdone?'Записал как сделанное, '+hm(qm):'Добавлено в '+dateShort(d)); break; }
    case 'newtask': sheetTask(null); break;
    case 'edit': closeSheet(); sheetTask(id); break;
    case 'toggleTask': {
      var tt=S.tasks.filter(function(x){return x.id===id})[0]; if(tt){tt.active=!tt.active;save();render()} break; }
    case 'saveTask': {
      var vDays=TMP.days.slice().sort(),vDate=document.getElementById('f_date').value||null;
      if(!vDate&&!vDays.length){toast('Выберите дни недели или разовую дату');break}
      var nt=id?S.tasks.filter(function(x){return x.id===id})[0]:T({});
      nt.title=document.getElementById('f_title').value.trim()||'Без названия';
      nt.dir=TMP.dir||'sites';
      var newMin=parseInt(document.getElementById('f_min').value,10)||30;
      if(TMP.mA&&typeof nt.minA==='number')nt.minA=newMin; else nt.min=newMin;
      nt.at=document.getElementById('f_at').value||null;
      nt.after=document.getElementById('f_after').value||null;
      nt.floor=parseInt(document.getElementById('f_floor').value,10)||0;
      nt.par=TMP.par||null;
      nt.date=document.getElementById('f_date').value||null;
      if(TMP.mA&&nt.daysA)nt.daysA=vDays.slice(); else nt.days=vDays.slice();
      nt.weeks=TMP.weeks||'all';
      nt.core=!!TMP.core;
      nt.note=document.getElementById('f_note').value.trim();
      nt.active=true;
      if(!id)S.tasks.push(nt);
      save(); closeSheet(); render(); toast('Сохранено'); break; }
    case 'delTask': {
      var pre=S.tasks.filter(function(x){return x.id===id})[0];
      if(!armed(el,(pre&&pre.date)?'Точно удалить?':'Удалить во всех днях?'))break;
      var gone=pre;
      S.tasks=S.tasks.filter(function(x){return x.id!==id}); save(); closeSheet(); render();
      toast('Задача удалена',function(){if(gone){S.tasks.push(gone);save();render()}}); break; }
    case 'undo': { if(UNDO){var uf=UNDO;UNDO=null;
      var te=document.getElementById('toast');te.classList.remove('on');te.classList.remove('act');uf();toast('Восстановлено')} break; }
    case 'quick': {
      if(v==='drive')sheetTask(null),setTimeout(function(){
        document.getElementById('f_title').value='Вождение';
        document.getElementById('f_min').value=120;
        document.getElementById('f_at').value='15:00';
        document.getElementById('f_date').value=S.ui.date;
        TMP.dir='pdd';TMP.days=[];
        document.querySelectorAll('#f_dir button').forEach(function(b){b.classList.toggle('on',b.dataset.v==='pdd')});
        document.querySelectorAll('#f_days button').forEach(function(b){b.classList.remove('on')});
      },0);
      if(v==='once')sheetTask(null),setTimeout(function(){
        document.getElementById('f_date').value=S.ui.date;TMP.days=[];
        document.querySelectorAll('#f_days button').forEach(function(b){b.classList.remove('on')});},0);
      if(v==='pair')sheetTask(null),setTimeout(function(){
        document.getElementById('f_title').value='ТИСБИ, пары';
        document.getElementById('f_min').value=170;
        document.getElementById('f_at').value='08:00';
        TMP.dir='study';
        document.querySelectorAll('#f_dir button').forEach(function(b){b.classList.toggle('on',b.dataset.v==='study')});},0);
      break; }
    case 'newcard': sheetCard(v,null); break;
    case 'editcard': sheetCard(v,id); break;
    case 'newmoney': sheetMoney(null); break;
    case 'editmoney': sheetMoney(id); break;
    case 'saveMoney': {
      var mr=id?S.income.filter(function(x){return x.id===id})[0]:{id:uid()};
      mr.title=document.getElementById('m_title').value.trim()||'Без названия';
      mr.kind=TMP.kind||'job';
      mr.sum=parseInt(document.getElementById('m_sum').value,10)||0;
      mr.hours=parseFloat(document.getElementById('m_hours').value)||0;
      mr.date=document.getElementById('m_date').value||todayIso();
      if(!id)S.income.push(mr);
      save(); closeSheet(); render(); toast('Записано'); break; }
    case 'delMoney': {
      if(!armed(el,'Удалить запись?'))break;
      var goneM=S.income.filter(function(x){return x.id===id})[0];
      S.income=S.income.filter(function(x){return x.id!==id});
      save(); closeSheet(); render();
      toast('Запись удалена',function(){if(goneM){S.income.push(goneM);save();render()}}); break; }
    case 'saveCard': {
      var arr=v==='c'?S.clients:S.reels,c=id?arr.filter(function(x){return x.id===id})[0]:{id:uid()};
      c.name=document.getElementById('c_name').value.trim()||'Без названия';
      c.note=document.getElementById('c_note').value.trim();
      if(v==='c'){var su=document.getElementById('c_sum');c.sum=su?su.value:''}
      var st=TMP.stage||0;
      if(v==='c'&&st===4&&c.stage!==4)c.paidAt=todayIso();
      c.stage=st;
      if(!id)arr.push(c);
      save(); closeSheet(); render(); break; }
    case 'delCard': {
      if(!armed(el,'Удалить насовсем?'))break;
      var arrC=v==='c'?S.clients:S.reels,goneC=arrC.filter(function(x){return x.id===id})[0];
      if(v==='c')S.clients=S.clients.filter(function(x){return x.id!==id});
      else S.reels=S.reels.filter(function(x){return x.id!==id});
      save(); closeSheet(); render();
      toast('Удалено',function(){(v==='c'?S.clients:S.reels).push(goneC);save();render()}); break; }
    case 'mv': {
      var kind=v[0],dir=+v.slice(1),arr2=kind==='c'?S.clients:S.reels;
      var card=arr2.filter(function(x){return x.id===id})[0]; if(!card)break;
      var mx=(kind==='c'?CL:RL).length-1;
      var ns=Math.max(0,Math.min(mx,card.stage+dir));
      if(kind==='c'&&ns===4&&card.stage!==4)card.paidAt=todayIso();
      card.stage=ns; save(); render();
      if(kind==='c'&&ns===4)toast('Оплата. Отличная новость');
      break; }
    case 'export': {
      var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      var a2=document.createElement('a');a2.href=URL.createObjectURL(blob);
      a2.download='devnprt.planner-'+todayIso()+'.json';a2.click();
      setTimeout(function(){URL.revokeObjectURL(a2.href)},2000); break; }
    case 'copyData': {
      var txt=JSON.stringify(S);
      if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Скопировано')},function(){prompt('Скопируйте вручную',txt)});
      else prompt('Скопируйте вручную',txt);
      break; }
    case 'importBtn': document.getElementById('fileIn').click(); break;
    case 'reset': {
      if(!armed(el,'Точно сбросить всё?'))break;
      S=defaults(); save(); render(true); toast('Всё сброшено'); break; }
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.set){
    var k=el.dataset.set;
    S.settings[k]=(k==='goal')?(parseInt(el.value,10)||0):el.value;
    save(); if(k!=='goal')render();
  }
  if(el.dataset.norm){S.settings.norms[S.settings.mode][el.dataset.norm]=parseFloat(el.value)||0;save()}
  if(el.id==='fileIn'&&el.files&&el.files[0]){
    var fr=new FileReader();
    fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o.tasks)throw 0;S=o;save();render();toast('Данные загружены')}catch(err){toast('Файл не подходит')}};
    fr.readAsText(el.files[0]);
  }
});
function sheetShape(){
  var L=logOf(S.ui.date);
  var h='<h3>Режим дня</h3><div class="menu">'+
    ['norm','half','easy','off'].map(function(k){
      var ds={norm:'Как в шаблоне',half:'Все плавающие блоки короче примерно вдвое',easy:'Восстановление, минимум нагрузки',off:'Только якоря: пары, вождение, сторис'}[k];
      return '<button data-act="pickShape" data-v="'+k+'"><div><div>'+SHAPES[k]+(L.shape===k||(!L.shape&&k==='norm')?' ✓':'')+'</div><div class="dim" style="font-size:12px">'+ds+'</div></div></button>'}).join('')+
    '</div><div class="h2" style="margin:18px 0 9px">Фокус-день на одном направлении</div><div class="seg">'+
    ['android','sites','content','pdd'].map(function(k){
      return '<button data-act="pickFocus" data-v="'+k+'" class="'+(L.shape==='focus'&&L.focus===k?'on':'')+'">'+DIRS[k].t+'</button>'}).join('')+
    '</div><div class="dim" style="font-size:12px;margin-top:9px">В фокус-дне выбранное направление растёт примерно в полтора раза, остальное сжимается. Так закрываются большие куски без ночных авралов.</div>'+
    '<div class="row-btns" style="margin-top:18px"><button class="btn sm" data-act="shield">'+((S.log[S.ui.date]||{}).shield?'Снять щит':'Поставить щит на день')+'</button></div>'+
    '<div class="dim" style="font-size:12px;margin-top:9px">Щит сохраняет серию в день, когда не получилось. Два щита в месяц, осталось '+shieldsLeft()+'.</div>';
  openSheet(h);
}
function sheetDayTask(){
  var d=S.ui.date;
  TMP={dir:'sites',qdone:false};
  openSheet('<h3>Задача на '+dateShort(d)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 14px">Встанет только в этот день. Шаблон недели не меняется.</div>'+
    '<div class="f"><label>Что делаю</label><input type="text" id="q_title" placeholder="Например: смета для детейлинга"></div>'+
    '<div class="f"><label>Направление</label><div class="seg" id="f_dir">'+DKEYS.map(function(k){
       return '<button data-pick="dir" data-v="'+k+'" class="'+(k==='sites'?'on':'')+'">'+DIRS[k].t+'</button>'}).join('')+'</div></div>'+
    '<div class="f"><label>Сколько минут</label><div class="mins">'+[30,45,60,90,120,180].map(function(x){
       return '<button data-pick="pmin" data-v="'+x+'">'+hm(x)+'</button>'}).join('')+'</div>'+
    '<input type="number" inputmode="numeric" id="q_min" value="60"></div>'+
    '<div class="f"><label>Время</label><input type="time" id="q_at"></div>'+
    '<div class="dim" style="font-size:11.5px;margin:-8px 0 12px">Пустое время = плавающий блок, приложение само найдёт ему окно.</div>'+
    '<div class="trow" style="border-bottom:0"><div class="mid"><div class="nm">Уже сделано</div>'+
    '<div class="mt">Сразу засчитаю это время в день</div></div>'+
    '<button class="sw" data-pick="qdone"><i></i></button></div>'+
    '<div class="row-btns"><button class="btn pri" data-act="addDay">Добавить</button>'+
    '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>');
}
function sheetPart(id){
  var d=S.ui.date,p=planDay(d),o=p.items.concat(p.over).filter(function(x){return x.id===id})[0];
  if(!o)return;
  var left=Math.max(5,o.min-(o.doneMin||0)),base=[15,30,45,60,90];
  if(base.indexOf(left)<0)base.push(left);base.sort(function(a,b){return a-b});
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div class="dim" style="font-size:12.5px;margin:-8px 0 13px">Записано '+hm(o.doneMin||0)+' из '+hm(o.min)+'. Блок закроется сам, когда наберётся полностью.</div>'+
    '<div class="mins">'+base.map(function(x){return '<button data-pick="pmin" data-v="'+x+'">'+hm(x)+'</button>'}).join('')+'</div>'+
    '<div class="f"><label>Минут</label><input type="number" inputmode="numeric" id="p_min" value="'+left+'"></div>'+
    '<div class="row-btns"><button class="btn pri" data-act="savePart" data-id="'+id+'">Записать</button>'+
    '<button class="btn ghost" data-act="closeSheet">Отмена</button></div>');
}
function sheetTune(id){
  var d=S.ui.date,p=planDay(d),o=p.items.concat(p.over).filter(function(x){return x.id===id})[0];
  if(!o)return;
  openSheet('<h3>'+esc(o.title)+'</h3>'+
    '<div style="display:flex;gap:12px"><div class="f" style="flex:1"><label>Время</label><input type="time" id="t_at" value="'+(o.at||'')+'"></div>'+
    '<div class="f" style="flex:1"><label>Минут</label><input type="number" inputmode="numeric" id="t_min" value="'+o.min+'"></div></div>'+
    '<div class="dim" style="font-size:12px">Меняется только этот день, шаблон остаётся прежним.</div>'+
    '<div class="row-btns" style="margin-top:16px"><button class="btn pri" data-act="saveTune" data-id="'+id+'">Сохранить</button>'+
    '<button class="btn" data-act="resetTune" data-id="'+id+'">Вернуть как в шаблоне</button></div>');
}
/* тикер таймера */
function tickClock(){
  var el=document.getElementById('runclock');
  if(el&&S.ui.timer)el.textContent=' · идёт '+hm(Math.max(1,Math.round((Date.now()-S.ui.timer.t0)/60000)));
}
setInterval(tickClock,20000);
/* смена даты на новый день */
setInterval(function(){
  if(S.ui.view==='day'&&S.ui._d&&S.ui._d!==todayIso()){S.ui._d=todayIso();S.ui.date=todayIso();render(true);S.ui._d=todayIso();return}
  S.ui._d=todayIso();
  if(S.ui.view==='day'&&S.ui.date===todayIso()&&!SH.classList.contains('open'))render();
},60000);
render();
</script>
</body>
</html>
